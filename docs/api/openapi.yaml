  /business-profiles:
    get:
      operationId: getBusinessProfiles
      summary: The business profiles listed in Settings → Data, with the visits, conversions and revenue from each.
      description: |
        Each profile (Google Business Profile, Bing Places, Apple Business
        Connect or another directory) has a tagged website link with
        `utm_source` its platform, `utm_medium=business_profile` and
        `utm_campaign` its campaign, made from its name. A profile's row
        counts the visits in the Business profiles channel with its
        campaign; `channel` counts the whole channel, which also has map
        apps' visits without the link. `conversions` sums every goal's
        completions; revenue is every event's amount, refunds taken off,
        one amount per currency. `profiles` is empty while the setting is
        off or lists none. The demo data has one Google profile.
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/filters'
        - $ref: '#/components/parameters/data'
