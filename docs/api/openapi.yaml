openapi: 3.1.0
info:
  title: SEO Pro Analytics API
  version: 0.2.0
  summary: Site statistics for people, dashboards and AI agents.
  description: |
    Read routes of SEO Pro Analytics (namespace `seoproanalytics/v1`). WordPress
    serves them under `/wp-json/seoproanalytics/v1`. A standalone app serves the
    same routes and answers, so clients work with either.

    Reading needs the `view_seoproanalytics` capability (people who can manage
    options, by default). Agents and scripts authenticate with an
    Application Password (HTTP Basic); the dashboard uses the logged-in
    cookie and a `wp_rest` nonce.

    Times are ISO 8601 in the site time zone; ranges are half-open
    (`from` inclusive, `to` exclusive). Rates are fractions (0.5 = 50%);
    durations are whole seconds. Metric definitions:
    docs/architecture.md → Reports → Metric definitions.

    Answers are cached for up to five minutes; `generated` says when an
    answer was worked out and `cached` whether it came from the cache.

    Every report reads live statistics, or with `data=demo` the demo data:
    made-up visits in tables of their own, for training, screenshots and
    testing (`/demo` makes and removes it). The two are never mixed; goals
    and funnels belong to a data set too (demo data comes with examples).

    Changing goals and funnels needs the `manage_options` capability.
  license:
    name: GPL-3.0-or-later
    identifier: GPL-3.0-or-later
servers:
  - url: /wp-json/seoproanalytics/v1
security:
  - applicationPassword: []
  - cookieNonce: []

paths:
  /alerts:
    get:
      operationId: alerts
      summary: Open and recently resolved statistics health alerts.
      description: Requires manage_options. Read-only, private, no-store; never runs checks or sends mail. State is checked hourly in cron and on admin requests. Unix timestamps; resolved is zero while open. Resolved entries expire after seven days. No demo variant.
      responses:
        '200':
          description: Stored alerts, empty before the first check or when healthy.
          content:
            application/json:
              schema:
                type: object
                required: [alerts]
                properties:
                  alerts:
                    type: array
                    items:
                      type: object
                      required: [key, kind, message, action, since, sent, resolved, delay, resolved_sent]
                      properties:
                        key: {type: string, description: Stable key; source_failing has a colon and the source key.}
                        kind: {type: string, enum: [hits_stopped, jobs_late, summaries_behind, collector_broken, source_failing, email_failing]}
                        message: {type: string}
                        action: {type: string}
                        since: {type: integer, description: First seen Unix timestamp.}
                        sent: {type: integer, description: Last successful alert send; zero before sending.}
                        resolved: {type: integer, description: Recovery Unix timestamp; zero while open.}
                        resolved_sent: {type: integer, description: Successful recovery send; zero before sending.}
                        delay: {type: integer, description: Seconds after first seen before emailing.}
                        fingerprint: {type: string, description: Hash identifying the same source error; never error content.}
                        observed: {type: integer, description: Source error timestamp at the latest observation.}
        '403': {$ref: '#/components/responses/Forbidden'}
  /email/test:
    post:
      operationId: emailTest
      summary: Send a branded sample email with every block type.
      description: Requires manage_options. Sends through WordPress and configured delivery plugins. Figures are samples, not live reports. Success means accepted by WordPress, not confirmed delivery.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                to: {type: string, format: email, description: Defaults to the authenticated user's email.}
      responses:
        '200':
          description: WordPress accepted the test email.
          content:
            application/json:
              schema:
                type: object
                required: [sent]
                properties:
                  sent: {type: boolean, const: true}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500':
          description: Delivery failed; WordPress error response includes the transport reason. A failed diagnostic entry is recorded without addresses or content.
  /email/log:
    get:
      operationId: emailLog
      summary: Latest 50 email send diagnostics, newest first.
      description: Requires manage_options. Private, no-store. No addresses or message content; arbitrary transport errors are reduced to safe categories.
      responses:
        '200':
          description: Diagnostic log, empty before any send.
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  type: object
                  required: [t, kind, ref, recipients, result, error]
                  properties:
                    t: {type: integer, description: Unix timestamp.}
                    kind: {type: string, enum: [test, report, alert]}
                    ref: {type: string, description: Share ID or alert key, or empty.}
                    recipients: {type: integer}
                    result: {type: string, enum: [sent, failed]}
                    error: {type: string, description: Safe failure category; empty on success.}
        '403': {$ref: '#/components/responses/Forbidden'}
  /vitals:
    get:
      operationId: vitals
      summary: Locally stored Chrome UX Report page experience (no remote requests; the SEO Pro Analytics Connect add-on or the demo writes it).
      description: Origin p75 history and monitored pages, poor Core Web Vitals first by search clicks and visits. Dates are the end of overlapping 28-day collection periods. Time metrics are milliseconds; CLS is unitless. Missing data is never a zero or passing score. Traffic counts cover the latest 30 days, independent of other report filters. Not available on shared report links.
      parameters:
        - name: page
          in: query
          schema: {type: string, default: ''}
          description: Optional local path, such as /pricing/; empty lists monitored pages.
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: Field data, latest samples and origin series.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VitalsAnswer'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /vitals/lighthouse:
    post:
      operationId: lighthouse
      summary: Explicit administrator-only mobile Lighthouse lab test for one local page.
      description: Registered by the SEO Pro Analytics Connect add-on, not the free plugin (404 without it); the dashboard offers it only while the add-on's Chrome UX Report connection is registered and connected. Requires manage_options.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [page]
              properties:
                page: {type: string, description: Local page path only.}
      responses:
        '200':
          description: One simulated mobile lab run, separate from field data.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LighthouseAnswer'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '502':
          description: Lab service request failed; no credential or provider body is exposed.
  /shares:
    get:
      operationId: listShares
      summary: Administrator-only shared reports and branding defaults; never hashes or full links.
      responses:
        '200':
          description: Shares (at most 50), with id, created, expires, last_opened, opens, revoked, protected, copyable, password_stored and email_password (booleans); never hashes, token_enc or password_enc. copyable means an encrypted link exists and the share is active, though a changed key can still prevent recovery. password_stored means an encrypted password copy exists. defaults holds branding; logos maps attachment IDs to addresses; engines lists search engines with data; sections lists section keys with live data in tab order.
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createShare
      summary: Create a private read-only report (manage_options).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareInput'
      responses:
        '200':
          description: Saved share summary and its url. An encrypted token copy allows later owner recovery when encryption is available.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /shares/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: updateShare
      summary: Update a share (manage_options); omitted password keeps it, empty clears it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareInput'
      responses:
        '200': {description: Saved share, without hashes or full link.}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: revokeShare
      summary: Revoke access (manage_options); the record remains in the owner list.
      responses:
        '200': {description: 'revoked: true'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /shares/{id}/renew:
    post:
      operationId: renewShare
      summary: Rotate the secret and reactivate the share (manage_options); expiry stays.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: New url, with an encrypted copy for owner recovery when available. Old links and grants stop working.}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /shares/{id}/link:
    get:
      operationId: getShareLink
      summary: Recover an active shared report link (manage_options).
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Decrypted link only; private/no-store, noindex/nofollow and no-referrer. Never returns a password.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: {type: string, format: uri}
        '400':
          description: seoproanalytics_share_link; missing, revoked, expired or unreadable link. Make a new link to copy or email it.
        '403': {$ref: '#/components/responses/Forbidden'}

  /shares/{id}/email/test:
    post:
      operationId: testShareEmail
      summary: Email the saved report's latest complete period to the current administrator only.
      description: Requires manage_options. Does not change last_period or delivery state. No recipient override. Period summaries and a recoverable active link are required.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Accepted by WordPress, not proof of inbox delivery.
          content:
            application/json:
              schema: {type: object, properties: {sent: {type: boolean}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /share/{token}:
    post:
      operationId: openShare
      security: []
      summary: Unlock a private report; no WordPress cookie or nonce needed.
      parameters:
        - name: token
          in: path
          required: true
          schema: {type: string, pattern: '^[a-f0-9]{32}$'}
        - name: X-Seoproanalytics-Unlock
          in: header
          schema: {type: string}
          description: An unexpired grant can reopen the report without its password.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password: {type: string, maxLength: 256, default: ''}
      responses:
        '200':
          description: Public share fields, views, branding, home/site_name/logo_url/agency_logo_url, hidden_dimensions (the breakdowns this report leaves out, so readers see no empty tabs for them) and a one-hour signed unlock grant. Keep the grant in sessionStorage only. No password or bearer hashes, owner IDs or user information. Private/no-store, noindex/nofollow, no-referrer headers.
        '403':
          description: Uniform unavailable response for unknown, revoked, expired, password-protected or throttled shares (five unlock attempts per minute per secret).

  /share/{token}/{section}/{report}:
    get:
      operationId: getSharedReport
      security: []
      summary: Read an allowed live report with server-enforced locks; never editors or demo data.
      parameters:
        - name: token
          in: path
          required: true
          schema: {type: string, pattern: '^[a-f0-9]{32}$'}
        - name: section
          in: path
          required: true
          schema: {type: string, enum: [overview, search, goals, funnels, properties, clicks, changes]}
        - name: report
          in: path
          required: true
          schema: {type: string, enum: [stats, timeseries, breakdown, markers, realtime, search, opportunities, audit, links, indexation, content, goals, funnels, properties, clicks, changes]}
          description: Overview allows stats/timeseries/breakdown/markers/realtime; Search allows search/markers/opportunities/audit/links/indexation/content, for the engines of its saved Search sections only; Goals allows goals; Funnels allows funnels; Properties allows properties/breakdown; Clicks allows clicks/breakdown; Changes allows changes/breakdown. The section must be saved in this share. Other query arguments are those of the report's own route, checked the same way; markers and changes are a public projection (no users, notes, old/new values, or plugin, theme and setting names).
        - name: X-Seoproanalytics-Unlock
          in: header
          schema: {type: string}
          description: Required for a password-protected share; grants do not authorize other API routes.
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/compare'
        - $ref: '#/components/parameters/filters'
        - name: dimension
          in: query
          schema: {type: string}
        - name: kind
          in: query
          schema: {type: string, enum: [elements, dead, links, downloads, forms, pages, queries, countries, devices, appearance, days]}
        - name: page
          in: query
          schema: {type: string, maxLength: 2048}
        - name: grain
          in: query
          schema: {type: string, enum: [auto, hour, day, month]}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000}
          description: Up to 1000 only for section=search, report=search and kind=days (the full printed Days table). Every other report and kind accepts at most 100; larger limits return 400.
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 1000}
      responses:
        '200':
          description: Existing report shape, with edit_url always null. Sensitive breakdowns may be empty; realtime omitted for locked shares. Markers carry only kind/time/page, never users or settings, and are omitted for visit-level locks. Uses existing report cache but sends private/no-store headers.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Report unavailable, section excluded, grant invalid, date boundary violated or quota exceeded (120 report reads per minute per secret).
  /stats:
    get:
      operationId: getStats
      summary: Headline metrics for a range, with an optional comparison.
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/compare'
        - $ref: '#/components/parameters/filters'
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: Metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /timeseries:
    get:
      operationId: getTimeseries
      summary: Metrics per hour, day or month, zero-filled up to now.
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/compare'
        - $ref: '#/components/parameters/filters'
        - name: grain
          in: query
          description: auto picks hours up to two days, days up to 120 days, else months. Hours are refused past 31 days (days instead).
          schema:
            type: string
            enum: [auto, hour, day, month]
            default: auto
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: Points; with a comparison, the earlier period's points in the same order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeseriesAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /breakdown:
    get:
      operationId: getBreakdown
      summary: Top values of a dimension with their metrics.
      description: |
        Visit dimensions answer visit metrics, sorted by visits. `page`
        answers pageviews, average time on page and scroll per page, sorted
        by pageviews. `event` answers events and conversion rate per event
        name, sorted by events. `value` is what a filter on the dimension
        takes; `label` is for display.
      parameters:
        - name: dimension
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Dimension'
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/filters'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: Rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakdownAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /realtime:
    get:
      operationId: getRealtime
      summary: Visitors active in the last 30 minutes. Never cached.
      description: Hits wait up to a minute in the collector's buffer before they count.
      parameters:
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: Now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeAnswer'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /markers:
    get:
      operationId: getMarkers
      summary: Changes to show on the timeline for a range, oldest first.
      description: |
        The change log's entries in the range (at most 1000), for marking
        charts: posts and pages published, unpublished, moved, retitled and
        edited; SEO titles, descriptions, robots and canonicals; prices,
        sales, stock and coupons; plugins, themes and WordPress updated or
        switched; settings that change how search engines see the site;
        search engine updates when switched on, with those that began up to
        60 days before the range and were still rolling out in it; and
        notes. `page` keeps that page's changes and the site-wide ones.
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/changePage'
        - $ref: '#/components/parameters/changeKinds'
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: Markers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkersAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /changes:
    get:
      operationId: getChanges
      summary: The change log for a range, newest first, with paging.
      description: The same entries as markers, newest first. Changes are site facts and are kept for good; no visitor data is involved.
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/changePage'
        - $ref: '#/components/parameters/changeKinds'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: Changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangesAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /annotations:
    post:
      operationId: addAnnotation
      summary: Add a note to the timeline (manage_options).
      description: |
        A note marks something the change log cannot see, such as a
        newsletter sent, a campaign started or an outage, so it shows on
        the charts and in the change log (group note, kind note, source
        note). Optionally about one page; without a time, now.
      parameters:
        - $ref: '#/components/parameters/data'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note:
                  type: string
                  maxLength: 190
                  examples: [Newsletter sent]
                page:
                  type: string
                  description: The page it is about (a path); empty for the whole site.
                  examples: [/pricing/]
                time:
                  type: string
                  description: When, in the site time zone (2026-10-05 or 2026-10-05 14:30), or Unix time; empty for now.
      responses:
        '200':
          description: The note as saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Marker'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /annotations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The note's id (a change id).
        schema:
          type: integer
          minimum: 1
      - $ref: '#/components/parameters/data'
    delete:
      operationId: deleteAnnotation
      summary: Delete a note (manage_options). Recorded changes cannot be deleted.
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /change-sets:
    get:
      operationId: getChangeSets
      summary: Full backups of reviewed live page changes (view_seoproanalytics).
      parameters:
        - name: before
          in: query
          description: Read sets older than this id; newest 50 by default.
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200':
          description: Newest sets and the next before cursor, null at the end.
          content:
            application/json:
              schema:
                type: object
                properties:
                  change_sets:
                    type: array
                    items: {$ref: '#/components/schemas/ChangeSet'}
                  next: {type: [integer, 'null']}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: applyChangeSet
      summary: Preview or apply a reviewed plan (manage_options and edit_post per page).
      description: |
        Always uses live data. Pages with any stale now value or without edit_post
        are skipped as a whole. SEO fields require active Rank Math, Yoast SEO or
        SEOPress. Values are compared in WordPress's stored form for the acting user;
        template variables remain literal. Backs up full values before writing SEO
        metadata then post title; stops at the first read-back or permalink difference.
        dry_run writes nothing. Optional experiment uses the applied pages and apply
        time; its id is experiment_id, and its meta.change_set links back to the set.
        Experiment creation errors are returned in experiment_error without losing
        the applied set or its backups. No automatic retry of page changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan: {$ref: '#/components/schemas/ChangeSetPlan'}
                dry_run: {type: boolean, default: false}
                experiment: {type: string, description: Optional experiment name.}
                days: {type: integer, enum: [7, 14, 28, 56, 84], default: 28}
                engine: {$ref: '#/components/schemas/SearchEngine'}
                metric: {type: string, enum: [clicks, impressions, ctr, position, visits, conversions], default: clicks}
                direction: {type: string, enum: [up, down], default: up}
                threshold: {type: number, minimum: 0}
                goal: {type: string}
                hypothesis: {type: string}
      responses:
        '200':
          description: Preview (dry_run) or saved set, including per-field results.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ChangeSet'
                  - $ref: '#/components/schemas/ChangeSetPreview'
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: Another change set writer holds the site lock.
        '500':
          description: Backup or state could not be saved; inspect the partly applied set before retrying.

  /change-sets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, minimum: 1}
    get:
      operationId: getChangeSet
      summary: One live change set (view_seoproanalytics).
      responses:
        '200':
          description: Full backup, links and field outcomes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChangeSet'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /change-sets/{id}/undo:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, minimum: 1}
    post:
      operationId: undoChangeSet
      summary: Restore live values still equal to what the set wrote (manage_options and edit_post).
      description: Later edits and non-editable pages are reported and left untouched. Each restoration is read back and logged with meta.change_set. Sets survive experiment deletion and are kept for good.
      responses:
        '200':
          description: Undone or partly undone set, with conflicts per field.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChangeSet'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Another change set writer holds the site lock.

  /experiments:
    get:
      operationId: getExperiments
      summary: Experiments, due ones first, each with its measurement.
      description: |
        The newest 50 experiments: due for review first (running, with
        data through the review day), then running, decided and
        cancelled, newest first in each. A running experiment is measured
        now; a decided one answers the measurement it was decided on.
      parameters:
        - $ref: '#/components/parameters/data'
        - name: status
          in: query
          description: Only experiments in this state; due is running with data through the review day.
          schema:
            type: string
            enum: ['', running, due, decided, cancelled]
        - name: page
          in: query
          description: Only experiments on this page (a path).
          schema:
            type: string
            examples: [/pricing/]
        - $ref: '#/components/parameters/owner'
      responses:
        '200':
          description: The experiments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentsAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'
    post:
      operationId: addExperiment
      summary: Record an experiment (manage_options).
      description: |
        A change and what it should do, written down before the result is
        known. From a change (its id in /changes: its time is the start
        and its page the page unless pages are given), or with a start and
        pages. Each window is the same number of days before and after
        the change (the change day left out); Bing's weekly page rows take
        the weeks that begin after it. Its start shows on the timeline
        (kind experiment, group note).
      parameters:
        - $ref: '#/components/parameters/data'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentInput'
      responses:
        '200':
          description: The experiment as saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /experiments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - $ref: '#/components/parameters/data'
    get:
      operationId: getExperiment
      summary: One experiment with its measurement.
      responses:
        '200':
          description: The experiment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: updateExperiment
      summary: Decide, note or cancel an experiment (manage_options).
      description: |
        decide records the result (keep, revise, undo or inconclusive)
        and keeps the measurement it was made on, so newer data never
        rewrites it; deciding again changes only the result and the note.
        With restore true, decide undo also restores its linked change set on live
        data (even with data=demo), refusing an experiment without a set. The
        response includes restoration with its per-field conflicts and outcomes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [decide, note, cancel]
                result:
                  type: string
                  enum: [keep, revise, undo, inconclusive]
                  description: For decide.
                restore:
                  type: boolean
                  default: false
                  description: Only for decide undo on an experiment with meta.change_set. Requires edit_post for each restored page.
                note:
                  type: string
                  maxLength: 2000
                  description: Why, or what was learnt.
      responses:
        '200':
          description: The experiment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The experiment was cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteExperiment
      summary: Delete an experiment and its start on the timeline (manage_options).
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /ab-tests:
    get:
      operationId: getAbTests
      summary: A/B tests, running first, each with its visits per variant, leader and verdict.
      description: |
        Every test made with the A/B test block (up to 500), running first,
        then the newest. Each test's numbers cover its life: from when it
        first ran (or was made) to when it ended, or now; the range is not
        used. Filters narrow the visits. A visit that saw two or more of a
        test's variants is mixed: counted apart, in no variant. Variants are
        compared with the control (the first) on the primary metric: the
        test's first goal, or visits that clicked inside the variant. Not
        the same as /experiments (a change and its expected effect on
        search).
      parameters:
        - $ref: '#/components/parameters/data'
        - $ref: '#/components/parameters/filters'
        - name: status
          in: query
          description: Only tests in this state.
          schema:
            type: string
            enum: ['', draft, running, paused, ended]
      responses:
        '200':
          description: The tests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbTestsAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /ab-tests/{id}:
    get:
      operationId: getAbTest
      summary: One A/B test's variants side by side.
      description: |
        Per variant: visits, visitors, page loads, bounce rate, engaged
        time and clicks; for each of the test's goals, conversions (visits
        that reached the goal at or after first seeing the test), the
        conversion rate and revenue per currency (never added across
        currencies). Each variant is compared with the control: uplift (the
        relative change in rate) with a 95% interval (log of the rate
        ratio), and the probability that its true rate beats the control's
        (Bayesian, a uniform Beta(1, 1) prior on each rate, worked out
        exactly). Below the minimum sample (`thresholds`) a comparison is
        too early to call.
      parameters:
        - name: id
          in: path
          required: true
          description: The test's id.
          schema:
            type: string
            pattern: '^[a-z0-9]{6,32}$'
        - $ref: '#/components/parameters/data'
        - $ref: '#/components/parameters/filters'
      responses:
        '200':
          description: The test.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbTestAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /ab-tests/{id}/winner:
    post:
      operationId: pickAbTestWinner
      summary: Record the winner picked in the block editor.
      description: |
        Picking a winner in the editor replaces the test block with that
        variant's blocks; once the post is saved without the test, the
        editor sends the winner here. The test ends with that winner (its
        `ended` time and the timeline's `ab_test_ended` and
        `ab_test_winner` changes) and its results stay. Live data only;
        for people who may edit the test's post. Sending the same winner
        again changes nothing.
      parameters:
        - name: id
          in: path
          required: true
          description: The test's id.
          schema:
            type: string
            pattern: '^[a-z0-9]{6,32}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variant]
              properties:
                variant:
                  type: string
                  pattern: '^[a-z0-9-]{1,64}$'
                  description: The winning variant's slug.
      responses:
        '200':
          description: The test, ended with its winner.
          content:
            application/json:
              schema:
                type: object
                required: [id, status, winner]
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    enum: [ended]
                  winner:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The test never ran (`seoproanalytics_never_ran`), or is still in its post (`seoproanalytics_still_in_post`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /queue:
    get:
      operationId: getQueue
      summary: The decision queue — one ranked list of search work, with each item's why and score parts.
      description: |
        Made from the opportunities (`ctr`: low CTR; `missing`: a query
        whose words the page lacks; `striking`: positions 4–20; `decay`:
        a page losing clicks; `overlap`: a query several pages share, on
        its leading page, with every page in `figures.pages`) and the
        content audit (`audit`: one item per page and `finding`, from
        `/audit`'s pages with most impressions) and internal links
        (`links`: one item per page and list in `finding`, from `/links`:
        an orphan, a converting page with few links in, or a missing link,
        on the page it should go to with the page that should link in
        `figures.link_from`) and indexation (`index`: one item per page
        or sitemap address search has not shown, from `/indexation`, its
        list in `finding`) and the refresh planner (`refresh`: in place
        of the `decay` item of a losing page whose content facts the
        content audit has, a proposal in `finding` from the cause of the
        loss, the content's age and words, its conversions and the other
        pages that overtook it, checked in this order: `leave` when fewer
        people search; `protect` when its visits from search convert at
        `rules.refresh.protect_value` × the site's rate or more with at
        least `rules.refresh.protect_conversions` conversions; `merge`
        when another page of the site now ranks better for a query it
        lost most on and did not before, both pages in `figures.pages`,
        though only an experiment on the losing page holds it back;
        else `update`. Proposals only: nothing changes the content) and
        search targets (`target`, from `/targets`' open targets: `finding`
        `wrong_page` when search shows another page than the one meant
        for it, on the page meant for it with both pages in
        `figures.pages`, so an experiment on either holds it back and done
        measures both; `striking` for a target of priority
        `rules.target.high_priority` or more at positions 4–20 with its
        page or none chosen, in place of the plain `striking` item) when
        the list is read.
        Each item's score is potential clicks per 28 days ×
        value × confidence ÷ effort, and every part is given so an agent
        can rank by its own rule:

        - potential clicks: the opportunity's (missing: impressions × the
          site's CTR at its position × `rules.missing_share`; overlap: the
          clicks with the best of its pages' CTRs, so overlaps where no
          page does better are not items; audit: the page's impressions ×
          the site's CTR at its position × the finding's share of them,
          `figures.share`; links: the page's impressions, or for a missing
          link those of the searches on the page that should link, × the
          site's CTR at the page's position × the list's share in
          `rules.links_share`; index: `/indexation`'s `typical`, a shown
          page's clicks, × the list's share in `rules.index_share`, so
          none without search data; sitemap: the same typical clicks × the
          problem's share in `rules.sitemap_share`; refresh: the clicks lost × the
          proposal's share in `rules.refresh_share`; target: wrong_page,
          the search's impressions × the site's CTR at its position ×
          `rules.target.share`, striking, as striking distance's, both ×
          the target's priority ÷ `rules.target.priority`; backlinks, as
          striking distance's: the clicks the page's searches could gain
          in the top three, from `/backlinks?kind=needs`), scaled to 28
          days;
        - value: the page's conversion rate of visits from search for
          `goal` (smoothed toward the site's) ÷ the site's rate, from 1
          to `rules.max_value`; 1 without goals;
        - confidence: the kind's own × √(impressions per 28 days ÷
          `rules.full_impressions`), the root at most 1; index and sitemap
          items have no impressions, so theirs is the kind's own;
        - effort: the kind's (`rules.effort`; an audit finding's in
          `rules.audit_effort`, a links list's in `rules.links_effort`, an
          indexation list's in `rules.index_effort`, a refresh
          proposal's in `rules.refresh_effort` and a sitemap problem's in
          `rules.sitemap_effort` when it differs) unless someone set
          another.

        Sitemap items (`sitemap`, Google only) come from Search Console's
        sitemaps (`/inspections`): one per sitemap and problem (`errors`,
        `stale`, `warnings`), and `missing` when the site's own sitemap
        index is not submitted. Done records the fix and opens no
        experiment.

        Backlinks items (`backlinks`, finding `needs`) are the pages
        `/backlinks?kind=needs` lists, once backlinks have been read (a
        referring page checked or a live link known): searches in striking
        distance with fewer useful referring domains than the median of
        the site's pages in the top three. `figures` gives the need, the
        links to it now (`domains`, `followed`, `useful`, `links`,
        `link_value`), the benchmark (`top_median`, `gap`) and its best
        `searches`. Confidence 0.4 and effort 3 (`rules`). Done
        opens an experiment measuring position. An estimate to rank work
        by: links are one of many things that move a page.

        Only items someone acted on are stored. New items on a page with
        a running experiment are left out (`left_out`); dismissed items
        stay hidden for `rules.hide_days` days. Accepted and done items no
        longer found are listed as they were (`found` false). As
        `/opportunities`, the period is cut at the newest search day and
        to its newest 366 days, and decay compares with the period before.
      parameters:
        - $ref: '#/components/parameters/engine'
        - name: status
          in: query
          description: Items in this state; open is new and accepted.
          schema:
            type: string
            enum: [open, new, accepted, done, dismissed, all]
            default: open
        - name: kind
          in: query
          description: Only items of this kind; every kind when left out.
          schema:
            type: string
            enum: [ctr, missing, striking, decay, overlap, audit, links, index, refresh, target, sitemap, backlinks]
        - name: goal
          in: query
          description: ID of the goal whose conversions give a page its value; the first goal when left out.
          schema:
            type: string
        - name: range
          in: query
          description: Period, in the site time zone.
          schema:
            type: string
            default: 90d
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/filters'
        - $ref: '#/components/parameters/owner'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: The ranked items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /queue/{key}:
    parameters:
      - name: key
        in: path
        required: true
        description: The item's key, from /queue.
        schema:
          type: string
          pattern: '^[0-9a-fA-F]{16}$'
      - $ref: '#/components/parameters/data'
    post:
      operationId: updateQueueItem
      summary: Accept, do, dismiss or restore a queue item, or set its effort or note (manage_options).
      description: |
        Give the same period, engine and goal as the list the key came
        from: an item not yet stored must be in that list now. done
        opens an experiment on the item's page, starting now, with the
        kind's measure (ctr: CTR; missing, decay, refresh and a target's
        wrong_page: clicks; striking and a target's striking: position),
        expected up (position: a better place); the
        item then shows the experiment's result. done on a refresh item
        whose proposal is leave opens no experiment: the page stays as it
        is. restore forgets what was done with
        the item (its experiment stays).
      parameters:
        - $ref: '#/components/parameters/engine'
        - name: goal
          in: query
          schema:
            type: string
        - name: range
          in: query
          schema:
            type: string
            default: 90d
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/filters'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [accept, done, dismiss, restore, effort, note]
                effort:
                  type: integer
                  minimum: 1
                  maximum: 5
                  description: For effort.
                note:
                  type: string
                  maxLength: 190
                  description: With any action; for note, empty clears it.
                name:
                  type: string
                  maxLength: 190
                  description: For done, the experiment's name; one is made from the item without it.
                days:
                  type: integer
                  enum: [7, 14, 28, 56, 84]
                  default: 28
                  description: For done, days in each window.
                threshold:
                  type: number
                  minimum: 0
                  description: For done, the smallest change that counts; percent (default 10), or places for position (default 1).
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The item is done already.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /loop:
    get:
      operationId: getLoop
      summary: The loop export — one answer per cycle for an agent working the SEO decision loop.
      description: |
        The decision queue's open items (new and accepted, as `/queue`),
        the experiments due for review (running, with search data through
        the review day), still running, and decided in the last
        `experiments.recent_days` days with their results (null and
        negative ones included), and the period's search figures per query
        and page in the aidevops export layout (`export`: `query`, `page`,
        `clicks`, `impressions`, `ctr`, `position`, most impressions
        first). The queue and the export share the period (cut at the
        newest search day and to its newest 366 days), engine and page
        filters; `params` gives them back, so acting on an item
        (`POST /queue/{key}`) uses the same ones. Read-only; nothing is
        stored. Steps for an agent: `docs/seo-loop-recipes.md`.
      parameters:
        - $ref: '#/components/parameters/engine'
        - name: goal
          in: query
          description: ID of the goal whose conversions give a page its value in the queue; the first goal when left out.
          schema:
            type: string
        - name: range
          in: query
          description: Period, in the site time zone.
          schema:
            type: string
            default: 30d
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/filters'
        - name: limit
          in: query
          description: Most queue items.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
        - name: rows
          in: query
          description: Most export rows (a search and a page each).
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 1000
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: The loop answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoopAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /goals:
    get:
      operationId: getGoals
      summary: Every goal with its conversions, conversion rate and revenue.
      description: |
        A goal is a page viewed or an event sent. `visits` are the visits
        that reached it (conversions); `conversion_rate` is visits ÷ all
        visits in the range (with the filters); `completions` counts every
        time it was reached. Revenue comes from the matching events, one
        amount per currency (never added across currencies). Goals keep
        the order they were added in. An exact Purchase event goal subtracts
        Refund amounts on the original visits and purchase dates, without
        counting refunds as conversions or completions. Property revenue for
        Purchase or all events also subtracts refunds; an explicit Refund
        report shows positive returned amounts.
        `renewals` contains site-wide daily paid renewal counts and amounts
        (main currency units, by site-local callback reception day, up to
        400 days). It is separate from Purchase revenue and completions.
        Visit-filtered, demo, realtime and 24h requests return unavailable
        scope and empty arrays. No renewal comparison is implied.
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/compare'
        - $ref: '#/components/parameters/filters'
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: Goals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalsAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'
    post:
      operationId: addGoal
      summary: Add a goal (manage_options). Up to 50 per data set.
      parameters:
        - $ref: '#/components/parameters/data'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalStep'
      responses:
        '200':
          description: The goal as saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadDefinition'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /goals/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/data'
    put:
      operationId: updateGoal
      summary: Change a goal (manage_options). POST and PATCH work too.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalStep'
      responses:
        '200':
          description: The goal as saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadDefinition'
        '401':
