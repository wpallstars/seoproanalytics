  /clicks:
    get:
      operationId: getClicks
      summary: Clicks and form submits (autocapture), with totals.
      description: |
        Totals of the period, and rows of one `kind`: clicked elements (by
        selector and label, with their dead clicks), dead clicks only, link
        destinations, file links, or forms sent (by name, selector and
        destination), or pages grouped by path with clicks, dead-click rate,
        link clicks, forms sent and visits. Sorted by count. `page` keeps clicks on that page;
        filters select the visits, and a page filter also keeps clicks on
        that page. Clicks are kept 3 months by default (Settings → Data),
        so older ranges are empty. Never carries what anyone typed.
      parameters:
        - name: kind
          in: query
          schema:
            type: string
            enum: [elements, dead, links, downloads, forms, pages]
            default: elements
        - name: page
          in: query
          description: A path; `*` is any text.
          schema:
            type: string
            examples: [/pricing/]
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/compare'
        - $ref: '#/components/parameters/filters'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: Totals and rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClicksAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'
  /search:
    get:
      operationId: getSearch
      summary: Search clicks, impressions, CTR and position from Google or Bing, with rows.
      description: |
        Search data imported from Bing Webmaster Tools, or Google Search
        Console through the SEO Pro Analytics Connect add-on
        (`/connections`), one `engine` at a time: totals of the
        period, a point per day (per month past 120 days, or as `grain` asks), and rows of
        one `kind`: search queries, pages, countries, devices or appearance, sorted
        by impressions, most first (`sort` and `order` choose another), or `days`. `page` keeps the searches that showed that page (its
        queries), `query` keeps one query (its pages); countries, devices
        and appearance exist for the whole site and Google only, so with either they are
        empty.

        `days` rows are the chart's points as a table, newest first (`sort`
        `day`, or a figure), by the
        answer's `grain` (day, week or month), for every engine, page and
        query: each has `from` and `to`, the days it covers (both
        included), and together they make the period's totals. `limit`
        and `offset` page through them (`more`); they have no per-row
        comparison (the totals carry it).

        Appearance values are open-ended Search Console codes, counted by
        page. One search may show several appearances, so these rows do
        not add up to the site's totals. Totals and points remain the
        whole site's figures, not sums of appearance rows.

        Bing gives its pages and queries by week, and no countries or
        devices: the period is widened at its start to the whole weeks its
        days fall in (cut instead before the first day with data), a page's
        or query's points are by week (`grain` `week`), and a day's
        position is its week's.

        Search days are the engine's own (Pacific time for Google, UTC
        for Bing) and final only, so the newest is about three days old
        (Bing: the end of its newest week, a week or more). The period is
        cut at the newest day with search data (`through`), and the
        comparison has the same number of days, so days not imported yet
        never look like a drop. Page filters apply like `page`; other
        filters select visits, which search data has not, and are listed
        in `ignored`.

        CTR is clicks ÷ impressions. Position is the average of the
        highest place a page held each time it was shown, weighted by
        impressions; lower is better, and 0 means no impressions.
        Both engines leave out rare searches, so rows add up to less
        than the totals. Demo data has made-up search days for both.
        `engine=all` (Combined) adds both up.
      parameters:
        - $ref: '#/components/parameters/combinedEngine'
        - name: kind
          in: query
          schema:
            type: string
            enum: [queries, pages, countries, devices, appearance, days]
            default: queries
        - name: sort
          in: query
          description: |
            The figure the rows are sorted by, in `order`; `day` (the
            default for `days`) is for `days` only. The answer's `sort` and
            `order` say what was applied.
          schema:
            type: string
            enum: [impressions, clicks, ctr, position, day]
            default: impressions
        - $ref: '#/components/parameters/order'
        - name: page
          in: query
          description: A path; `*` is any text.
          schema:
            type: string
            examples: [/pricing/]
        - name: query
          in: query
          description: A search query; `*` is any text.
          schema:
            type: string
            examples: [core web vitals]
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/compare'
        - $ref: '#/components/parameters/filters'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: grain
          in: query
          description: |
            Points per day or month. `auto` picks days up to 120 days, else
            months; `day` keeps days however long the period (a weekly
            engine's page or query stays by week) and `month` gives months,
            so a chart's trend line can read the days before its period at
            the chart's own grain. `days` rows follow it.
          schema:
            type: string
            enum: [auto, day, month]
            default: auto
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: Totals, points and rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /opportunities:
    get:
      operationId: getOpportunities
      summary: Where search effort pays — striking-distance queries, low-CTR queries, pages losing clicks, queries missing from their page or queries shared by pages.
      description: |
        From the same imported search days as `/search` (one `engine`),
        one `kind` of opportunity, best first:

        - `striking`: a page's query at average position 4–20 with
          enough impressions (`rules.min_impressions`, scaled by the
          period's days). `potential` is the clicks it could gain at the
          site's own CTR at position 3: impressions × (that CTR − its
          CTR).
        - `ctr`: a page's query in the top 10 whose CTR is under
          `rules.under` × the site's own CTR at its position (title and
          description work). `potential` is the clicks it misses:
          impressions × expected CTR − clicks.
        - `decay`: pages with at least `rules.min_share` fewer clicks,
          and `rules.min_lost` or more, than in the earlier period of the
          same length (the previous one; a year earlier with
          `compare=year`, or 52 weeks earlier with `compare=year_weekday`).
          Each has a likely `cause`: `gone` (no
          impressions now), `position` (ranks lower by a place and a
          tenth or more), else whichever fell more of `demand`
          (impressions) and `ctr`; a sentence (`why`), the queries that
          lost most, and the site's recorded changes on the page in both
          periods. `updates` lists search engine updates in either. The
          earlier period holds only days with search data: where it would
          start before the first, both are shortened from the newest end
          (`compare.cut`; `range`, `days` and `rules` are the shortened
          period's), so a year whose previous year is not kept is not
          read as a fall.
        - `missing`: a page's query in the top 20 with enough impressions
          whose words the page does not have (`none`), or has only some
          of (`partial`), as `/coverage` checks them; most impressions
          first. Only the `rules.pages` pages with most impressions are
          read, and only pages that are one post (or a demo page).
        - `overlap`: a query for which two or more pages each get at
          least `rules.min_share` of the impressions of its pages (with
          `rules.min_impressions` or more in all), from the 2,000
          page-query pairs with most impressions. A candidate to review,
          not a fault: two pages can both be right for one search. The row
          is the leading page's (most impressions), with the query's
          figures over all its pages; `pages` lists up to `rules.pages`
          with their figures and `share`; `leaders` is the leading page in
          each half of the period (`halves`) and `switched` whether it
          changed; `potential` is the clicks the query would have if all
          its pages' impressions had the best of their CTRs. Most
          impressions on pages other than the leading one first.

        Expected CTR is the site's own in the period: clicks ÷
        impressions by rounded position (1–20), made never to rise with
        position; positions with too few impressions use a cautious
        default (`curve.source`).

        As `/search`, the period is cut at the newest search day; it is
        also cut to its newest 366 days (`days`, `cut`), so a long period
        never reads every query of every day. Page filters apply; other
        filters are listed in `ignored`.
      parameters:
        - $ref: '#/components/parameters/combinedEngine'
        - name: kind
          in: query
          schema:
            type: string
            enum: [striking, ctr, decay, missing, overlap]
            default: striking
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/compare'
        - $ref: '#/components/parameters/filters'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: Opportunities of one kind.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunitiesAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /audit:
    get:
      operationId: getAudit
      summary: The content audit — published pages with findings from their content and SEO plugin fields, most search impressions first.
      description: |
        Facts read from WordPress about each published post: the title
        shown (the SEO plugin's, else the post's), the description (the
        SEO plugin's, else the excerpt), H1s in the text, words, images and
        those without alt text, and whether the SEO plugin sets noindex or
        a canonical address on another page. Facts are read when a post is
        saved and by the daily cron (`rules.batch` posts a run, each again
        after `rules.stale_days` days), never on visitor pages; `checked`
        says how many pages have facts and when they were read.

        Findings, most serious first (`AuditFinding`): `noindex` and
        `canonical` (only on pages with impressions), `thin` (under
        `rules.thin_words` words with `rules.thin_impressions` or more
        impressions and no clicks), `title_missing`, `title_duplicate`,
        `title_long` (over `rules.title_max` characters),
        `description_missing`, `description_duplicate`,
        `description_long` (over `rules.description_max`), `h1_none`,
        `h1_several` (themes show the title as an H1, so one in the text
        makes several) and `images_alt`. Lengths are of what was written:
        an SEO title made of its plugin's variables counts as the post's.

        While Google Search Console is connected (`engine` google; the
        Connect add-on), four more come from Google's URL Inspection of the page (the version in
        Google's index; see `/inspections`): `robots_blocked` (robots.txt
        stops Google crawling it), `not_indexed` (Google crawled or found
        it but left it out of its index), `google_canonical` (Google chose
        another page as canonical than the page's own) and `rich_errors`
        (Google's rich result report has errors). Each row's `google` gives
        the inspection, null until the page is inspected.

        While Bing Webmaster Tools is connected, `bing_crawl` comes from
        Bing's crawl issues (see `/crawl-issues`): Bing's crawler had an
        error on the page (any issue but a redirect). Each row's `bing`
        gives its HTTP status and issues, null without one.

        Pages are listed most impressions first (`sort` and `order` choose another), with their search figures
        from the same imported days as `/search` (one `engine`; cut as
        `/opportunities` is). `counts` gives pages per finding whatever
        `finding` is asked for. Each finding also becomes a `/queue` item.
        Page filters apply; other filters are listed in `ignored`.
      parameters:
        - $ref: '#/components/parameters/engine'
        - name: finding
          in: query
          description: Only pages with this finding; all when left out.
          schema:
            $ref: '#/components/schemas/AuditFinding'
        - name: sort
          in: query
          description: The search figure the pages are sorted by, in `order`; the answer's `sort` and `order` say what was applied.
          schema:
            type: string
            enum: [impressions, clicks, ctr, position]
            default: impressions
        - $ref: '#/components/parameters/order'
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/filters'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: Pages with findings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /links:
    get:
      operationId: getLinks
      summary: Internal links — orphan pages, converting pages with few links in, and links missing between pages that share a search.
      description: |
        Links in the text of published pages to the site's own pages,
        read with the content audit's facts (when a post is saved and by
        the daily cron, never on visitor pages); menus and widgets are not
        read. `read` says how many published pages had their links read.
        Links to WordPress's folders, feeds and files are left out.

        - `orphans`: published pages no other page links to, most search
          impressions first.
        - `converting`: pages whose visits from search reached `goal`
          `rules.min_conversions` times or more with `rules.few_links` or
          fewer pages linking to them, most conversions first.

        The front page is in neither list, as menus link to it.
        - `missing`: a page with `rules.min_impressions` or more
          impressions on a search does not link to the search's page with
          most clicks; one row per page and page it should link to, with
          up to `rules.queries` searches, most impressions first. Read
          from the 2,000 page and query pairs with most impressions, as
          `/opportunities`.

        Search figures come from the same imported days as `/search` (one
        `engine`; cut as `/opportunities` is). `counts` gives every list's
        rows whatever `kind` is asked for. Each row also becomes a
        `/queue` item. Page filters apply; other filters are listed in
        `ignored`.
      parameters:
        - $ref: '#/components/parameters/engine'
        - name: kind
          in: query
          description: Which list.
          schema:
            $ref: '#/components/schemas/LinksKind'
        - name: goal
          in: query
          description: ID of the goal whose conversions are counted; the first goal when left out.
          schema:
            type: string
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/filters'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: One list of internal links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinksAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /indexation:
    get:
      operationId: getIndexation
      summary: Indexation — published pages and sitemap addresses search has not shown in its newest days.
      description: |
        Reads only what the site already has: no request to a search
        engine.

        - `pages`: published pages (read by the content audit, with when
          each was published) with no impressions in the engine's newest
          `days` days of imported search data, published at least `days`
          days before those days end. Pages that ask not to be indexed
          (`noindex`) or name another page as canonical are left out and
          counted in `skipped`.
        - `sitemap`: other addresses in WordPress's own sitemaps (category,
          tag and author archives, and other plugins' providers; not posts,
          which are `pages`), listed for at least `days` days, with no
          impressions in those days. The daily cron reads the sitemaps (at
          most `rules.max_urls` addresses); `read.sitemap` says when, and
          `enabled` is false when WordPress's sitemaps are off (an SEO
          plugin makes its own), leaving this list empty.

        `state` is `never` (no impressions on record) or `lost` (shown
        before, with `last_impression`, not since); never shown first,
        then the newest. At most the newest `rules.max_rows` pages and
        addresses are checked. The period is always the engine's newest
        `days` days, whatever `range` asks; `range` in the answer gives
        it. `typical` is a shown page's clicks per 28 days in it, which
        the queue uses for the clicks a page could earn. `counts` gives
        every list's rows whatever `kind` is asked for. Each row also
        becomes a `/queue` item (kind `index`). Page filters apply; other
        filters are listed in `ignored`.

        With `engine` google, each row's `google` is Google's URL
        Inspection of the page (Google's reason in its words and last
        crawl; null until inspected), and `sitemaps` and `inspections`
        give Search Console's sitemaps and the inspections' progress, as
        `/inspections` does; both null for Bing.
      parameters:
        - $ref: '#/components/parameters/engine'
        - name: kind
          in: query
          description: Which list.
          schema:
            $ref: '#/components/schemas/IndexationKind'
        - name: days
          in: query
          description: Days without impressions (and since publishing or first listed).
          schema:
            type: integer
            minimum: 7
            maximum: 365
            default: 28
        - $ref: '#/components/parameters/filters'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: One indexation list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexationAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /inspections:
    get:
      operationId: getInspections
      summary: Google's index — URL Inspection of the site's pages and Search Console's sitemaps.
      description: |
        Reads what is stored; no request to Google. Google only. The SEO
        Pro Analytics Connect add-on's Search Console connection writes the
        property's sitemaps and the inspections (at most `rules.daily` a
        day, Google's day, Pacific time; set in Settings → Data, 0 for none,
        up to `rules.max_daily`, Google's own limit per property; each page
        again after `rules.recheck_days` days); the demo data has them too.
        Never on visitor pages or report requests.

        Each row is Google's view of the version in its index: `verdict`,
        `coverage` (Google's reason in its words, such as "Crawled -
        currently not indexed"), `indexing`, `robots`, `page_fetch`,
        `last_crawl`, `google_canonical` and `user_canonical`, rich
        results, and `findings` (`InspectionFinding`), which are also
        `/audit` findings and `/queue` items. A change of verdict is a
        timeline change (`index_status`). Newest inspections first.
        `counts` gives pages per verdict whatever is asked for.

        `sitemaps.submitted` is false when the site's own sitemap index
        (its SEO plugin's, or WordPress's) is not submitted in Search
        Console; each sitemap lists its `problems` (`errors`, `stale`: not
        downloaded for over `stale_days` days, `warnings`). Sitemap
        problems become `/queue` items (kind `sitemap`). Page filters
        apply; other filters are listed in `ignored`.
      parameters:
        - name: verdict
          in: query
          description: Only pages with this verdict; all when left out.
          schema:
            $ref: '#/components/schemas/InspectionVerdict'
        - name: coverage
          in: query
          description: Only pages with this coverage state, in Google's words (for example "Crawled - currently not indexed").
          schema:
            type: string
        - name: finding
          in: query
          description: Only pages with this finding; all when left out.
          schema:
            $ref: '#/components/schemas/InspectionFinding'
        - $ref: '#/components/parameters/filters'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: Pages inspected, with the sitemaps and progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionsAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /crawl-issues:
    get:
      operationId: getCrawlIssues
      summary: Bing's crawl — crawl issues, crawl stats, sitemaps and URL submission quota.
      description: |
        Reads what the import stored; no request to Bing. Bing only.

        While Bing Webmaster Tools is connected, the hourly import reads
        Bing's crawl issues, crawl stats, sitemaps and URL submission
        quota once a day, and Bing's inbound links once a week into
        `/backlinks` (`source` bing), each run within `rules.requests`
        requests and `rules.budget` seconds; a links read that stops
        carries on in the next run. Never on visitor pages or report
        requests (or `wp seoproanalytics crawl-issues --run`).

        `rows` are the addresses with an issue, errors first then most
        inbound links. Errors on published pages are also the `/audit`
        finding `bing_crawl` and so `/queue` items. `counts` gives
        addresses per issue whatever is asked for. Disconnecting Bing
        deletes the crawl facts; links already read stay in Backlinks.
      parameters:
        - name: issue
          in: query
          description: Only addresses with this issue, or `errors` for every issue but redirects; all when left out.
          schema:
            oneOf:
              - $ref: '#/components/schemas/CrawlIssue'
              - type: string
                enum: [errors]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: Bing's crawl issues, with its crawl stats, sitemaps, quota and the links read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrawlIssuesAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /crawl/readiness:
    post:
      operationId: checkBuiltinCrawlReadiness
      summary: Explicit server readiness probes (settings permission).
      description: >-
        Probes the site's loopback. Only external true separately consents to
        probing the existing Google Search Status host. Checks return pass,
        warn or fail with detail and site/external readiness. No visitor data.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                external: {type: boolean, default: false}
      responses:
        '200':
          description: Readiness checks and site/external booleans.
          content:
            application/json:
              schema: {type: object}
        '403':
          $ref: '#/components/responses/Forbidden'
  /crawl/run:
    get:
      operationId: getBuiltinCrawl
      summary: Read built-in crawl progress without advancing it (settings permission).
      responses:
        '200':
          description: Status, counts, complete, import_id, enabled, external and error.
          content:
            application/json:
              schema: {type: object}
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: startBuiltinCrawl
      summary: Start the explicitly enabled built-in crawl in cron (settings permission).
      description: Requires live data and passing readiness. No force override over REST.
      responses:
        '202':
          description: Queued crawl progress.
        '409':
          description: Disabled, busy or server readiness failed.
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: stopBuiltinCrawl
      summary: Stop collection, not an already staged import (settings permission).
      responses:
        '200':
          description: Stopped crawl progress.
        '409':
          description: Crawler lock busy.
        '403':
          $ref: '#/components/responses/Forbidden'
  /crawl:
    get:
      operationId: getCrawl
      summary: An imported crawl of the site — pages with a problem, links that fail or redirect, clicked links that fail.
      description: |
        Reads the existing crawl importer. The plugin never crawls unless
        Crawl this site is on; external checks require separate consent.
        A crawl is what each page served once the
        theme, plugins, caching and the host had their say.

        `kind` pages (the default): pages that answered an error or
        nothing, redirect, were served with noindex, a canonical address
        elsewhere or no title, or link to addresses that fail or redirect;
        failed first, then most failing links. `kind` links: links that
        fail or redirect. `kind` clicked: outbound and affiliate
        destinations clicked in the range (`range`, `from`, `to`) whose
        crawl answer failed, most clicks first: referrals and commissions
        lost.

        Findings (`CrawlFinding`) are `/audit` findings whatever a page's
        impressions, and so `/queue` items; served noindex and canonical
        only where WordPress does not set them. Clicked links that fail
        are `/queue` audit items with finding `clicked_broken`. `counts`
        and `findings` cover the whole crawl, whatever is asked for.
        `finding=slow` requires visits in the requested period, with crawl
        timing over the Vitals TTFB poor threshold twice consecutively or
        HTML over 1 MiB. Fresh page-level field TTFB/LCP takes precedence:
        poor confirms immediately and non-poor suppresses the finding.
        Sorted by conversions with a goal, otherwise visits, then search clicks.
      parameters:
        - name: kind
          in: query
          schema:
            type: string
            enum: [pages, links, clicked]
            default: pages
        - name: status
          in: query
          description: errors or redirects; links also blocked (external 401/403/429/999, the linked site refused the crawler; check by hand). Blocked links do not count as broken links or Plan items. Pages also accept noindex, canonical or title_missing as served; internal errors remain failures.
          schema:
            type: string
            enum: [errors, redirects, blocked, noindex, canonical, title_missing]
        - name: finding
          in: query
          description: Pages only. Only pages with this finding.
          schema:
            $ref: '#/components/schemas/CrawlFinding'
        - name: goal
          in: query
          description: Slow pages only; goal id, defaulting to the first configured goal.
          schema: { type: string }
        - name: engine
          in: query
          description: Slow pages only; search-click evidence, not the all-channel visits.
          schema: { type: string, default: google }
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: The crawl's facts and one list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrawlAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /crawl/import:
    get:
      operationId: getCrawlImport
      summary: The crawl import's progress (settings permission); while it runs, each read moves it on for a few seconds.
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrawlImportJob'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: importCrawl
      summary: Stage one crawl's exports and write them in the background (settings permission, live data only).
      description: |
        Up to 10 files of one crawl, 50 MB each, CSV or JSON: LibreCrawl's
        exports, the aidevops site crawler's (`crawl-data.csv`,
        `broken-links.csv`, `redirects.csv`) or any crawler's. A file with
        an address and status column is pages; one with a source and
        target column is links. At most 200,000 pages and 500,000 links
        are read; only links that fail or redirect are kept. Addresses on
        other hosts are skipped as pages; links to them are kept. Addresses
        with a query (`?replytocom=`, `?page_id=`) are skipped as pages,
        with the links found on them; a link to one counts as a link to its
        path.

        The import replaces the earlier crawl's rows. A page whose status,
        noindex or canonical changed since the earlier crawl is a `served`
        marker on the timeline (at most 500 an import). Cron writes the
        rows within 20 seconds a run, with recovery when a run dies.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                files[]:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                    format: binary
                complete:
                  type: boolean
                  default: false
                  description: Owner confirms this crawl covered the whole site without reaching its page limit.
                partial:
                  type: boolean
                  default: false
                  description: Replace covered pages only (at most 100), keeping other findings. Overrides complete; undo before starting the next import.
                format:
                  type: string
                  enum: [librecrawl, aidevops, csv]
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: array
                  maxItems: 10
                  items:
                    type: object
                    required: [rows]
                    properties:
                      name:
                        type: string
                      rows:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                rows:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                complete:
                  type: boolean
                  default: false
                  description: Owner confirms whole-site coverage; links-only imports cannot be complete.
                partial:
                  type: boolean
                  default: false
                  description: Replace covered pages only (at most 100), keeping other findings. Overrides complete; undo before starting the next import.
                record:
                  type: object
                  description: Optional LibreCrawl get_crawl record, overriding owner confirmation. With format librecrawl, completed status and positive urls_crawled below config_snapshot.max_urls establish completeness. Missing settings or a reached limit means incomplete.
                  properties:
                    status: { type: string }
                    urls_crawled: { type: integer, minimum: 0 }
                    config_snapshot:
                      type: object
                      properties:
                        max_urls: { type: integer, minimum: 0 }
                format:
                  type: string
                  enum: [librecrawl, aidevops, csv]
      responses:
        '202':
          description: Staged; GET this route for progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrawlImportJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Another crawl import is running, or the data set is demo.

  /crawl/imports:
    get:
      operationId: listCrawlImports
      summary: Crawl imports, newest first, with the job (settings permission).
      responses:
        '200':
          description: The last 20 crawl imports.
          content:
            application/json:
              schema:
                type: object
                required: [imports, job]
                properties:
                  imports:
                    type: array
                    items:
                      $ref: '#/components/schemas/CrawlImport'
                  job:
                    $ref: '#/components/schemas/CrawlImportJob'
        '403':
          $ref: '#/components/responses/Forbidden'

  /crawl/imports/{id}:
    delete:
      operationId: undoCrawlImport
      summary: Undo a crawl import — delete the pages and links it wrote (settings permission).
      description: The crawl it replaced is not brought back; import those files again for that. Served markers stay on the timeline.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Rows deleted, and the imports.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, imports]
                properties:
                  deleted:
                    type: integer
                  imports:
                    type: array
                    items:
                      $ref: '#/components/schemas/CrawlImport'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No crawl import has that ID.
        '409':
          description: That import is still running.

  /backlinks/review:
    get:
      operationId: getBacklinkReview
      summary: Explain backlink review signals and local owner decisions (administrators).
      description: Bounded live/lost backlink samples; lost links use the selected period. Missing facts add nothing. Previous decisions remain visible outside the sample. Scores are hints, not proof.
      parameters:
        - $ref: '#/components/parameters/data'
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Sites ordered by descending score, with anchors, reasons and decisions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacklinkReviewAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: decideBacklinkReview
      summary: Save a local domain or source URL decision with user and time (administrators).
      description: Keep suppresses future flags. Domain disavow covers its URLs; a URL keep does not override it. Nothing is submitted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, target, decision]
              properties:
                scope: { type: string, enum: [domain, url] }
                target: { type: string, description: 'ASCII domain name or exact HTTP(S) source URL, up to 2048 characters; no credentials or control characters.' }
                decision: { type: string, enum: [keep, disavow, undecided] }
                data: { type: string, enum: [live, demo], default: live }
      responses:
        '200':
          description: Stored owner decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacklinkDecision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /backlinks/disavow.txt:
    get:
      operationId: exportBacklinkDisavow
      summary: Download a Google-format disavow text attachment (administrators).
      description: UTF-8, grouped domains then unchanged URLs, with site/date/count comment headers. At most 100000 lines and 2 MB including comments. Never truncated or uploaded. Manual upload replaces the old list and requires a URL-prefix property; Bing no longer supports disavow. Most sites never need it.
      parameters:
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: Plain text, not a JSON string. Attachment filename is disavow.txt; Cache-Control is no-store.
          content:
            text/plain:
              schema: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /backlinks/disavow/merge:
    post:
      operationId: mergeBacklinkDisavow
      summary: Retain a prior disavow list locally (administrators).
      description: Validate UTF-8, every entry, 2048-character URL length and combined export line/byte limits before any write. Imported decisions are labelled. A conflicting existing keep/undecided decision rejects the whole merge without writes; every entry in a successful merge is retained. No external submission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 2097152 }
                data: { type: string, enum: [live, demo], default: live }
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                data: { type: string, enum: [live, demo], default: live }
      responses:
        '200':
          description: Unique prior entries retained, without overriding explicit decisions.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries: { type: integer, minimum: 0 }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /backlinks/import:
    get:
      operationId: getBacklinkImport
      summary: Read the current backlink export import's progress (administrators).
      responses:
        '200':
          description: Import progress; cron does the work.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacklinkImportJob'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: importBacklinks
      summary: Stage a backlink CSV or JSON rows (administrators, live data only).
      description: |
        Up to 100,000 rows and 50 MB. UTF-8 comma-separated CSV headers detect
        the source where possible; source overrides ambiguous headers. Rows
        with targets outside the site's own hosts are skipped. Search Console
        rows without targets become referring-page candidates, not links.
        Cron imports within 20 seconds per run with progress. Re-importing
        rows adds no duplicates; missing export rows never mark links lost.
        Verification remains opt-in. Scores stay separate per provider.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                source:
                  type: string
                  enum: [gsc, ahrefs, semrush, majestic, moz, bing, generic]
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                rows:
                  type: array
                  maxItems: 100000
                  items:
                    type: object
                    additionalProperties: true
                source:
                  type: string
                  enum: [gsc, ahrefs, semrush, majestic, moz, bing, generic]
      responses:
        '202':
          description: Staged; GET this route for progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacklinkImportJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Another import is running or live storage is unavailable.

  /backlinks/imports:
    get:
      operationId: listBacklinkImports
      summary: The link export imports, newest first (administrators).
      description: |
        Each import is recorded when staged and updated when it ends: who,
        how (upload, WP-CLI or REST rows), the file's name, size and
        SHA-256, the source and the row counts. The last 20 are kept;
        uploaded files are kept for download up to 200 MB in all, oldest
        dropped first (the entry stays). Rows naming the same link again
        are merged, so results are by source: `/backlinks?kind=reported&source=`.
      responses:
        '200':
          description: The imports.
          content:
            application/json:
              schema:
                type: object
                required: [imports]
                properties:
                  imports:
                    type: array
                    items:
                      $ref: '#/components/schemas/BacklinkImportEntry'
        '403':
          $ref: '#/components/responses/Forbidden'

  /backlinks/imports/{id}/file:
    get:
      operationId: downloadBacklinkImportFile
      summary: Download an import's file as it was uploaded (administrators).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The file, as an attachment (never cached).
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such import, or its file is no longer kept.

  /backlinks/classify:
    post:
      operationId: classifyBacklinks
      summary: Set, add or remove the owner's classes of links, reported pages or sites (administrators).
      description: |
        Give one of `ids`, `pages` or `sites`, at most 500 at a time.
        `ids` are rows of the `links` and `lost` lists; `pages` are rows
        of the `reported` list, whose classes every link on the page has,
        found now or later; `sites` are hosts or address prefixes put on
        (or taken off) the classes' lists in Settings → Backlinks, so
        every link from them has the class (adding turns the lists on).
        `set` gives exactly these classes (none clears them); `add` and
        `remove` change only these. The lists read the change at once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  description: Link ids, a list or comma-separated.
                  oneOf:
                    - type: array
                      items: { type: integer }
                      maxItems: 500
                    - type: string
                pages:
                  description: Reported page ids (the `id` of `reported` rows), a list or comma-separated.
                  oneOf:
                    - type: array
                      items: { type: integer }
                      maxItems: 500
                    - type: string
                sites:
                  description: Hosts or address prefixes (example.com, example.com/blog/), a list or comma-separated.
                  oneOf:
                    - type: array
                      items: { type: string }
                      maxItems: 500
                    - type: string
                classes:
                  description: Class names, a list or comma-separated.
                  oneOf:
                    - type: array
                      items: { $ref: '#/components/schemas/BacklinkClass' }
                    - type: string
                mode:
                  type: string
                  enum: [set, add, remove]
                  default: set
                data:
                  type: string
                  enum: [live, demo]
      responses:
        '200':
          description: What was changed.
          content:
            application/json:
              schema:
                type: object
                required: [updated, classes, mode, scope]
                properties:
                  updated:
                    type: integer
                    description: Rows (links or pages) whose classes changed, or list lines added or removed.
                  scope:
                    type: string
                    enum: [links, pages, sites]
                  ids:
                    type: array
                    items: { type: integer }
                  pages:
                    type: array
                    items: { type: integer }
                  sites:
                    type: array
                    items: { type: string }
                  skipped:
                    type: array
                    description: sites; page-only classes not given to whole sites.
                    items: { $ref: '#/components/schemas/BacklinkClass' }
                  classes:
                    type: array
                    items: { $ref: '#/components/schemas/BacklinkClass' }
                  mode:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /backlinks/lists:
    get:
      operationId: getBacklinkLists
      summary: The class lists of Settings → Backlinks (administrators).
      description: |
        Each class's lines: a site (with its subdomains), an address
        prefix, part of an address or a `*` pattern. Every link whose
        linking page matches a line has the class. Change them with
        POST /backlinks/classify (`sites`) or the settings.
      responses:
        '200':
          description: The lists.
          content:
            application/json:
              schema:
                type: object
                required: [enabled, lists, page_only, classes, off]
                properties:
                  enabled:
                    type: boolean
                    description: Whether the lists apply.
                  page_only:
                    type: array
                    description: Classes in use of one page, not a site; whole-site lines on their lists do nothing.
                    items: { $ref: '#/components/schemas/BacklinkClass' }
                  classes:
                    type: array
                    description: |
                      The classes in use (Settings → Backlinks → Classes):
                      the built-in ones not turned off, then the site's own.
                    items:
                      type: object
                      required: [name, label, hidden, pageOnly, own]
                      properties:
                        name: { $ref: '#/components/schemas/BacklinkClass' }
                        label: { type: string, description: Its name, in the site's language for a built-in class. }
                        hidden: { type: boolean, description: Hidden until ticked in the dashboard's Classes filter. }
                        pageOnly: { type: boolean, description: A page's class, not a site's. }
                        own: { type: boolean, description: One of the site's own classes. }
                  off:
                    type: array
                    description: Classes turned off; links keep them, and they come back when turned on.
                    items: { type: string }
                  lists:
                    type: object
                    description: Each class's lines, keyed by class.
                    additionalProperties:
                      type: array
                      items: { type: string }
        '403':
          $ref: '#/components/responses/Forbidden'

  /backlinks/check:
    post:
      operationId: checkBacklinks
      summary: Check now — open the referring pages due for up to 20 seconds (administrators, live data).
      description: |
        Runs though the setting is off. While pages a link export named
        wait for their first check, the catch-up carries on in cron, a run
        a minute, until each was opened (only while the setting is on).
      responses:
        '200':
          description: The run's counts, with the pages still waiting.
          content:
            application/json:
              schema:
                type: object
                required: [links_new, links_lost, more, waiting]
                properties:
                  links_new:
                    type: integer
                  links_lost:
                    type: integer
                  more:
                    type: boolean
                    description: Pages were left for the next run.
                  waiting:
                    type: integer
                    description: Pages a link export named never opened yet.
                additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Not the live data, or a check is running already.

  /backlinks:
    get:
      operationId: getBacklinks
      summary: Backlinks — pages of other sites linking to the site's pages.
      description: |
        Found without an outside service. Once a day (and with
        `wp seoproanalytics backlinks check`) the site reads the pages that
        sent visits (Referral channel; browsers often give only the other
        site's address, so its home page is read then), opens each with
        a request naming the plugin and the site (public addresses only,
        5 seconds, 1 MB at most), and keeps its links to the site's hosts
        with their text and rel. Each page is checked again weekly; a page
        with no link only after it sends another visit. A link missing on
        `rules.misses` checks in a row, or on a page that answers 404 or
        410, is lost; failed requests count for nothing. New and lost
        links are also changes (`backlink_new`, `backlink_lost`, one per
        referring site and day) on `/markers`. CSV exports can add referring
        pages and links too; see `/backlinks/import`. Missing rows in a newer
        sample never mark a link lost. Imported pages are rechecked weekly
        even after a first miss, while checking is on. After an import,
        the pages it named are opened by a catch-up run every minute
        (`read.next`) until each was opened once; links found on that
        first check are dated from the export and are not new changes.

        - `links`: live links, newest first.
        - `domains`: the sites linking, with their visits in the period,
          most visits first.
        - `pages`: the site's pages linked to, most useful referring domains
          first (sites with a followed link not classed ignore, spam,
          paid_link, private_blog, profile_page, social_media or
          url_unlinked), with followed and useful domains,
          the linking sites' median DR and the class mix.
        - `lost`: links lost in the period, newest first.
        - `reported`: the referring pages link exports named, newest report
          first, with their check (`state`) and the live links found on
          each. Search Console exports name the page linking but not the
          page linked to, so their links show under `links` only once the
          page is opened.
        - `needs`: the site's pages with searches in striking distance
          (positions 4–20, as `/opportunities?kind=striking`) with fewer
          useful referring domains (`useful`: a followed link, not classed
          ignore, spam, paid_link, private_blog, profile_page, social_media
          or url_unlinked) than the median of
          the site's own pages in the top three (`search.top`). `gap` is
          that median less the page's own; highest `need` (the clicks
          within reach in the top three, `potential`, × `gap`) first. Each
          row names its best searches (`queries`). Pages that need links
          also become `/queue` items (kind `backlinks`) once backlinks have
          been read, scored as striking distance.
        - `impact`: pages that gained useful referring domains in the
          period (the `search.rules.max_pages` with the newest first new
          link; measured rows first, best `relative` first), with the new
          sites (`hosts`), the
          page's search clicks, impressions and position per day in the
          `search.rules.window` days before the first new link was found
          and from then, against the whole site's in the same days
          (`site_change`, `relative`), and `change_id`, the
          `backlink_new` change to start an experiment from (`POST
          /experiments` with `change`), which measures against pages left
          alone. `status` is `measured`, `measuring` (fewer days after so
          far) or `no_data`. A change associated with the links, not proof
          they caused it: other changes, seasons and updates move pages
          too, and a link can be older than the day it was first found.

        Every link row has `value`, 0–100: an estimate to rank links by,
        not a search engine's figure. Strength (the mean of the linking
        site's and page's rank where read, else the export's authority,
        else 10; `value_from`) × the rel's factor (nofollow and ugc 0.3,
        sponsored 0.1) × the classes' factor: spam, ignore and
        url_unlinked 0; private_blog 0.1; paid_link 0.25; cross_site,
        link_swap, niche_edit, press_release, profile_page, site_footer
        and social_media 0.5; forum, nap_citation, redirect and wiki 0.75;
        topical 1.25; others 1. A link with several classes takes its
        lowest factor below 1 times its highest above 1, not the product
        of all of them.

        The period counts `new` and `lost`, and the sites' visits; filters
        do not apply. `needs` reads the search data of the period (cut as
        `/opportunities`) and `impact` the links first found in it.
      parameters:
        - name: kind
          in: query
          description: Which list.
          schema:
            $ref: '#/components/schemas/BacklinkKind'
        - name: source
          in: query
          description: How found; filters the bounded 5,000-row window before aggregation and pagination.
          schema:
            type: string
            enum: ['', referrer, dataforseo, gsc, ahrefs, semrush, majestic, moz, bing, generic, verified]
        - $ref: '#/components/parameters/combinedEngine'
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: classes
          in: query
          description: links and lost — only links whose every class is among these (comma-separated BacklinkClass names; none for links without a class). Left out, every link.
          schema: { type: string }
        - name: rel
          in: query
          description: links and lost — only links with one of these (comma-separated followed, nofollow, sponsored, ugc; followed has none of the others).
          schema: { type: string }
        - name: search
          in: query
          description: links and lost — only links with this text, any case, in the linking page, the page linked to or the link text.
          schema: { type: string, maxLength: 200 }
        - name: search_in
          in: query
          description: Where search looks (comma-separated source, page, anchor); all three when left out.
          schema: { type: string }
        - name: date
          in: query
          description: The date date_from and date_to apply to.
          schema: { type: string, enum: ['', first_seen, last_seen, lost], default: '' }
        - name: date_from
          in: query
          description: links and lost — only links whose date is on or after this day.
          schema: { type: string, format: date }
        - name: date_to
          in: query
          description: links and lost — only links whose date is on or before this day.
          schema: { type: string, format: date }
        - name: site_dr_min
          in: query
          description: |
            links and lost — ranges of the linking site's and page's
            figures: site_dr_min, site_dr_max, site_ld_min, site_ld_max,
            page_dr_min, page_dr_max, page_ld_min, page_ld_max (each a
            whole number from 0). Links without the figure are left out
            while its range is set.
          schema: { type: integer, minimum: 0 }
        - name: sort
          in: query
          description: links and lost — the order; links without the value come last.
          schema: { type: string, enum: ['', source, page, anchor, first_seen, last_seen, lost, site_dr, site_ld, page_dr, page_ld, value], default: '' }
        - name: order
          in: query
          description: asc or desc; left out, A to Z for text and most first for the rest.
          schema: { type: string, enum: ['', asc, desc], default: '' }
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: One backlinks list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacklinksAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /owners:
    get:
      operationId: getOwners
      summary: Who owns the SEO of what, per person who can own (read and edit_posts).
      description: |
        Each person who can own (roles chosen in Settings → Data → Owners,
        by default administrators, editors, shop managers and authors;
        `roles` lists them) with their pages,
        open Plan items (new and accepted) and those items' potential
        clicks per 28 days, open search targets, and running experiments
        with those due for review; then what nobody owns. Ownership is
        responsibility for the SEO only: a page's author and last editor
        stay facts of their own. See Owner for the defaults. Lists take
        `owner` to show one person's work. Never in shared reports.
      parameters:
        - $ref: '#/components/parameters/engine'
        - name: goal
          in: query
          description: ID of the goal whose conversions give a page its value; the first goal when left out.
          schema:
            type: string
        - name: range
          in: query
          description: The Plan's period, in the site time zone.
          schema:
            type: string
            default: 90d
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/filters'
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: The people and what they own.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnersAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'
    post:
      operationId: setOwners
      summary: Set the owner of pages, targets, Plan items or experiments (read and edit_posts).
      description: |
        Administrators give work to anyone who can own. People who can own
        take work nobody else was given (`user` me) and give their own
        back (`user` default). `none` sets nobody on purpose, which
        overrides the default; `default` forgets the owner set. Ids
        that are not found, or that another person was given, are
        answered in `skipped` with the reason.
      parameters:
        - $ref: '#/components/parameters/data'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnersInput'
      responses:
        '200':
          description: The ids set and those skipped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnersSetAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /targets:
    get:
      operationId: getTargets
      summary: Search targets — the searches the site chose to win, the page meant for each, and how search treats them now.
      description: |
        Each target (at most `rules.max_targets`), highest priority
        first, then most impressions, with the query's clicks,
        impressions, CTR and position on any page in the period, the
        page search shows most for it (`shown`, with its share of the
        query's impressions) and the page meant for it (`page`, with its
        own figures), as one `state`:

        - `ranking`: the page meant for it is the page shown most (or
          search gave no page for the query);
        - `wrong_page`: another page is;
        - `no_page`: no page is chosen yet;
        - `not_shown`: no impressions in the period.

        `band` places the position: `top` (1–3), `striking`
        (`rules.striking_from`–`rules.striking_to`) or `beyond`.
        `statuses` counts every target by status; `counts` counts the
        targets of the `status` asked for by state. Open targets
        (candidate, targeted, live) also become `/queue` items (kind
        `target`). As `/opportunities`, the period is cut at the newest
        search day and to its newest 366 days, and the comparison
        (`then_position`, `then_clicks`) has as many days. Reads `targets`
        by its primary key, then `gsc_queries` and `gsc_pairs` by
        `query_day` for the targets' queries only.
      parameters:
        - $ref: '#/components/parameters/engine'
        - name: status
          in: query
          description: Targets in this status; open is candidate, targeted and live.
          schema:
            $ref: '#/components/schemas/TargetFilter'
        - name: range
          in: query
          description: Period, in the site time zone.
          schema:
            type: string
            default: 30d
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/compare'
        - $ref: '#/components/parameters/owner'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: The targets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetsAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'
    post:
      operationId: importTargets
      summary: Import search targets, added or updated by query, with the rows skipped and why (manage_options).
      description: |
        Give `targets` as a list of objects, or `text`: CSV or
        tab-separated text (a header row naming the columns, or query,
        page, priority and status in that order), JSON (a list, or an
        object with `targets`), or the aidevops search targets table
        (TOON: its first table with a `phrase` or `query` column).

        Columns: `query` (or `phrase`, `keyword`, `search`, `question`),
        `page` (or `address`, `url`, `target_url`, `path`, `target`: a
        path such as `/pricing/` or an address on this site; empty for
        none chosen yet), `priority` (0–100, or high 80, medium 50, low
        20; 50 when left out) and `status` (candidate, targeted, live,
        won or retired; `active` is targeted; targeted when left out).
        Optional research fields are `allintitle` (Google result count),
        `volume` (monthly search volume), `allintitle_measured` and
        `volume_measured` (YYYY-MM-DD, no future dates; today when omitted).
        Counts are whole numbers from 0 to 4294967295, or JSON null to clear.
        Omitted research fields preserve existing values and dates.
        KGR is null for unknown counts, zero volume or volume above 250.
        Research facts do not come from Search Console impressions.
        Queries are stored lower case. Each row is checked: no query
        text, an address not on this site, a priority or status that
        cannot be read, a search already in an earlier row, or a new
        target past the most kept skips the row with its number and
        reason, never a guess. At most 5,000 rows and 1 MB of text.
      parameters:
        - $ref: '#/components/parameters/data'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targets:
                  type: array
                  items:
                    type: object
                    properties:
                      query:
                        type: string
                      page:
                        type: string
                      priority:
                        type: [integer, string]
                      status:
                        type: string
                      allintitle:
                        type: [integer, 'null']
                        minimum: 0
                        maximum: 4294967295
                      volume:
                        type: [integer, 'null']
                        minimum: 0
                        maximum: 4294967295
                      allintitle_measured:
                        type: string
                        format: date
                      volume_measured:
                        type: string
                        format: date
                text:
                  type: string
                replace:
                  type: boolean
                  default: false
                  description: Delete the targets that are not in this import.
                only_new:
                  type: boolean
                  default: false
                  description: Add new searches only. Searches already listed are skipped (reason `exists`) and left as they are; `replace` is ignored.
                source:
                  type: string
                  enum: [list, search]
                  default: list
                  description: Where the targets come from, kept as their source. `search` marks rows added from a search report (the dashboard's Add as target). TOON text is always `aidevops`.
      responses:
        '200':
          description: What the import did.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetsImportAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'
    delete:
      operationId: deleteTargets
      summary: Delete search targets by their searches, or every target (manage_options). Search data stays.
      parameters:
        - $ref: '#/components/parameters/data'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                queries:
                  type: array
                  items:
                    type: string
                all:
                  type: boolean
                  default: false
      responses:
        '200':
          description: How many were deleted and how many are left.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, total]
                properties:
                  deleted:
                    type: integer
                  total:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /targets/queries:
    get:
      operationId: getTargetQueries
      summary: Every search target's query with its page, status and priority, without search figures, so reports can mark searches that are targets.
      description: |
        Reads the targets by their primary key and their texts by the
        dictionary's; no search data. By query, A–Z. Not in shared
        reports.
      parameters:
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: The targets' queries.
          content:
            application/json:
              schema:
                type: object
                required: [targets]
                properties:
                  targets:
                    type: array
                    items:
                      $ref: '#/components/schemas/TargetListed'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /targets/suggestions:
    get:
      operationId: getTargetSuggestions
      summary: The SEO plugin's focus keywords as target suggestions, each with its page and whether it is new, a target already, or the focus keyword of more than one page (manage_options).
      description: |
        The focus keywords Rank Math, Yoast SEO, SEOPress or All in One
        SEO keeps for published, viewable posts: the active plugin's (any
        plugin's when none is active), and any the
        `seoproanalytics_focus_keywords` filter adds. One row per search
        (lower case), in a state: `new` (one page's focus keyword, not a
        target yet), `clash` (more than one page's: which page is meant is
        the owner's choice, so it is never imported; add it as a list with
        its page) or `targeted` (a target already, with its page and
        status). New first, then clashes, then targets, each A–Z. Each
        page's main keyword; `all_keywords` adds its other focus keywords.
        At most `max_posts` posts are read (`more` says there were more).
        Reads postmeta by its `meta_key` index, one key at a time, on this
        request only; nothing is stored. The demo data set reads the demo
        pages' focus keywords.
      parameters:
        - $ref: '#/components/parameters/data'
        - name: all_keywords
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The suggestions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetSuggestionsAnswer'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'
    post:
      operationId: importTargetSuggestions
      summary: Import the new focus keyword suggestions, all or those given, as targeted with their page, priority 50, source seo-plugin (manage_options). Existing targets stay as they are.
      description: |
        Suggestions that are targets already are skipped (`exists`), those
        of more than one page too (`clash`), and searches given that are no
        page's focus keyword (`unknown`). Rows are numbered in the
        suggestions' order. The answer's `format` is `seo-plugin`.
      parameters:
        - $ref: '#/components/parameters/data'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                queries:
                  type: array
                  items:
                    type: string
                  description: The suggested searches to import; left out for every new one.
                all_keywords:
                  type: boolean
                  default: false
      responses:
        '200':
          description: What the import did.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetsImportAnswer'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /coverage:
    get:
      operationId: getCoverage
      summary: Query coverage of one page — its search queries, which its words do not cover, questions and focus keywords.
      description: |
        The Search Console queries one page showed for (most impressions
        first, up to 200), each checked against the page's own words: its
        terms are its words without common short words, lightly stemmed
        (plural s). `match` is `title` when every term is in the post
        title or SEO title, `heading` when every term is in the headings,
        `text` when every term is anywhere on the page (text, excerpt,
        image alt text, SEO description), `partial` when some are, else
        `none`; `missing` lists the words the page lacks and `phrase`
        whether the words are there in order. `question` marks queries
        that start with a question word or hold a question mark.

        `focus` lists the focus keywords of Rank Math, Yoast SEO,
        SEOPress or All in One SEO when one is active (others can add
        theirs with the `seoproanalytics_focus_keywords` filter), with their
        search figures when they are queries of the page. Without an SEO
        plugin `focus` is empty and the rest is the same.

        Give the page as `page` (a path) or `post` (a post ID: its
        address). Only one page's queries are read, by the `path_day`
        key; its post is read once. As `/opportunities`, the period is
        cut at the newest search day and to its newest 366 days.
      parameters:
        - name: page
          in: query
          description: The page, a path such as /pricing/.
          schema:
            type: string
        - name: post
          in: query
          description: The post whose address is the page.
          schema:
            type: integer
            minimum: 0
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: The page's queries and how its words cover them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /content:
    get:
      operationId: getContent
      summary: Content performance — each page's search clicks with its visits from search and their conversions.
      description: |
        Per page, the search engine's clicks, impressions, CTR and
        position (`engine`: Google, Bing or all, Combined) beside the visits from
        organic search (any engine) that
        started on the page, with their bounce rate, views per visit and
        time, and how many of those visits reached a goal: `goal`, or the
        first goal when left out (`conversions` is null without goals).
        A page with clicks but no visits, or visits but no clicks, is
        listed too.

        Every read uses an index and none grows with all the visits:
        the search tables by their keys, the daily summaries of search
        landings, and the goal's hits joined to their visits. Days
        summarised before search landings existed are filled in, newest
        first, a few minutes after an update; until then `partial` is
        true and `landings_from` is the oldest day counted.

        As `/search`, the period is cut at the newest search day and
        the comparison has as many days. Page filters apply; other
        filters are listed in `ignored`.
      parameters:
        - $ref: '#/components/parameters/combinedEngine'
        - name: sort
          in: query
          description: |
            The figure the pages are sorted by, in `order`. `conversions`
            and `conversion_rate` need a goal; without goals the default is
            used. The answer's `sort` and `order` say what was applied.
          schema:
            type: string
            enum: [impressions, clicks, ctr, position, visits, bounce_rate, visit_duration, conversions, conversion_rate]
            default: impressions
        - $ref: '#/components/parameters/order'
        - name: goal
          in: query
          description: ID of the goal whose conversions are counted; the first goal when left out.
          schema:
            type: string
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/compare'
        - $ref: '#/components/parameters/filters'
        - $ref: '#/components/parameters/owner'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: Totals and pages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /demo:
    get:
      operationId: getDemo
      summary: Whether the demo data is made, and which data set the signed-in person sees.
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoStatus'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: makeDemo
      summary: Make the demo data, or carry on making it.
      description: |
        Needs manage_options. Starts when there is no demo data (or with
        `restart`), then each call does up to ten seconds of work: call
        again until `status` is `ready`. Live statistics are not touched.
        While it is shown, demo data is topped up to the present, so today
        and realtime have visits.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                days:
                  type: integer
                  minimum: 1
                  maximum: 800
                  default: 400
                  description: Days of visits back from today.
                restart:
                  type: boolean
                  default: false
                  description: Remove the demo data and make it again.
      responses:
        '200':
          description: Status after this slice of work.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoStatus'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: removeDemo
      summary: Remove the demo data (its tables). Needs manage_options; live statistics are not touched.
      responses:
        '200':
          description: Status (none).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoStatus'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'

  /view:
    post:
      operationId: setView
      summary: Save the data set the signed-in person sees on the screens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: string
                  enum: [live, demo]
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: string
                    enum: [live, demo]
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'

  /indexnow:
    get:
      operationId: getIndexNow
      summary: Stored IndexNow notification status; requires permission to change settings.
      description: Never submits URLs. Received (200 or 202) does not mean indexed. Google does not participate.
      responses:
        '200':
          description: Notification status and the last 100 submission receipts.
          content:
            application/json:
              schema:
                type: object
                required: [enabled, endpoint, key_url, queued, last, log, error]
                properties:
                  enabled:
                    type: boolean
                  endpoint:
                    type: string
                    format: uri
                  key_url:
                    type: string
                    description: Public verification address, or empty while off or not yet generated.
                  key_check:
                    type: object
                    nullable: true
                    description: The site's last fetch of its own key address (daily in cron, or wp seoproanalytics indexnow check); null before the first.
                    required: [time, code, ok]
                    properties:
                      time:
                        type: integer
                      code:
                        type: integer
                        description: HTTP code, or 0 when the request failed.
                      ok:
                        type: boolean
                        description: HTTP 200 with the key as the body.
                  queued:
                    type: integer
                  error:
                    type: string
                    description: Why the last submission was not received, else a failed key check, else empty.
                  last:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/IndexNowReceipt'
                  meaning:
                    type: string
                    description: The last submission's HTTP code in plain words (202 is received with the key still being checked); empty before the first.
                  log:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/IndexNowReceipt'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'

  /connections:
    get:
      operationId: listConnections
      summary: Every outside data source's status. Needs the right to change the settings; never returns credentials.
      description: |
        `sources` lists the registered sources: Bing Webmaster Tools, and
        those the SEO Pro Analytics Connect add-on registers. `addon.needed`
        lists the add-on's connections not registered on this site, with
        the add-on's page in `addon.url`; asking for one of them answers
        402 `seoproanalytics_needs_addon`.
      responses:
        '200':
          description: Statuses.
          content:
            application/json:
              schema:
                type: object
                required: [sources, addon]
                properties:
                  sources:
                    type: array
                    items:
                      $ref: '#/components/schemas/Connection'
                  addon:
                    type: object
                    required: [url, needed]
                    properties:
                      url:
                        type: string
                        format: uri
                        description: The add-on's page.
                      needed:
                        type: object
                        description: Source key => the connection the add-on adds.
                        additionalProperties:
                          type: object
                          required: [name, kind, what]
                          properties:
                            name:
                              type: string
                            kind:
                              type: string
                              enum: [source, provider]
                            what:
                              type: string
                              description: What it adds, in one line.
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'

  /connections/{source}:
    parameters:
      - $ref: '#/components/parameters/source'
    get:
      operationId: getConnection
      summary: One source's status.
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '402':
          $ref: '#/components/responses/NeedsAddon'
        '404':
          $ref: '#/components/responses/UnknownSource'
    post:
      operationId: connect
      summary: Connect a source, or change its property or key.
      description: |
        Bing Webmaster Tools: checks the API key (Bing Webmaster Tools →
        Settings → API access) by listing its verified sites before
        anything is stored. The key is stored encrypted and never
        returned. The import starts in WP-Cron a few seconds later: the 16
        months Bing keeps, then each week once Bing gives it, then each top
        page's queries. Another site starts the import again from the
        beginning.

        A connection the SEO Pro Analytics Connect add-on registers takes
        its own fields as well (the add-on's documentation lists them).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                key:
                  type: string
                  description: The API key. Without it, the saved key is kept (to change the site).
                property:
                  type: string
                  description: The verified site to import. Without it, the one for this site's address.
                  examples: ['https://example.com/']
      responses:
        '200':
          description: Connected; its status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '400':
          description: |
            The key cannot be read, the service refused it, or it cannot
            read the site. When the site is the problem, `data.properties`
            lists the ones it can read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '402':
          $ref: '#/components/responses/NeedsAddon'
        '404':
          $ref: '#/components/responses/UnknownSource'
    delete:
      operationId: disconnect
      summary: Disconnect a source (forget its credentials); its imported data stays unless delete_data is true.
      description: >-
        Also works for one of the SEO Pro Analytics Connect add-on's connections
        saved here while the add-on is not registered: its encrypted
        credentials are forgotten, and with delete_data its imported search
        days too (the add-on's other tables stay until uninstall).
        402 only when such a connection has nothing saved.
      parameters:
        - name: delete_data
          in: query
          description: Also delete the data imported from it, and its import history.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Disconnected; its status, with the rows deleted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Connection'
                  - type: object
                    required: [deleted]
                    properties:
                      deleted:
                        type: integer
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '402':
          $ref: '#/components/responses/NeedsAddon'
        '404':
          $ref: '#/components/responses/UnknownSource'

  /connections/{source}/import:
    parameters:
      - $ref: '#/components/parameters/source'
    post:
      operationId: importNow
      summary: Import now, for up to 20 seconds; while history remains, the job carries on in WP-Cron a minute apart.
      responses:
        '200':
          description: What this run did, and the status after it.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Connection'
                  - type: object
                    required: [run]
                    properties:
                      run:
                        type: object
                        required: [days, rows, import, done]
                        properties:
                          days:
                            type: integer
                          rows:
                            type: integer
                          pages:
                            type: integer
                            description: Bing, pages whose queries were imported in this run.
                          import:
                            type: integer
                            description: The imports row it wrote (0 when there was nothing new).
                          done:
                            type: boolean
                            description: Every final day is in.
        '400':
          description: The source is not connected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '402':
          $ref: '#/components/responses/NeedsAddon'
        '404':
          $ref: '#/components/responses/UnknownSource'
        '409':
          description: Another import is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: The source answered with an error (the message is its own); the job tries again later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /imports/{id}:
    delete:
      operationId: undoImport
      summary: Undo an import, deleting the rows it wrote.
      description: |
        The job does not import those days again; `wp seoproanalytics
        search-console reimport --from=… --to=…` (or `bing reimport`)
        does. Undoing an import
        already undone deletes nothing. An import from another statistics
        plugin (`/migrate`) deletes the days it added and its timeline
        note; settings it filled in stay, and importing again fills the
        days again.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Undone.
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted]
                properties:
                  id:
                    type: integer
                  deleted:
                    type: integer
                    description: Rows deleted.
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: There is no import with that ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: That import from another statistics plugin is still running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /migrate:
    get:
      operationId: getMigrate
      summary: Other statistics plugins whose data is on the site, the import job and the imports so far.
      description: |
        A plugin is listed while its statistics or its leftovers are on the
        site, whether it is active, inactive or deleted. The list is kept
        for ten minutes (`fresh` looks again). While an import runs, each
        read moves it on for a few seconds, as WP-Cron does.
        For administrators who may change the settings.
      parameters:
        - name: fresh
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrateStatus'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'

  /migrate/{source}:
    parameters:
      - $ref: '#/components/parameters/migrateSource'
    post:
      operationId: runMigrate
      summary: The dry run, or start importing a plugin's history.
      description: |
        Days are whole days in the site's time zone. Only days before SEO
        Pro Analytics's own first day are imported, and a day another import
        filled is skipped, so a second run adds nothing. When another
        plugin not imported yet has statistics on the same days, `prefer`
        names the one that fills them; it imports first. The import runs
        in the background; `GET /migrate` shows its progress, then the
        import with its check.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run:
                  type: boolean
                  default: false
                  description: Only say what the import would do. Writes nothing.
                prefer:
                  type: string
                  description: For days another plugin shares, the plugin that fills them.
                from:
                  type: string
                  format: date
                  description: First day to import; default its first day.
                to:
                  type: string
                  format: date
                  description: Last day to import; default its last day.
                settings:
                  type: array
                  items:
                    type: string
                  description: >-
                    The settings to carry over when the import finishes, by
                    key (the dry run's `settings[].key`); a key's related
                    settings follow it. Only those the dry run would change
                    are filled in. An empty list carries none; without it,
                    every one the dry run would change.
      responses:
        '200':
          description: The dry run (`dry_run`), or the job started.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/MigratePlan'
                  - type: object
                    required: [job]
                    properties:
                      job:
                        $ref: '#/components/schemas/MigrateJob'
        '400':
          description: A day is not written as YYYY-MM-DD.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: SEO Pro Analytics cannot import from that plugin, or none of its statistics are on the site.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: An import is already running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The statistics tables are being updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /migrate/{source}/cleanup:
    parameters:
      - $ref: '#/components/parameters/migrateSource'
    post:
      operationId: cleanupMigrate
      summary: List, or remove, what a statistics plugin left behind.
      description: |
        Lists exactly what the plugin leaves on this site now (tables with
        this site's prefix, options, transients, cron hooks, user meta
        keys, files and folders in wp-content); `dry_run: false` deletes
        exactly that list. Refused while the plugin is active on the site
        or the network. On multisite, what the network shares is listed
        and never deleted. It cannot be undone; imported days stay. Needs
        the `delete_plugins` and `manage_options` capabilities.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run:
                  type: boolean
                  default: true
      responses:
        '200':
          description: The list, and after a real run what was removed and what is left.
          content:
            application/json:
              schema:
                type: object
                required: [source, name, plugin, leftovers, dry_run]
                properties:
                  source:
                    type: string
                  name:
                    type: string
                  plugin:
                    $ref: '#/components/schemas/MigratePlugin'
                  leftovers:
                    $ref: '#/components/schemas/MigrateLeftovers'
                  dry_run:
                    type: boolean
                  removed:
                    type: object
                    description: Items removed by kind (tables, options, transients, cron, user_meta, post_meta, roles, files).
                    additionalProperties:
                      type: integer
                  left:
                    $ref: '#/components/schemas/MigrateLeftovers'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          description: Not allowed to delete plugins and change the settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: SEO Pro Analytics cannot import from that plugin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The plugin is active; deactivate it first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    applicationPassword:
      type: http
      scheme: basic
      description: WordPress username and an Application Password.
    cookieNonce:
      type: apiKey
      in: header
      name: X-WP-Nonce
      description: The logged-in cookie with a wp_rest nonce (the dashboard).

  parameters:
    range:
      name: range
      in: query
      description: |
        Period in the site time zone. realtime: the last 30 minutes. 24h:
        the last 24 whole hours and the current one. 7d, 28d, 30d, 90d, 91d,
        182d, 364d: that many days including today; 7d, 28d, 91d, 182d and
        364d are whole weeks, so the previous period starts on the same
        weekday. week (from the site's first day of the week), month, year:
        so far. 12mo: a year back from tomorrow. lastyear: the previous
        calendar year. all: since the first visit. custom: from and to.
      schema:
        type: string
        enum: [realtime, today, yesterday, 24h, 7d, 28d, 30d, 90d, 91d, 182d, 364d, week, month, year, 12mo, lastyear, all, custom]
        default: 7d
    from:
      name: from
      in: query
      description: First day of a custom range.
      schema:
        type: string
        format: date
    to:
      name: to
      in: query
      description: Last day of a custom range (included).
      schema:
        type: string
        format: date
    owner:
      name: owner
      in: query
      description: |
        Only those of this owner: me, none (owned by nobody) or a user id
        (/owners lists the people who can own); everyone's when left out.
        For people who can edit posts (403 otherwise). See Owner.
      schema:
        type: string
        examples: [me, none, '12']
    compare:
      name: compare
      in: query
      description: |
        prev: the period before. week, month and year (so far) and lastyear
        meet the same part of the previous week, month or year (Monday to
        Wednesday meets last Monday to Wednesday; the 1st to the 11th the
        previous month's 1st to 11th, never more than that whole month);
        24h and realtime the same length just before; the rest the same
        number of days just before.
        typical: for stats and timeseries only, average the four earlier
        periods shifted by multiples of the range length rounded up to
        whole weeks. Only whole-day ranges of 1–28 days qualify. Each
        period is cut to the same elapsed length for a partial range.
        Counts may be fractional; rates come from summed counts.
        Monthly grain is resolved to day for eligible typical timeseries,
        so every point covers equivalent days after the weekday shifts.
        compare.range is the envelope, compare.periods the actual reads,
        newest first. Other reports and unsupported ranges omit comparison.
        week: the period a week (7 days) earlier, so each day meets the
        same weekday.
        month_weekday: a month earlier on the same weekdays and week of the
        month (the 1st to 7th are its first week, the 8th to 14th its
        second): 4 weeks back, or 5 when 4 weeks back is still the same
        month (the 29th to the 31st, which meet the previous month's last
        such weekday) or another week of the previous month.
        month: a month earlier on the same dates: from the same day a month
        before (that month's last day when it is shorter), as many days.
        year_weekday: a year earlier on the same weekdays: 52 weeks (364
        days) back.
        year: the same dates a year before.
        Moves are by days on the clock, so DST does not shift them. A range
        that ends in the future is compared with the same length of the
        other period, so a partial day meets a partial day. All time has no
        comparison.
      schema:
        type: string
        enum: [none, prev, typical, week, month_weekday, month, year_weekday, year]
        default: none
    filters:
      name: filters
      in: query
      description: |
        Every filter must match (AND). Each is
        `dimension:operator:value`, where a comma means any of (OR), `\,`
        is a comma and `\\` a backslash in a value (any other backslash is
        itself); `dimension:value` means `is`. Repeat the
        parameter as `filters[]=` for several, or send a JSON list of
        `{dimension, op, values}`. Operators: is, is_not, contains (anywhere,
        case-insensitive per the database collation), matches (glob: `*` is
        any text). An empty value is "none" (for source: direct). Channel
        and device take their names (organic_search, mobile); country takes
        ISO codes. Page and event filters select visits that viewed the
        page or had the event; with a page filter, pageviews count only
        that page's views.
      style: form
      explode: true
      schema:
        oneOf:
          - type: string
            examples: ['channel:is:organic_search,ai']
          - type: array
            items:
              type: string
            examples: [['page:matches:/blog/*', 'country:is_not:US']]
    data:
      name: data
      in: query
      description: live (the site's statistics) or demo (the demo data, once made).
      schema:
        type: string
        enum: [live, demo]
        default: live
    offset:
      name: offset
      in: query
      description: Rows to skip, for the next page of a list.
      schema:
        type: integer
        minimum: 0
        default: 0
    order:
      name: order
      in: query
      description: |
        Direction of `sort`: `desc` highest (or newest) first, `asc`
        lowest (or oldest) first. Left out, the column's natural one:
        `asc` for `position` (a lower position is better), `desc` for
        the rest. Rows without the figure (a position without
        impressions, a rate without visits) come last either way.
      schema:
        type: string
        enum: [desc, asc]
    engine:
      name: engine
      in: query
      description: |
        Search engine: google (Search Console) or bing (Bing Webmaster
        Tools). Bing gives no devices or countries, and its pages and
        queries by week: the period is widened at its start to whole weeks,
        and a page's or query's points are by week.
      schema:
        type: string
        enum: [google, bing]
        default: google
    combinedEngine:
      name: engine
      in: query
      description: |
        Search engine: google (Search Console), bing (Bing Webmaster Tools)
        or all (Combined). Bing gives no devices or countries, and its pages
        and queries by week: the period is widened at its start to whole
        weeks, and a page's or query's points are by week. Combined adds up
        every engine with data (clicks, impressions and position ×
        impressions, so CTR and position are over all of them; a query or
        page shown on more than one engine is one row); its period ends at
        the earliest of the engines' newest days (`through`), in whole weeks
        when one engine is weekly (a page's or query's points then by week,
        ending on the period's last day), with no devices or countries. Each
        engine's days are its own (Google's in Pacific time, Bing's in UTC).
        While fewer than two engines have data, all answers as the one with
        data (`engine` in the answer says which).
      schema:
        type: string
        enum: [google, bing, all]
        default: google
    changePage:
      name: page
      in: query
      description: Only changes to this page (a path; `*` is any text), and the site-wide ones (plugins, themes, settings), which affect every page.
      schema:
        type: string
        examples: [/pricing/]
    changeKinds:
      name: kinds
      in: query
      description: |
        Only these kinds or groups of change, comma-separated. Groups:
        content, seo, product, site, search, note. Kinds: published,
        unpublished, address, title, content, links, external_links,
        ab_test_started, ab_test_paused, ab_test_ended, ab_test_winner
        (an A/B test's state saved in the editor; see /ab-tests); seo_title, meta_description, robots, canonical,
        backlink_new, backlink_lost (links from other sites found or lost
        by the daily check; see /backlinks); out_of_stock,
        back_in_stock, price_up, price_down, sale_started, sale_ended,
        coupon_published, coupon_changed, coupon_removed; plugin_installed,
        plugin_updated, plugin_activated, plugin_deactivated,
        plugin_deleted, theme_switched, theme_updated, core_updated,
        search_visibility, permalinks, site_address, front_page,
        business_profile (a business profile added, changed or removed in
        Settings → Data; meta action, name, platform, campaign and the
        fields changed; see /business-profiles);
        search_update (search engine updates, when switched on under
        Settings → Data), index_status (a page's verdict in Google's
        URL Inspection changed; old and new are Google's coverage states;
        see /inspections), rank_move (a tracked search target's Google,
        Brave or DeepSeek position moved by 3 or more, or onto or off the
        first 10, in a paid provider's weekly check; old and new are
        places, empty when not within the results read; meta engine names
        the engine), ai_source (in the search group: the site entered or
        left the sources Brave or Linkup gives an AI to answer a tracked
        target from; old and new are its place among them, empty when not
        among them; meta engine names the engine), served (in the seo group: what a
        page served to an imported crawl changed since the crawl before,
        its status, noindex or canonical elsewhere; old and new say what
        it served; see /crawl); note, experiment (an experiment's start;
        see /experiments).
      schema:
        type: string
        examples: [product, 'plugin_updated,core_updated', search]
    id:
      name: id
      in: path
      required: true
      description: A goal's or funnel's id (lower-case letters and digits).
      schema:
        type: string
        pattern: '^[a-z0-9]+$'
    source:
      name: source
      in: path
      required: true
      description: An outside data source, bing or one the add-on registers (its keys are in `GET /connections` → `addon.needed` while it is not).
      schema:
        type: string
        pattern: '^[a-z0-9-]{1,20}$'
        example: bing
    migrateSource:
      name: source
      in: path
      required: true
      description: A statistics plugin SEO Pro Analytics can import from (more can be added with the `seoproanalytics_migrate_sources` filter).
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        example: burst-statistics

  responses:
    BadDefinition:
      description: A field is missing or too long, a funnel has too few or too many steps, or the data set already has the most goals or funnels it may.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: There is no such goal, funnel, note, experiment or change in this data set (or, with data=demo, no demo data).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Deleted:
      description: Deleted.
      content:
        application/json:
          schema:
            type: object
            required: [deleted, id]
            properties:
              deleted:
                type: boolean
              id:
                type: [string, integer]
                description: A goal's or funnel's id (a string), or a note's or experiment's (an integer).
    NoDemo:
      description: data=demo, and there is no demo data yet (POST /demo makes it).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: A parameter cannot be read; the message says how to write it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Not logged in, or without view_seoproanalytics.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnknownSource:
      description: There is no such data source.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NeedsAddon:
      description: The source is one the SEO Pro Analytics Connect add-on adds, and it is not registered on this site (`seoproanalytics_needs_addon`; the message names the add-on's page).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    VitalSample:
      type: object
      required: [day, form_factor, metric, p75, good, ni, poor, status, stale]
      properties:
        day: {type: string, format: date, description: Last day of the rolling 28-day collection period.}
        form_factor: {type: string, enum: [PHONE, DESKTOP]}
        metric: {type: string, enum: [lcp, inp, cls, fcp, ttfb]}
        p75: {type: number, minimum: 0, description: Milliseconds except CLS (unitless).}
        good: {type: number, minimum: 0, maximum: 1}
        ni: {type: number, minimum: 0, maximum: 1}
        poor: {type: number, minimum: 0, maximum: 1}
        status: {type: string, enum: [good, needs_improvement, poor]}
        stale: {type: boolean, description: Older than 14 days; excluded from failing-page findings.}
    VitalsAnswer:
      type: object
      required: [connected, source, window_days, traffic_days, origin, series, rows]
      properties:
        connected: {type: boolean}
        source: {type: string, const: crux}
        window_days: {type: integer, const: 28}
        traffic_days: {type: integer, const: 30}
        origin: {type: array, items: {$ref: '#/components/schemas/VitalSample'}}
        series: {type: array, items: {$ref: '#/components/schemas/VitalSample'}}
        rows:
          type: array
          items:
            type: object
            required: [path_id, path, clicks, visits, samples, available, failing]
            properties:
              path_id: {type: integer}
              path: {type: string}
              clicks: {type: integer}
              visits: {type: integer}
              samples: {type: array, items: {$ref: '#/components/schemas/VitalSample'}}
              available: {type: boolean}
              failing: {type: boolean, description: Any non-stale LCP, INP or CLS p75 is poor.}
    LighthouseAnswer:
      type: object
      required: [source, url, score, opportunities]
      properties:
        source: {type: string, const: lighthouse}
        url: {type: string}
        score: {type: [number, 'null'], minimum: 0, maximum: 1}
        opportunities:
          type: array
          items:
            type: object
            required: [id, title, display, saved_ms]
            properties:
              id: {type: string}
              title: {type: string}
              display: {type: string}
              saved_ms: {type: number}
    IndexNowReceipt:
      type: object
      required: [time, count, code, sent]
      properties:
        time:
          type: integer
          description: Unix submission time.
        count:
          type: integer
        code:
          type: integer
          description: HTTP response code; zero for a transport error.
        sent:
          type: boolean
          description: The service received the batch (200 or 202), not proof of indexing.
    ShareInput:
      type: object
      description: Administrator share fields. Creation needs views; updates merge omitted fields with the current share. Secrets never appear in list/update responses.
      properties:
        name: {type: string, maxLength: 190}
        note: {type: string, maxLength: 2000}
        email:
          type: object
          description: Owner-only schedule. Missing schedules are disabled. Delivery state is returned to owners only and cannot be set by clients. Public open responses omit this object.
          properties:
            enabled: {type: boolean, default: false}
            recipients:
              type: array
              maxItems: 20
              uniqueItems: true
              items: {type: string, format: email}
              description: One to twenty valid addresses when enabled; deduplicated case-insensitively. Input also accepts one address per line.
            interval: {type: string, enum: [daily, weekdays, weekly, monthly, quarterly], default: weekly}
            hour: {type: integer, minimum: 0, maximum: 23, default: 8, description: Site-local send hour.}
            intro: {type: string, maxLength: 2000, default: ''}
            events: {type: boolean, default: true, description: List privacy-safe site changes in the email period. Omitted with non-page locked filters.}
            notes: {type: boolean, default: false, description: Include team timeline note text and page but never author or experiment notes. Enable only for notes fit for the recipient.}
            last_period: {type: string, readOnly: true, description: 'Interval:first-date:last-date of the latest accepted period.'}
            last_sent: {type: integer, readOnly: true, description: Unix acceptance time.}
            last_error: {type: string, readOnly: true, description: Safe delivery or report error.}
        email_password:
          type: boolean
          default: false
          description: Explicit consent to store an encrypted password for emails. A password must be entered in the same save to store a new copy. False deletes the copy; clearing or replacing the password without opt-in also deletes it. Does not send emails.
        password: {type: string, maxLength: 256}
        views:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            description: Saved ViewState; valid section choices are normalized as the dashboard address reader normalizes them. Each section once (Search once per engine); with Search or Changes, locked_filters can only choose pages.
            required: [view]
            properties:
              view: {type: string, enum: [overview, search, goals, funnels, properties, clicks, changes]}
              engine: {type: string, enum: [google, bing], description: Search only; google when left out.}
              report: {type: string, enum: [rankings, opportunities, audit, content], description: Search only; the report it opens on.}
              key: {type: string, description: Properties only.}
              event: {type: string, description: Properties only.}
              query: {type: string, description: Search only.}
              range: {type: string, default: '30d'}
              from: {type: string, format: date}
              to: {type: string, format: date}
              compare: {type: string, enum: [none, prev, typical, week, month_weekday, month, year_weekday, year], default: prev}
              metric: {type: string, default: visitors}
              filters: {type: array, maxItems: 20, items: {type: object}}
              tabs: {type: object}
              kind: {type: string, enum: [elements, dead, links, downloads, forms, pages]}
              page: {type: string, maxLength: 2048}
        locked_filters:
          type: array
          maxItems: 20
          items:
            oneOf:
              - {type: string}
              - type: object
                required: [dimension, values]
                properties:
                  dimension: {type: string}
                  op: {type: string, enum: [is, is_not, contains, matches]}
                  values: {type: array, maxItems: 100, items: {type: string, maxLength: 2048}}
        max_days: {type: integer, minimum: 0, maximum: 3650, description: 'Only the last N days, including comparison; 0 means any period.'}
        expires: {type: integer, minimum: 0, description: 'Future Unix timestamp, or 0 for no expiry.'}
        hide_realtime: {type: boolean}
        hide_sensitive: {type: boolean}
        branding:
          type: object
          properties:
            title: {type: string}
            logo: {type: integer, minimum: 0, description: Local raster Media Library attachment ID.}
            agency: {type: string}
            agency_logo: {type: integer, minimum: 0}
            website: {type: string, description: HTTP or HTTPS link, never fetched.}
            byline: {type: string}
            accent: {type: string, description: Hex colour; unreadable text accents fall back in each appearance.}
            mode: {type: string, enum: [light, dark, system]}
            credit: {type: boolean}
    Dimension:
      type: string
      enum: [channel, source, utm_source, utm_medium, utm_campaign, utm_term, utm_content, country, device, browser, os, language, login, entry, exit, page, not_found, search, no_results, author, category, post_type, event, variant]
      description: |
        channel: direct, organic_search, paid_search, ai, organic_social,
        paid_social, email, referral, paid_other, business_profile (visits
        from a business profile's tagged link or a maps app). source:
        referring host.
        device: desktop, mobile, tablet, unknown. login: logged_in,
        logged_out (visits recorded before logins were counted are
        logged_out). entry, exit:
        first and last page of a visit. page: any page viewed. not_found:
        a page that answered 404. search: the words of a site search (''
        when not recorded); no_results: searches that found nothing.
        author, category, post_type: what a viewed post, page or other
        single item is; values are user IDs, term IDs and post type names,
        and a filter also takes the name. Pageview dimensions count views
        (pageviews); not_found, search, no_results, author, category and
        post_type are read from the visits, not the daily summaries.
        event: event name. variant: an A/B test variant seen, as
        `test-id:variant-slug` (label "Test name: Variant B"); a filter
        selects visits that saw it (also those that saw other variants of
        the test), and `test-id:*` every variant of a test; contains and
        matches look in values and labels. Its rows count visits and add
        pageviews (page loads that showed it) and clicks (inside it). Not
        in shared reports.

    Range:
      type: object
      required: [key, from, to, timezone]
      properties:
        key:
          type: string
          description: The range, or for a comparison range the comparison (prev, typical, week, month_weekday, month, year_weekday or year).
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        timezone:
          type: string
          examples: [Europe/London]

    Metrics:
      type: object
      required: [visitors, visits, pageviews, views_per_visit, bounce_rate, visit_duration, events]
      properties:
        visitors:
          type: number
          description: Distinct visitors per day, summed over the days (no identity crosses days). Typical comparison counts are averages and may be fractional.
        visits:
          type: number
        pageviews:
          type: number
        views_per_visit:
          type: number
        bounce_rate:
          type: number
          description: Visits with one pageview and no event, as a fraction of visits.
        visit_duration:
          type: integer
          description: Average visible time per visit, in seconds.
        events:
          type: number

    Change:
      type: object
      description: (now − then) ÷ then for each metric; null when then is 0.
      additionalProperties:
        type: [number, 'null']

    Answer:
      type: object
      properties:
        generated:
          type: string
          format: date-time
        cached:
          type: boolean

    StatsAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [range, metrics]
          properties:
            range:
              $ref: '#/components/schemas/Range'
            metrics:
              $ref: '#/components/schemas/Metrics'
            compare:
              type: object
              required: [range, metrics, change]
              properties:
                range:
                  $ref: '#/components/schemas/Range'
                periods:
                  description: Typical only; the four disjoint reads, newest first. range is their envelope, not one continuous read.
                  type: array
                  minItems: 4
                  maxItems: 4
                  items:
                    $ref: '#/components/schemas/Range'
                metrics:
                  $ref: '#/components/schemas/Metrics'
                change:
                  $ref: '#/components/schemas/Change'

    Point:
      allOf:
        - type: object
          required: [t]
          properties:
            t:
              type: string
              format: date-time
              description: Start of the hour, day or month.
        - $ref: '#/components/schemas/Metrics'

    TimeseriesAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [range, grain, points]
          properties:
            range:
              $ref: '#/components/schemas/Range'
            grain:
              type: string
              enum: [hour, day, month]
            points:
              type: array
              items:
                $ref: '#/components/schemas/Point'
            compare:
              type: object
              required: [range, points]
              properties:
                range:
                  $ref: '#/components/schemas/Range'
                periods:
                  description: Typical only; the four disjoint reads, newest first.
                  type: array
                  minItems: 4
                  maxItems: 4
                  items:
                    $ref: '#/components/schemas/Range'
                low:
                  description: Typical only; per-metric minima across the four periods, aligned with points by index. Timestamps use the newest period.
                  type: array
                  items:
                    $ref: '#/components/schemas/Point'
                high:
                  description: Typical only; per-metric maxima across the four periods, aligned with points by index. Timestamps use the newest period.
                  type: array
                  items:
                    $ref: '#/components/schemas/Point'
                points:
                  type: array
                  items:
                    $ref: '#/components/schemas/Point'

    BreakdownRow:
      type: object
      required: [value, label, visitors, visits, share]
      properties:
        value:
          type: string
          description: What a filter on this dimension takes ('' for none).
        label:
          type: string
        visitors:
          type: integer
        visits:
          type: integer
        share:
          type: number
          description: This row's visits as a fraction of all visits in the range.
        pageviews:
          type: integer
        views_per_visit:
          type: number
        bounce_rate:
          type: number
        visit_duration:
          type: integer
        events:
          type: integer
        time_on_page:
          type: integer
          description: page only. Average visible seconds per view.
        scroll:
          type: integer
          description: page only. Average deepest scroll, percent.
        conversion_rate:
          type: number
          description: event only. Visits with the event as a fraction of all visits.
        clicks:
          type: integer
          description: variant only. Clicks inside the variant.
        ab_test:
          type: boolean
          description: page only, and only when true. The page has a running A/B test.

    BreakdownAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [range, dimension, total, rows]
          properties:
            range:
              $ref: '#/components/schemas/Range'
            dimension:
              $ref: '#/components/schemas/Dimension'
            total:
              $ref: '#/components/schemas/Metrics'
            rows:
              type: array
              items:
                $ref: '#/components/schemas/BreakdownRow'

    Count:
      type: object
      required: [value, label, count]
      properties:
        value:
          type: string
        label:
          type: string
        count:
          type: integer

    RealtimeAnswer:
      type: object
      required: [visitors, pageviews, per_minute, pages, sources, processed, generated]
      properties:
        visitors:
          type: integer
          description: Distinct visitors with a hit in the last 30 minutes.
        pageviews:
          type: integer
        per_minute:
          type: array
          description: Pageviews per minute, oldest first (30 values).
          items:
            type: integer
        pages:
          type: array
          items:
            $ref: '#/components/schemas/Count'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Count'
        processed:
          type: [string, 'null']
          format: date-time
          description: When hits were last processed.
        generated:
          type: string
          format: date-time

    Marker:
      description: One change to the site (an entry of the change log).
      type: object
      required: [id, t, kind, group, label, title, path, old, new, object, meta, source, user]
      properties:
        id:
          type: integer
        t:
          type: string
          format: date-time
          description: When it changed, in the site time zone.
        kind:
          type: string
          description: What changed (the kinds parameter lists them).
        group:
          type: string
          enum: [content, seo, product, site, search, note]
        label:
          type: string
          description: One line saying what changed, in the site's language.
        title:
          type: string
          description: The post, product, coupon, plugin, theme or setting, by name when it changed.
        path:
          type: [string, 'null']
          description: The page it affects; null for site-wide changes.
        old:
          type: string
          description: Value before (a path, title, word count, price, version or setting); empty when there was none. For search_update, its type (core, spam, link_spam, helpful_content, reviews, product_reviews, site_reputation, discover, ranking, crawling, indexing, serving or announcement).
        new:
          type: string
          description: Value after. For search_update, its id at the source.
        object:
          type: object
          required: [type, id]
          properties:
            type:
              type: string
              description: The post type, or coupon, plugin, theme, core, option; for search_update the engine (google, or a key from the feed's name).
            id:
              type: integer
        meta:
          type: object
          description: |
            Details by kind: name; content: before, after, added, removed
            (words); links: added, removed, changed (each to and text);
            external_links: gained, lost (hosts); prices: currency, field
            (regular, sale or price); plugins: file; coupons: fields
            changed (old and new); search_update: name, engine (to show),
            url (at the source), ended (ISO 8601; empty while rolling out;
            only for updates that roll out over a span), feed (other feeds).
          additionalProperties: true
        source:
          type: string
          enum: [wordpress, cli, api, cron, feed, note]
          description: Where the change was made.
        user:
          type: [string, 'null']
          description: Who made it (display name), for people who may list users; else null.

    MarkersAnswer:
      type: object
      required: [range, markers, total]
      properties:
        range:
          $ref: '#/components/schemas/Range'
        markers:
          type: array
          items:
            $ref: '#/components/schemas/Marker'
        total:
          type: integer
          description: Changes in the range that match.

    ChangesAnswer:
      type: object
      required: [range, changes, total, limit, offset]
      properties:
        range:
          $ref: '#/components/schemas/Range'
        changes:
          type: array
          items:
            $ref: '#/components/schemas/Marker'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    ChangeSetPair:
      type: array
      minItems: 2
      maxItems: 2
      items: {type: string}
      description: Current stored value, then proposed value. No truncation or template expansion.

    ChangeSetPlan:
      type: object
      required: [name, pages]
      properties:
        name: {type: string, minLength: 1, maxLength: 190}
        pages:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [post]
            description: At least one field pair is required. Unique post ids only, for viewable post types.
            properties:
              post: {type: integer, minimum: 1}
              title: {$ref: '#/components/schemas/ChangeSetPair'}
              seo_title: {$ref: '#/components/schemas/ChangeSetPair'}
              seo_description: {$ref: '#/components/schemas/ChangeSetPair'}

    ChangeSetItem:
      type: object
      properties:
        post: {type: integer}
        field: {type: string, enum: [title, seo_title, seo_description]}
        meta_key: {type: string, description: Empty for the post title.}
        old: {type: string}
        new: {type: string}
        old_exists: {type: boolean, description: Whether metadata existed before apply.}
        url: {type: string, description: Permalink before apply.}
        result: {type: string, enum: [pending, skipped, conflict, writing, applied, failed, undone, undo conflict, undo failed]}
        reason: {type: string}

    ChangeSetPreview:
      type: object
      required: [name, pages]
      properties:
        name: {type: string}
        pages:
          type: array
          items:
            type: object
            properties:
              post: {type: integer}
              url: {type: string}
              reason: {type: string, description: Nonempty means skip the entire page.}
              items:
                type: array
                items: {$ref: '#/components/schemas/ChangeSetItem'}

    ChangeSet:
      type: object
      required: [id, created, user_id, name, status, experiment_id, items, undone]
      properties:
        id: {type: integer}
        created: {type: integer, description: Apply time (Unix seconds).}
        user_id: {type: integer}
        name: {type: string}
        status: {type: string, enum: [applied, partly applied, undone, partly undone]}
        experiment_id: {type: integer, description: Zero without an experiment; retained after experiment deletion.}
        items:
          type: array
          items: {$ref: '#/components/schemas/ChangeSetItem'}
        undone: {type: integer, description: Last undo attempt (Unix seconds), zero before undo.}
        experiment_error: {type: string, description: Apply response only, if experiment creation/linking failed.}

    ExperimentInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 190
          description: The change and what it should do, in one line.
          examples: [A shorter title lifts CTR]
        change:
          type: integer
          minimum: 0
          description: The change it measures (its id in /changes).
        start:
          type: string
          description: Without change, when the change was made, in the site time zone (2026-10-05 or 2026-10-05 14:30) or Unix time; empty for now.
        page:
          type: string
          description: Its page (a path), or several, comma-separated (up to 50). A site-wide change has no unchanged pages to compare with, so an experiment needs pages.
          examples: [/pricing/]
        days:
          type: integer
          enum: [7, 14, 28, 56, 84]
          default: 28
          description: Days in each window; whole weeks, so both hold each weekday equally often.
        engine:
          $ref: '#/components/schemas/SearchEngine'
        metric:
          type: string
          enum: [clicks, impressions, ctr, position, visits, conversions]
          default: clicks
          description: What it should change. visits are visits from search that landed on its pages; conversions are those visits' conversions of goal.
        direction:
          type: string
          enum: [up, down]
          default: up
          description: For position, up means a better (lower) place.
        threshold:
          type: number
          minimum: 0
          description: The smallest change that counts; percent (default 10), or places for position (default 1).
        goal:
          type: string
          description: For conversions, the goal's id.
        hypothesis:
          type: string
          maxLength: 2000
        note:
          type: string
          maxLength: 2000

    DayWindow:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
          description: Included.

    ExperimentFigures:
      description: Some pages' figures in a window. Search measures give clicks, impressions, ctr and position; visits give visits; conversions give visits, conversions and rate.
      type: object
      properties:
        clicks: {type: integer}
        impressions: {type: integer}
        ctr: {type: [number, 'null']}
        position: {type: [number, 'null']}
        visits: {type: integer}
        conversions: {type: integer}
        rate: {type: [number, 'null']}

    ExperimentMeasurement:
      description: |
        state running: the data does not reach the review day yet (so_far
        days of data after the change). state ready: the experiment's
        pages before and after against the comparison group (pages with
        data in both windows, not in the experiment and with no change of
        their own in the span; the 200 with most impressions, or visits,
        before), the effect, the group's usual spread, the confounders
        and the suggested result.
      type: object
      required: [state, through, review, days, windows]
      properties:
        state:
          type: string
          enum: [running, ready]
        through:
          type: [string, 'null']
          format: date
          description: The newest day with data for the measure.
        review:
          type: string
          format: date
        days:
          type: integer
        so_far:
          type: integer
          description: Running only.
        windows:
          type: object
          properties:
            before: {$ref: '#/components/schemas/DayWindow'}
            after: {$ref: '#/components/schemas/DayWindow'}
        coverage:
          type: [object, 'null']
          description: Days with search data in each window (search measures).
          properties:
            before: {type: integer}
            after: {type: integer}
            days: {type: integer}
        pages:
          type: object
          properties:
            count: {type: integer}
            before: {$ref: '#/components/schemas/ExperimentFigures'}
            after: {$ref: '#/components/schemas/ExperimentFigures'}
        group:
          type: object
          properties:
            count: {type: integer}
            before: {$ref: '#/components/schemas/ExperimentFigures'}
            after: {$ref: '#/components/schemas/ExperimentFigures'}
            change: {type: [number, 'null']}
        compared:
          type: boolean
          description: Whether there were at least 5 pages to compare with; without them the effect is the raw change, only associated with the change made.
        value:
          type: object
          properties:
            before: {type: [number, 'null']}
            after: {type: [number, 'null']}
        change:
          type: [number, 'null']
          description: The raw change; a ratio (0.12 is +12%), or places for position.
        effect:
          type: [number, 'null']
          description: For counts and CTR, the pages' ratio (after ÷ before) over the group's, less 1; for position, the pages' change in places less the group's.
        improvement:
          type: [number, 'null']
          description: The effect in the expected direction; positive when it went the way expected.
        unit:
          type: string
          enum: [ratio, places]
        noise:
          type: [object, 'null']
          description: The 10th to 90th percentile of the group's pages' own effects, each measured as if changed.
          properties:
            low: {type: number}
            high: {type: number}
            pages: {type: integer}
        beyond_noise:
          type: [boolean, 'null']
        enough:
          type: object
          description: Data on its pages in each window against what is needed (20 clicks; 200 impressions for impressions, CTR and position; 20 visits; 5 conversions).
          properties:
            ok: {type: boolean}
            unit: {type: string}
            needed: {type: integer}
            before: {type: integer}
            after: {type: integer}
        confounders:
          type: object
          description: Search engine updates rolling out in either window, site-wide changes in the windows, and other changes on its pages after the start (up to 20 each).
          properties:
            updates:
              type: array
              items: {$ref: '#/components/schemas/Marker'}
            site:
              type: array
              items: {$ref: '#/components/schemas/Marker'}
            pages:
              type: array
              items: {$ref: '#/components/schemas/Marker'}
            total: {type: integer}
        suggested:
          type: string
          enum: [keep, revise, undo, inconclusive]
          description: inconclusive with too little data, within the usual spread, or with no group while a search update rolled out; keep the expected way by at least the threshold; revise the expected way by less; undo the opposite way.
        reasons:
          type: array
          items:
            type: string
            enum: [no_group, search_update, too_little_data, no_measure, within_noise, at_threshold, under_threshold, opposite, no_change]
        summary:
          type: string
          description: One sentence saying what was found, in the site's language.

    Experiment:
      type: object
      required: [id, name, start, days, windows, review, engine, metric, direction, threshold, pages, status, result, due, measurement]
      properties:
        id: {type: integer}
        name: {type: string}
        hypothesis: {type: string}
        note: {type: string}
        created:
          type: string
          format: date-time
        user:
          type: [string, 'null']
          description: Who recorded it, for people who may list users.
        owner:
          $ref: '#/components/schemas/OwnerOrHidden'
        start:
          type: string
          format: date-time
        days: {type: integer}
        windows:
          type: object
          properties:
            before: {$ref: '#/components/schemas/DayWindow'}
            after: {$ref: '#/components/schemas/DayWindow'}
        review:
          type: string
          format: date
          description: The after window's last day.
        engine:
          $ref: '#/components/schemas/SearchEngine'
        metric:
          type: string
          enum: [clicks, impressions, ctr, position, visits, conversions]
        direction:
          type: string
          enum: [up, down]
        threshold:
          type: number
          description: Percent, or places for position.
        change_id:
          type: [integer, 'null']
        change_set:
          type: [integer, 'null']
          description: Linked reviewed change set, from meta.change_set; null for a manual experiment.
        restoration:
          $ref: '#/components/schemas/ChangeSet'
        pages:
          type: array
          items: {type: string}
        goal:
          type: [object, 'null']
          properties:
            id: {type: string}
            name: {type: [string, 'null']}
        status:
          type: string
          enum: [running, decided, cancelled]
        result:
          type: [string, 'null']
          enum: [keep, revise, undo, inconclusive, null]
        decided:
          type: [string, 'null']
          format: date-time
        due:
          type: boolean
          description: Running, with data through the review day.
        through:
          type: [string, 'null']
          format: date
        measurement:
          description: Running, now; decided, as it was at the decision; cancelled, null.
          oneOf:
            - $ref: '#/components/schemas/ExperimentMeasurement'
            - type: 'null'

    ExperimentsAnswer:
      type: object
      required: [experiments, total]
      properties:
        experiments:
          type: array
          items:
            $ref: '#/components/schemas/Experiment'
        total:
          type: integer

    AbThresholds:
      type: object
      description: The minimum sample before a comparison is called, and the probability that calls it.
      required: [visits, conversions, days, confidence]
      properties:
        visits: {type: integer, description: Visits each side of a comparison needs.}
        conversions: {type: integer, description: Conversions the two sides need together.}
        days: {type: integer, description: Days the test has run.}
        confidence: {type: number, description: Probability to beat the control that calls a variant better (1 − this calls it worse).}

    AbTestPost:
      type: object
      required: [id, title, path, edit_url]
      properties:
        id: {type: integer}
        title: {type: string}
        path: {type: [string, 'null'], description: Null while not published.}
        edit_url: {type: [string, 'null'], description: For people who may edit it.}

    AbPrimary:
      type: object
      description: What the variants are compared on.
      required: [kind, id, name]
      properties:
        kind: {type: string, enum: [goal, clicks], description: 'goal: the test''s first goal; clicks: visits that clicked inside the variant (a test with no goals).'}
        id: {type: string, description: The goal's id ('' for clicks).}
        name: {type: string}

    AbComparison:
      type: object
      description: A variant against the control. All null for the control.
      required: [uplift, interval, probability]
      properties:
        uplift: {type: [number, 'null'], description: Relative change in the rate (0.12 is +12%); null when the control's rate is 0.}
        interval:
          type: [array, 'null']
          description: The uplift's 95% interval (log of the rate ratio); null without a conversion on either side.
          items: {type: number}
          minItems: 2
          maxItems: 2
        probability: {type: [number, 'null'], description: 'Probability that the variant''s true rate beats the control''s (Bayesian, Beta(1, 1) priors).'}

    AbVerdict:
      type: object
      required: [code, text]
      properties:
        code: {type: string, enum: [no_data, too_early, winner, control, unclear]}
        text: {type: string, description: One sentence, in the site's language.}

    AbMixed:
      type: object
      description: Visits that saw two or more of the test's variants; counted apart, in no variant.
      required: [visits, share]
      properties:
        visits: {type: integer}
        share: {type: number, description: Of every visit that saw the test.}

    AbLeader:
      type: [object, 'null']
      description: The variant called better with the highest probability, else the control when every other is worse, else the highest rate; null with no data.
      required: [slug, label]
      properties:
        slug: {type: string}
        label: {type: string}

    AbTestRow:
      type: object
      required: [id, name, status, post, started, ended, removed, winner, primary, visits, mixed, variants, leader, verdict]
      properties:
        id: {type: string}
        name: {type: string}
        status: {type: string, enum: [draft, running, paused, ended]}
        post: {$ref: '#/components/schemas/AbTestPost'}
        started: {type: [string, 'null'], format: date-time, description: When it first ran.}
        ended: {type: [string, 'null'], format: date-time}
        removed: {type: [string, 'null'], format: date-time, description: When its block was taken out of the post.}
        winner: {type: string, description: The winner chosen in the editor (a variant slug), or ''.}
        primary: {$ref: '#/components/schemas/AbPrimary'}
        visits: {type: integer, description: Visits that saw the test (mixed included).}
        mixed: {$ref: '#/components/schemas/AbMixed'}
        variants:
          type: array
          items:
            type: object
            required: [slug, label, weight, control, visits, conversions, rate, probability, verdict]
            properties:
              slug: {type: string}
              label: {type: string}
              weight: {type: integer}
              control: {type: boolean}
              visits: {type: integer}
              conversions: {type: integer, description: On the primary metric.}
              rate: {type: number}
              probability: {type: [number, 'null']}
              verdict: {type: string, enum: [control, too_early, better, worse, unclear]}
        leader: {$ref: '#/components/schemas/AbLeader'}
        verdict: {$ref: '#/components/schemas/AbVerdict'}

    AbTestsAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [thresholds, tests]
          properties:
            thresholds: {$ref: '#/components/schemas/AbThresholds'}
            tests:
              type: array
              items:
                $ref: '#/components/schemas/AbTestRow'

    AbGoalResult:
      allOf:
        - $ref: '#/components/schemas/AbComparison'
        - type: object
          required: [id, name, conversions, completions, rate, revenue]
          properties:
            id: {type: string}
            name: {type: string}
            conversions: {type: integer, description: Visits that reached the goal at or after first seeing the test.}
            completions: {type: integer}
            rate: {type: number, description: conversions ÷ the variant's visits.}
            revenue:
              type: array
              description: Per currency, never added across currencies (event goals).
              items:
                $ref: '#/components/schemas/Revenue'

    AbVariantReport:
      type: object
      required: [slug, label, weight, control, winner, visits, share, visitors, pageviews, clicks, clicked, click_rate, bounce_rate, engaged_time, goals, primary]
      properties:
        slug: {type: string}
        label: {type: string}
        weight: {type: integer}
        control: {type: boolean}
        winner: {type: boolean, description: The winner chosen in the editor.}
        visits: {type: integer, description: Visits that saw this variant only.}
        share: {type: number, description: Of every visit that saw the test.}
        visitors: {type: integer}
        pageviews: {type: integer, description: Page loads that showed it.}
        clicks: {type: integer, description: Clicks inside it.}
        clicked: {type: integer, description: Visits that clicked inside it.}
        click_rate: {type: number}
        bounce_rate: {type: number}
        engaged_time: {type: integer, description: Seconds per visit with the site on screen.}
        goals:
          type: array
          items:
            $ref: '#/components/schemas/AbGoalResult'
        primary:
          allOf:
            - $ref: '#/components/schemas/AbComparison'
            - type: object
              required: [conversions, rate, verdict]
              properties:
                conversions: {type: integer}
                rate: {type: number}
                verdict: {type: string, enum: [control, too_early, better, worse, unclear]}

    AbTestAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [test, thresholds, period, primary, goals, visits, mixed, variants, leader, verdict]
          properties:
            test:
              type: object
              required: [id, name, status, post, variants, goals, winner, created, updated, started, ended, removed]
              properties:
                id: {type: string}
                name: {type: string}
                status: {type: string, enum: [draft, running, paused, ended]}
                post: {$ref: '#/components/schemas/AbTestPost'}
                variants:
                  type: array
                  items:
                    type: object
                    required: [slug, label, weight]
                    properties:
                      slug: {type: string}
                      label: {type: string}
                      weight: {type: integer}
                goals:
                  type: array
                  description: Goal ids in order; the first is the primary metric.
                  items: {type: string}
                winner: {type: string}
                created: {type: [string, 'null'], format: date-time}
                updated: {type: integer, description: Unix time of the last save.}
                started: {type: [string, 'null'], format: date-time}
                ended: {type: [string, 'null'], format: date-time}
                removed: {type: [string, 'null'], format: date-time}
            thresholds: {$ref: '#/components/schemas/AbThresholds'}
            period:
              type: object
              description: The span measured.
              required: [from, to, days]
              properties:
                from: {type: string, format: date-time}
                to: {type: string, format: date-time}
                days: {type: integer, description: Whole days run (0 before it first ran).}
            primary: {$ref: '#/components/schemas/AbPrimary'}
            goals:
              type: array
              description: The test's goals that still exist, in its order.
              items:
                type: object
                required: [id, name, kind, match]
                properties:
                  id: {type: string}
                  name: {type: string}
                  kind: {type: string, enum: [page, event]}
                  match: {type: string}
            visits: {type: integer}
            mixed: {$ref: '#/components/schemas/AbMixed'}
            variants:
              type: array
              items:
                $ref: '#/components/schemas/AbVariantReport'
            leader: {$ref: '#/components/schemas/AbLeader'}
            verdict: {$ref: '#/components/schemas/AbVerdict'}

    QueueItem:
      allOf:
        - $ref: '#/components/schemas/OpportunityPage'
        - type: object
          required: [key, kind, engine, status, found, query, why, todo, figures, metric, parts, score, note, updated, user, effort_set, experiment_id, experiment]
          properties:
            key:
              type: string
              description: 16 hex characters, from kind, engine, page and query.
            kind:
              type: string
              enum: [ctr, missing, striking, decay, overlap, audit, links, index, refresh, target, sitemap, backlinks]
            engine:
              $ref: '#/components/schemas/SearchEngine'
            status:
              type: string
              enum: [new, accepted, done, dismissed]
            owner:
              $ref: '#/components/schemas/OwnerOrHidden'
            verified:
              type: string
              enum: [confirmed, reopened]
              description: Absent until verified by a crawl. Confirmed maps to status done, reopened to new. Both appear under the done filter; reopened is also open.
            verified_at:
              type: string
              format: date-time
              description: Crawl import date of the verdict; absent until verified.
            finding:
              description: audit, the finding (one item per page and finding); links and index, the list (one item per page and list); refresh, the proposal (one item per page); target, wrong_page or striking (one item per target and finding); sitemap, the problem (one item per sitemap and problem; missing when the site's own sitemap index is not submitted); backlinks, needs (one item per page). Null for other kinds.
              anyOf:
                - $ref: '#/components/schemas/AuditFinding'
                - type: string
                  enum: [page_experience, clicked_broken]
                - $ref: '#/components/schemas/LinksKind'
                - $ref: '#/components/schemas/IndexationKind'
                - $ref: '#/components/schemas/RefreshProposal'
                - type: string
                  enum: [wrong_page, striking]
                - type: string
                  enum: [missing, errors, stale, warnings]
                - type: string
                  const: needs
                - type: 'null'
            found:
              type: boolean
              description: Whether the opportunity is still found in this period; else as it was when acted on.
            query:
              type: [string, 'null']
              description: The query; null for decay and refresh (a page).
            why:
              type: string
              description: Why it is listed, in the site's language.
            todo:
              type: string
              description: What to do, in the site's language.
            figures:
              type: object
              description: The numbers behind it; which are there depends on the kind.
              properties:
                clicks:
                  type: integer
                impressions:
                  type: integer
                ctr:
                  type: number
                position:
                  type: [number, 'null']
                expected_ctr:
                  type: number
                potential:
                  type: integer
                then_clicks:
                  type: integer
                then_position:
                  type: number
                lost:
                  type: integer
                cause:
                  type: string
                  enum: [position, demand, ctr, gone]
                match:
                  type: string
                  enum: [partial, none]
                missing:
                  type: array
                  items:
                    type: string
                question:
                  type: boolean
                switched:
                  type: boolean
                  description: overlap; whether the leading page changed between the halves of the period.
                pages:
                  type: array
                  description: overlap; the pages sharing the query, most impressions first. refresh, merge; this page, then the one that overtook it (with its share of the query). target, wrong_page; the page meant for it, then the page search shows most. Done measures them all.
                  items:
                    type: object
                    required: [path_id, path, clicks, impressions, position, share]
                    properties:
                      path_id:
                        type: integer
                      path:
                        type: string
                      clicks:
                        type: integer
                      impressions:
                        type: integer
                      position:
                        type: [number, 'null']
                      share:
                        type: [number, 'null']
                proposal:
                  $ref: '#/components/schemas/RefreshProposal'
                then_impressions:
                  type: integer
                  description: refresh; impressions in the earlier period.
                modified:
                  type: [string, 'null']
                  format: date-time
                  description: refresh; when the content last changed.
                old:
                  type: boolean
                  description: refresh; the content changed over rules.refresh.old_days days ago.
                changed:
                  type: boolean
                  description: refresh; the content changed within the periods compared.
                lost_queries:
                  type: array
                  description: refresh; the queries that lost most clicks, each with the page that overtook it there, if one did.
                  items:
                    type: object
                    properties:
                      query:
                        type: string
                      lost:
                        type: integer
                      position:
                        type: [number, 'null']
                      then_position:
                        type: [number, 'null']
                      rival:
                        type: [object, 'null']
                        properties:
                          path:
                            type: string
                          clicks:
                            type: integer
                          position:
                            type: number
                          then_position:
                            type: [number, 'null']
                          share:
                            type: number
                rival:
                  description: refresh, merge; the page that overtook this one, with the query and this page's positions now and before.
                  allOf:
                    - $ref: '#/components/schemas/DecayRival'
                    - type: object
                      properties:
                        query:
                          type: string
                        position_here:
                          type: [number, 'null']
                        then_position_here:
                          type: [number, 'null']
                finding:
                  anyOf:
                    - $ref: '#/components/schemas/AuditFinding'
                    - {type: string, enum: [page_experience, clicked_broken]}
                samples:
                  type: array
                  description: Page-experience field evidence; the item's score uses 10% of observed clicks scaled to 28 days, not the expected-CTR audit formula.
                  items: {$ref: '#/components/schemas/VitalSample'}
                target:
                  type: string
                  description: audit, clicked_broken; an outbound or affiliate destination clicked in the period whose imported crawl answer failed (/crawl kind clicked). Its score uses those clicks scaled to 28 days, weighed by what the page converts; lost referrals, not search clicks. Done opens no experiment.
                status:
                  type: integer
                  description: audit, clicked_broken; the HTTP status the crawl got (0 for no answer).
                outbound:
                  type: boolean
                affiliate:
                  type: boolean
                clicked_on:
                  type: array
                  description: audit, clicked_broken; the pages it was clicked on, most clicks first.
                  items: {type: string}
                linked_on:
                  type: array
                  description: audit, clicked_broken; pages the crawl saw link to it.
                  items: {type: string}
                share:
                  type: number
                  description: audit and links, the share of the page's expected clicks the finding or list puts at stake; index, the share of a shown page's clicks (typical) the page could earn; sitemap, the share of a shown page's clicks the problem puts at stake; backlinks, the share of the page's need earning links puts at stake.
                sitemap:
                  type: object
                  description: sitemap; the sitemap as Search Console read it (the site's own sitemap index for missing). The item's path and url are the sitemap's; Done opens no experiment.
                  properties:
                    url:
                      type: string
                    errors:
                      type: integer
                    warnings:
                      type: integer
                    downloaded:
                      type: [string, 'null']
                      format: date-time
                    submitted:
                      type: [string, 'null']
                      format: date-time
                facts:
                  $ref: '#/components/schemas/AuditFacts'
                same:
                  type: array
                  description: audit; the other pages with the same title or description.
                  items:
                    type: string
                list:
                  description: links and index; the list.
                  oneOf:
                    - $ref: '#/components/schemas/LinksKind'
                    - $ref: '#/components/schemas/IndexationKind'
                links_in:
                  type: integer
                  description: links, orphans and converting, and index, pages; other pages linking to the page.
                from:
                  type: array
                  description: links, orphans and converting; pages linking to it (up to five).
                  items:
                    type: string
                visits:
                  type: [integer, 'null']
                  description: links and refresh; visits from search (refresh, null without goal data).
                conversions:
                  type: [integer, 'null']
                link_from:
                  type: object
                  description: links, missing; the page that should link to this one.
                  properties:
                    path_id:
                      type: integer
                    path:
                      type: string
                    url:
                      type: string
                from_impressions:
                  type: integer
                  description: links, missing; the impressions of the searches on the page that should link.
                from_position:
                  type: number
                queries:
                  type: array
                  description: links, missing; the searches, as LinksMissingRow's.
                  items:
                    type: object
                query_count:
                  type: integer
                need:
                  type: integer
                  description: backlinks; the page's need (BacklinkNeedRow's, potential × gap).
                domains:
                  type: integer
                  description: backlinks; sites linking to the page now (ignore and spam left out).
                followed:
                  type: integer
                  description: backlinks; of them, sites with a followed link.
                useful:
                  type: integer
                  description: backlinks; useful referring domains (BacklinkNeedRow's).
                top_median:
                  type: number
                  description: backlinks; the median useful referring domains of the site's pages in the top three.
                gap:
                  type: number
                  description: backlinks; top_median − useful.
                links:
                  type: integer
                  description: backlinks; links to the page now.
                link_value:
                  type: integer
                  description: backlinks; the sum of each linking site's best link value.
                searches:
                  type: array
                  description: backlinks; the page's best searches in striking distance, as BacklinkNeedRow's queries.
                  items:
                    type: object
                state:
                  type: string
                  enum: [never, lost]
                  description: index; as IndexationRow's.
                last_impression:
                  type: [string, 'null']
                  description: index.
                age:
                  type: [integer, 'null']
                  description: index; days since published or first listed. refresh; days since the content changed (null, not known).
                typical:
                  type: number
                  description: index; a shown page's clicks per 28 days.
                published:
                  type: [string, 'null']
                  description: index, pages; refresh.
                words:
                  type: integer
                  description: index, pages; refresh.
                first_seen:
                  type: string
                  description: index, sitemap.
                source:
                  type: string
                  description: index, sitemap; as IndexationRow's.
                priority:
                  type: integer
                  description: target; the target's priority (0–100).
                target_status:
                  $ref: '#/components/schemas/TargetStatus'
            metric:
              type: string
              enum: [clicks, impressions, ctr, position]
              description: The measure of the experiment done opens (impressions for an audit item's noindex or canonical).
            parts:
              type: object
              required: [clicks, value, confidence, effort]
              properties:
                clicks:
                  type: number
                  description: Potential clicks per 28 days.
                value:
                  type: number
                  description: 1 to rules.max_value.
                confidence:
                  type: number
                  description: 0 to the kind's own.
                effort:
                  type: integer
                  minimum: 1
                  maximum: 5
            score:
              type: number
              description: clicks × value × confidence ÷ effort.
            note:
              type: string
            updated:
              type: [string, 'null']
              format: date-time
            user:
              type: [string, 'null']
              description: Who acted, for people who may list users.
            effort_set:
              type: boolean
              description: Whether someone set the effort.
            experiment_id:
              type: [integer, 'null']
            experiment:
              type: [object, 'null']
              description: Done, the experiment it opened, with its state and result.
              properties:
                id:
                  type: integer
                name:
                  type: string
                status:
                  type: string
                  enum: [running, decided, cancelled]
                result:
                  type: [string, 'null']
                  enum: [keep, revise, undo, inconclusive, null]
                due:
                  type: boolean
                review:
                  type: string
                  format: date
                metric:
                  type: string
                state:
                  type: [string, 'null']
                  enum: [running, ready, null]
                effect:
                  type: [number, 'null']
                unit:
                  type: [string, 'null']
                  enum: [ratio, places, null]
                suggested:
                  type: [string, 'null']
                summary:
                  type: [string, 'null']

    QueueAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [engine, engines, range, days, cut, decay, through, connected, ignored, goal, goals, site_rate, rules, left_out, status, counts, items, total, more]
          properties:
            done_count:
              type: integer
              description: Done-view count, including reopened crawl items. Status counts remain disjoint for All.
            engine:
              $ref: '#/components/schemas/SearchEngine'
            engines:
              $ref: '#/components/schemas/SearchEngines'
            range:
              $ref: '#/components/schemas/Range'
            days:
              type: integer
            cut:
              type: boolean
              description: Whether the period was cut at the newest search day or to its newest 366 days.
            decay:
              type: [object, 'null']
              description: The periods losing clicks (and refresh) items were compared in, when shortened so the earlier one holds only days with search data; null when not.
              required: [range, days, compare]
              properties:
                range:
                  $ref: '#/components/schemas/Range'
                days:
                  type: integer
                compare:
                  $ref: '#/components/schemas/Range'
            through:
              type: string
              description: Newest day with search data (YYYY-MM-DD); empty with none.
            connected:
              type: boolean
            ignored:
              type: array
              items:
                type: string
            goal:
              type: [object, 'null']
              description: The goal giving value; null without goals.
              properties:
                id:
                  type: string
                name:
                  type: string
            goals:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
            site_rate:
              type: [number, 'null']
              description: The site's conversion rate of visits from search for the goal.
            rules:
              type: object
              description: The constants the score uses, the refresh planner's thresholds in refresh (old_days, protect_value, protect_conversions), and search targets' in target (share, priority, high_priority, statuses).
            left_out:
              type: integer
              description: New items left out because their page has a running experiment.
            status:
              type: string
              enum: [open, new, accepted, done, dismissed, all]
            kind:
              type: [string, 'null']
              description: The kind asked for; null for every kind.
            counts:
              type: object
              description: Items in each state (dismissed ones only while hidden).
              properties:
                new:
                  type: integer
                accepted:
                  type: integer
                done:
                  type: integer
                dismissed:
                  type: integer
            items:
              type: array
              items:
                $ref: '#/components/schemas/QueueItem'
            total:
              type: integer
            more:
              type: boolean

    LoopExportRow:
      type: object
      description: One search and page in the aidevops export layout.
      required: [query, page, clicks, impressions, ctr, position]
      properties:
        query:
          type: string
        page:
          type: string
          description: The page's path.
        clicks:
          type: integer
        impressions:
          type: integer
        ctr:
          type: number
          minimum: 0
          maximum: 1
          description: Clicks ÷ impressions (0.031 is 3.1%), at most 1 (Bing sometimes counts more clicks than impressions for a rare query; clicks and impressions are as imported).
        position:
          type: number
          description: Average position, weighted by impressions.

    LoopExport:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [domain, source, exported, start_date, end_date, columns, ignored, rows, more]
          description: |
            The period's search figures per query and page, most
            impressions first, as an aidevops export file holds them
            (`wp seoproanalytics loop --format=toon` writes that file).
          properties:
            domain:
              type: string
            source:
              type: string
              enum: [gsc, bing]
            exported:
              type: string
              format: date-time
              description: When the rows were read (they are cached until new data arrives).
            start_date:
              type: [string, 'null']
              description: First day read (YYYY-MM-DD); null without search data.
            end_date:
              type: [string, 'null']
              description: Last day read (YYYY-MM-DD); null without search data.
            columns:
              type: array
              items:
                type: string
              example: [query, page, clicks, impressions, ctr, position]
            ignored:
              type: array
              items:
                type: string
            rows:
              type: array
              items:
                $ref: '#/components/schemas/LoopExportRow'
            more:
              type: boolean
              description: More rows than `rows` asked for.

    LoopAnswer:
      type: object
      required: [loop, site, engine, engines, range, days, cut, through, connected, ignored, goal, goals, params, summary, queue, experiments, export]
      properties:
        loop:
          type: integer
          description: Version of this layout; raised when a field changes meaning or goes.
        site:
          type: string
          format: uri
        engine:
          $ref: '#/components/schemas/SearchEngine'
        engines:
          $ref: '#/components/schemas/SearchEngines'
        range:
          $ref: '#/components/schemas/Range'
        days:
          type: integer
        cut:
          type: boolean
          description: Whether the period was cut at the newest search day or to its newest 366 days.
        through:
          type: string
          description: Newest day with search data (YYYY-MM-DD); empty with none.
        connected:
          type: boolean
        ignored:
          type: array
          items:
            type: string
        goal:
          type: [object, 'null']
          properties:
            id:
              type: string
            name:
              type: string
        goals:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
        params:
          type: object
          description: The period (range, and from and to for a custom one), engine, goal, page filters and data set used; give the same to `POST /queue/{key}`.
          properties:
            range:
              type: string
            from:
              type: string
            to:
              type: string
            engine:
              $ref: '#/components/schemas/SearchEngine'
            goal:
              type: string
            filters:
              type: array
              items:
                type: object
            data:
              type: string
              enum: [live, demo]
        summary:
          type: object
          description: Counts for a quick look.
          properties:
            new:
              type: integer
            accepted:
              type: integer
            done:
              type: integer
            dismissed:
              type: integer
            left_out:
              type: integer
              description: New queue items left out because their page has a running experiment.
            due:
              type: integer
            running:
              type: integer
            decided:
              type: integer
              description: Experiments decided in the last `experiments.recent_days` days.
            rows:
              type: integer
              description: Export rows.
        queue:
          type: object
          description: The open items (new and accepted), best first, as `/queue` gives them.
          properties:
            total:
              type: integer
            more:
              type: boolean
            rules:
              type: object
            items:
              type: array
              items:
                $ref: '#/components/schemas/QueueItem'
        experiments:
          type: object
          properties:
            due:
              type: array
              description: Running, with search data through the review day; decide them.
              items:
                $ref: '#/components/schemas/Experiment'
            running:
              type: array
              items:
                $ref: '#/components/schemas/Experiment'
            decided:
              type: array
              description: Decided in the last `recent_days` days, with the measurement each was decided on.
              items:
                $ref: '#/components/schemas/Experiment'
            recent_days:
              type: integer
        export:
          $ref: '#/components/schemas/LoopExport'

    Owner:
      type: object
      description: |
        Who is responsible for the SEO of a page, search target, Plan item
        or experiment. source assigned: set by a person or agent (id null:
        nobody, on purpose); default: worked out, not set, by each place's
        setting in Settings → Data → Owners (by default a page's post
        author; a target's or Plan item's page's owner; an experiment's
        page's owner, else whoever recorded it; or one person chosen for
        the place); none: no owner. Only people with a role that can own
        count (chosen in the same card from roles that can edit posts, by
        default administrator, editor, shop_manager and author; then filter
        seoproanalytics_owner_roles); someone set who no longer can falls back
        to the default.
      required: [id, name, source]
      properties:
        id:
          type: [integer, 'null']
        name:
          type: [string, 'null']
          description: Display name.
        source:
          type: string
          enum: [assigned, default, none]

    OwnerOrHidden:
      description: The owner; null for people who cannot edit posts, and always in shared reports.
      oneOf:
        - $ref: '#/components/schemas/Owner'
        - type: 'null'

    OwnerCounts:
      type: object
      required: [items, clicks, targets, running, due]
      properties:
        pages:
          type: integer
          description: Pages owned (not given for nobody).
        items:
          type: integer
          description: Open Plan items (new and accepted).
        clicks:
          type: number
          description: Those items' potential clicks per 28 days.
        targets:
          type: integer
          description: Open search targets (candidate, targeted, live).
        running:
          type: integer
          description: Running experiments (the newest 500).
        due:
          type: integer
          description: Of those, due for review.

    OwnersAnswer:
      type: object
      required: [roles, people, nobody, plan, can_assign, can_take, me]
      properties:
        roles:
          type: array
          items: {type: string}
        people:
          type: array
          description: Everyone who can own, by name.
          items:
            allOf:
              - $ref: '#/components/schemas/OwnerCounts'
              - type: object
                required: [id, name, me, pages]
                properties:
                  id: {type: integer}
                  name: {type: string}
                  me: {type: boolean}
        nobody:
          $ref: '#/components/schemas/OwnerCounts'
        plan:
          type: object
          description: The Plan's engine, range and newest search day.
        can_assign:
          type: boolean
          description: Whether you give work to anyone (administrators).
        can_take:
          type: boolean
          description: Whether you can own (take work and give it back).
        me:
          type: integer

    OwnersInput:
      type: object
      required: [kind, ids, user]
      properties:
        kind:
          type: string
          enum: [page, target, item, experiment]
        ids:
          type: array
          minItems: 1
          maxItems: 200
          description: Pages (paths such as /pricing/ or addresses on this site), target searches, Plan item keys or experiment ids.
          items: {type: string}
        user:
          type: string
          description: A user id, me, none (nobody, on purpose) or default (forget the owner set).
          examples: ['12', me, none, default]

    OwnersSetAnswer:
      type: object
      required: [kind, owner, default, set, skipped]
      properties:
        kind:
          type: string
        owner:
          $ref: '#/components/schemas/OwnerOrHidden'
        default:
          type: boolean
          description: Whether the owners set were forgotten.
        set:
          type: array
          items: {type: string}
        skipped:
          type: array
          items:
            type: object
            required: [id, reason]
            properties:
              id: {type: string}
              reason: {type: string}

    TargetStatus:
      type: string
      enum: [candidate, targeted, live, won, retired]

    TargetFilter:
      type: string
      enum: [all, open, candidate, targeted, live, won, retired]
      default: all

    TargetPage:
      description: A page of a target with its figures for the target's query.
      allOf:
        - $ref: '#/components/schemas/OpportunityPage'
        - type: object
          required: [clicks, impressions, position, share]
          properties:
            clicks:
              type: integer
            impressions:
              type: integer
            position:
              type: [number, 'null']
            share:
              type: [number, 'null']
              description: Its share of the query's impressions; null when search did not show it.

    TargetRow:
      type: object
      required: [query, allintitle, volume, measured, kgr, kgr_band, priority, status, source, state, band, clicks, impressions, ctr, position, then_position, then_clicks, page, shown, pages, updated]
      properties:
        query:
          type: string
        owner:
          $ref: '#/components/schemas/OwnerOrHidden'
        allintitle:
          type: [integer, 'null']
          minimum: 0
        volume:
          type: [integer, 'null']
          minimum: 0
        measured:
          type: object
          required: [allintitle, volume]
          properties:
            allintitle:
              type: [string, 'null']
              format: date
            volume:
              type: [string, 'null']
              format: date
        kgr:
          type: [number, 'null']
          description: Google allintitle count divided by positive monthly volume up to 250. A heuristic, not a ranking promise.
        kgr_band:
          type: string
          enum: [good, possible, crowded, volume_too_high, unknown]
        priority:
          type: integer
          minimum: 0
          maximum: 100
        status:
          $ref: '#/components/schemas/TargetStatus'
        source:
          type: string
          enum: [list, aidevops, demo, seo-plugin, search]
          description: Where it came from — a pasted list, the aidevops table, the demo, the SEO plugin's focus keywords, or a search report's row (Add as target).
        state:
          type: string
          enum: [ranking, wrong_page, no_page, not_shown]
        band:
          type: [string, 'null']
          enum: [top, striking, beyond, null]
        clicks:
          type: integer
        impressions:
          type: integer
        ctr:
          type: number
        position:
          type: [number, 'null']
        then_position:
          type: [number, 'null']
          description: With a comparison period, the query's position then.
        then_clicks:
          type: [integer, 'null']
          description: With a comparison period, the query's clicks then.
        page:
          description: The page meant for it; null when none is chosen yet.
          oneOf:
            - $ref: '#/components/schemas/TargetPage'
            - type: 'null'
        shown:
          description: The page search shows most for it; null when not shown or search gave no page.
          oneOf:
            - $ref: '#/components/schemas/TargetPage'
            - type: 'null'
        pages:
          type: integer
          description: Pages search showed for it.
        updated:
          type: string
          format: date-time
        tracked:
          description: |
            Google only: its newest tracked positions (a paid provider's
            weekly check, within the last 21 days); null when not tracked.
          oneOf:
            - $ref: '#/components/schemas/TrackedPosition'
            - type: 'null'
        tracked_engines:
          description: |
            Any engine: the newest tracked places in the other engines (a
            paid provider's weekly check, within the last 21 days), by
            engine: brave and deepseek (their web results), brave_ai (the
            site's place among the pages Brave gives an AI to answer the
            target from, its LLM Context; null when not among them),
            linkup_ai (the site's place among the sources of Linkup's
            sourced answer to the target; null when not among them). These
            engines have no devices: desktop holds the place and mobile is
            null. Null when none is tracked.
          oneOf:
            - type: object
              properties:
                brave:
                  $ref: '#/components/schemas/TrackedPosition'
                deepseek:
                  $ref: '#/components/schemas/TrackedPosition'
                brave_ai:
                  $ref: '#/components/schemas/TrackedPosition'
                linkup_ai:
                  $ref: '#/components/schemas/TrackedPosition'
            - type: 'null'

    TrackedPosition:
      type: object
      required: [day, desktop, mobile, page, features]
      properties:
        day:
          type: string
          format: date
          description: The newest day checked.
        desktop:
          type: [integer, 'null']
          minimum: 1
          description: The site's best organic place on desktop (engines without devices, such as Brave, here); null when not within the results read (20 for Google and Brave, 50 for DeepSeek, the sources given for brave_ai and linkup_ai).
        mobile:
          type: [integer, 'null']
          minimum: 1
        page:
          type: [string, 'null']
          description: The site's page at that place (a path).
        features:
          type: array
          items:
            type: string
            enum: [ai_overview, featured_snippet, people_also_ask, local_pack, video, images, top_stories, shopping, knowledge_graph, cited]
          description: Features on the results page; cited means an AI overview names the site among its sources.

    TargetsAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [engine, engines, range, days, cut, through, first, compare, connected, rules, statuses, status, counts, rows, total, more]
          properties:
            engine:
              $ref: '#/components/schemas/SearchEngine'
            engines:
              $ref: '#/components/schemas/SearchEngines'
            range:
              $ref: '#/components/schemas/Range'
            days:
              type: integer
            cut:
              type: boolean
              description: Whether the period was cut at the newest search day or to its newest 366 days.
            through:
              type: string
              description: Newest day with search data (YYYY-MM-DD); empty with none.
            first:
              type: string
              description: Oldest day with search data (YYYY-MM-DD); empty with none.
            compare:
              type: [object, 'null']
              properties:
                range:
                  $ref: '#/components/schemas/Range'
            connected:
              type: boolean
            rules:
              type: object
              properties:
                priority:
                  type: integer
                  description: The priority when none is given, and the one a queue item's clicks are scaled against.
                high_priority:
                  type: integer
                  description: The least priority a striking queue item needs.
                striking_from:
                  type: integer
                striking_to:
                  type: integer
                max_targets:
                  type: integer
            statuses:
              type: object
              description: Every target, by status.
              additionalProperties:
                type: integer
            status:
              $ref: '#/components/schemas/TargetFilter'
            counts:
              type: object
              description: The targets of the status asked for, by state.
              properties:
                ranking:
                  type: integer
                wrong_page:
                  type: integer
                no_page:
                  type: integer
                not_shown:
                  type: integer
            rows:
              type: array
              items:
                $ref: '#/components/schemas/TargetRow'
            total:
              type: integer
            more:
              type: boolean

    TargetsImportAnswer:
      type: object
      required: [format, added, updated, removed, skipped, total]
      properties:
        format:
          type: string
          enum: [list, csv, json, toon, seo-plugin]
        added:
          type: integer
        updated:
          type: integer
        removed:
          type: integer
          description: With replace, the targets deleted.
        skipped:
          type: array
          items:
            type: object
            required: [row, query, reason, message]
            properties:
              row:
                type: integer
                description: 1 for the first data row.
              query:
                type: string
              reason:
                type: string
                enum: [query, address, priority, measurements, status, duplicate, limit, exists, clash, unknown]
                description: exists, a target already (only_new, or a focus keyword suggestion); clash, the focus keyword of more than one page; unknown, no published page's focus keyword.
              message:
                type: string
                description: Why, in the site's language.
        total:
          type: integer
          description: Targets now.

    TargetListed:
      type: object
      required: [query, page, status, priority]
      properties:
        query:
          type: string
          description: Lower case, as stored.
        page:
          type: string
          description: Path of the page meant for it; empty when none is chosen.
        status:
          $ref: '#/components/schemas/TargetStatus'
        priority:
          type: integer
          minimum: 0
          maximum: 100

    TargetSuggestionsAnswer:
      type: object
      required: [plugin, all_keywords, pages, more, max_posts, counts, rows]
      properties:
        plugin:
          type: string
          enum: [rank-math, yoast, seopress, aioseo, demo, '']
          description: The active SEO plugin whose focus keywords are read; empty when none is active (every plugin's are read).
        all_keywords:
          type: boolean
        pages:
          type: integer
          description: Pages read with focus keywords.
        more:
          type: boolean
          description: More posts have focus keywords than max_posts.
        max_posts:
          type: integer
        counts:
          type: object
          required: [new, clash, targeted]
          properties:
            new:
              type: integer
            clash:
              type: integer
            targeted:
              type: integer
        rows:
          type: array
          items:
            type: object
            required: [query, keyword, state, pages, target]
            properties:
              query:
                type: string
                description: Lower case, as targets store it.
              keyword:
                type: string
                description: As the SEO plugin keeps it.
              state:
                type: string
                enum: [new, clash, targeted]
              pages:
                type: array
                items:
                  type: object
                  required: [path, post_id, title, url, edit_url]
                  properties:
                    path:
                      type: string
                    post_id:
                      type: integer
                      description: 0 in the demo data.
                    title:
                      type: string
                    url:
                      type: string
                    edit_url:
                      type: [string, 'null']
              target:
                type: ['object', 'null']
                description: The target, when the search is one already.
                properties:
                  page:
                    type: string
                  status:
                    $ref: '#/components/schemas/TargetStatus'
                  priority:
                    type: integer

    GoalStep:
      type: object
      required: [kind, match]
      properties:
        name:
          type: string
          maxLength: 100
          description: Shown in reports. A goal without one is named after its match.
        kind:
          type: string
          enum: [page, event]
          description: page — a page viewed; event — an event sent.
        match:
          type: string
          maxLength: 300
          description: The path (/pricing/) or event name (Purchase); `*` is any text (/blog/*).
        prop:
          type: string
          maxLength: 300
          description: Optional event property key (exact, case-sensitive). Requires value and kind event. Both fields empty remove a condition on update; omitted fields keep stored values.
        value:
          type: string
          maxLength: 300
          description: Property value; `*` matches any text on an event carrying prop, using the same dictionary matching as event names. Requires prop; page conditions and incomplete pairs are rejected. Both fields are limited to 300 UTF-8 bytes.

    Goal:
      allOf:
        - type: object
          required: [id, name]
          properties:
            id:
              type: string
        - $ref: '#/components/schemas/GoalStep'

    FunnelInput:
      type: object
      required: [name, steps]
      properties:
        name:
          type: string
          maxLength: 100
        steps:
          type: array
          minItems: 2
          maxItems: 12
          description: In the order they are reached within one visit. Step names may be empty.
          items:
            $ref: '#/components/schemas/GoalStep'

    Funnel:
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              type: string
        - $ref: '#/components/schemas/FunnelInput'

    Revenue:
      type: object
      required: [currency, amount, count]
      description: Revenue in one currency; amounts in different currencies are never added.
      properties:
        currency:
          type: string
          description: ISO 4217 code.
          examples: [USD]
        amount:
          type: number
          description: In the currency's main unit (dollars, not cents).
        count:
          type: integer
          description: Events that carried revenue in this currency.

    GoalRow:
      allOf:
        - $ref: '#/components/schemas/Goal'
        - type: object
          required: [visitors, visits, completions, conversion_rate, revenue]
          properties:
            visitors:
              type: integer
            visits:
              type: integer
              description: Visits that reached the goal (conversions).
            completions:
              type: integer
              description: Times it was reached (pageviews or events).
            conversion_rate:
              type: number
              description: visits ÷ all visits in the range.
            revenue:
              type: array
              items:
                $ref: '#/components/schemas/Revenue'
            change:
              $ref: '#/components/schemas/Change'

    BusinessProfileFigures:
      type: object
      required: [visitors, visits, conversions, goals, revenue]
      properties:
        visitors:
          type: integer
        visits:
          type: integer
        conversions:
          type: integer
          description: Every goal's completions, added together.
        goals:
          type: array
          items:
            type: object
            required: [id, name, visits, completions]
            properties:
              id:
                type: string
              name:
                type: string
              visits:
                type: integer
              completions:
                type: integer
        revenue:
          type: array
          description: Every event's amount in these visits, refunds taken off.
          items:
            $ref: '#/components/schemas/Revenue'

    BusinessProfileRow:
      allOf:
        - $ref: '#/components/schemas/BusinessProfileFigures'
        - type: object
          required: [platform, platform_label, name, url, page, campaign, source, link]
          properties:
            platform:
              type: string
              enum: [google, bing, apple, other]
            platform_label:
              type: string
            name:
              type: string
            url:
              type: string
              description: The public profile's address, or empty.
            page:
              type: string
              description: The site's page the profile stands for ('/' for the home page).
            campaign:
              type: string
              description: utm_campaign of its link, from its name, unique among the profiles.
            source:
              type: string
              description: utm_source of its link; for other, the profile address's site name.
            link:
              type: string
              description: The tagged website link to paste as the profile's website.

    BusinessProfilesAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [range, channel, profiles]
          properties:
            range:
              $ref: '#/components/schemas/Range'
            channel:
              $ref: '#/components/schemas/BusinessProfileFigures'
            profiles:
              type: array
              items:
                $ref: '#/components/schemas/BusinessProfileRow'

    GoalsAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [range, visits, goals]
          properties:
            range:
              $ref: '#/components/schemas/Range'
            visits:
              type: integer
              description: All visits in the range (with the filters).
            goals:
              type: array
              items:
                $ref: '#/components/schemas/GoalRow'
            renewals:
              type: object
              required: [scope, days, totals]
              properties:
                scope:
                  type: string
                  enum: [site, unavailable]
                days:
                  type: array
                  items:
                    allOf:
                      - $ref: '#/components/schemas/RenewalTotal'
                      - type: object
                        required: [day]
                        properties:
                          day:
                            type: string
                            format: date
                totals:
                  type: array
                  items:
                    $ref: '#/components/schemas/RenewalTotal'
            compare:
              type: object
              description: The comparison period's answer; each goal row then has `change` (visits, completions, conversion_rate).
              properties:
                range:
                  $ref: '#/components/schemas/Range'
                visits:
                  type: integer
                goals:
                  type: array
                  items:
                    $ref: '#/components/schemas/GoalRow'

    RenewalTotal:
      type: object
      required: [currency, count, amount]
      properties:
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        count:
          type: integer
          minimum: 0
        amount:
          type: number
          minimum: 0
          description: Paid renewal amount in main currency units, never summed across currencies.

    FunnelStepRow:
      allOf:
        - $ref: '#/components/schemas/GoalStep'
        - type: object
          required: [visits, rate, step_rate, dropped]
          properties:
            visits:
              type: integer
              description: Visits that reached this step in order.
            rate:
              type: number
              description: Of the visits that entered the funnel.
            step_rate:
              type: number
              description: Of the visits at the step before.
            dropped:
              type: integer
              description: Visits at the step before that did not reach this one.

    FunnelRow:
      type: object
      required: [id, name, entered, completed, completion_rate, conversion_rate, steps]
      properties:
        id:
          type: string
        name:
          type: string
        entered:
          type: integer
        completed:
          type: integer
        completion_rate:
          type: number
          description: completed ÷ entered.
        conversion_rate:
          type: number
          description: completed ÷ all visits in the range.
        steps:
          type: array
          items:
            $ref: '#/components/schemas/FunnelStepRow'
        change:
          $ref: '#/components/schemas/Change'

    FunnelsAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [range, visits, funnels]
          properties:
            range:
              $ref: '#/components/schemas/Range'
            visits:
              type: integer
            funnels:
              type: array
              items:
                $ref: '#/components/schemas/FunnelRow'
            compare:
              type: object
              description: The comparison period's answer; each funnel row then has `change` (entered, completed, conversion_rate).
              properties:
                range:
                  $ref: '#/components/schemas/Range'
                visits:
                  type: integer
                funnels:
                  type: array
                  items:
                    $ref: '#/components/schemas/FunnelRow'

    PropertyRow:
      type: object
      required: [value, label, count, visits, share, revenue]
      properties:
        value:
          type: string
          description: The key (without `key`) or the value.
        label:
          type: string
        count:
          type: integer
          description: Times it was sent.
        visits:
          type: integer
        share:
          type: number
          description: visits ÷ all visits in the range.
        revenue:
          type: array
          description: With `key` only.
          items:
            $ref: '#/components/schemas/Revenue'

    PropertiesAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [range, key, event, visits, rows]
          properties:
            range:
              $ref: '#/components/schemas/Range'
            key:
              type: string
            event:
              type: string
            visits:
              type: integer
            rows:
              type: array
              items:
                $ref: '#/components/schemas/PropertyRow'

    ClickTotals:
      type: object
      required: [clicks, dead, dead_rate, links, outbound, affiliate, downloads, forms, visits]
      properties:
        clicks:
          type: integer
          description: Clicks (form submits are counted apart).
        dead:
          type: integer
          description: Clicks the page did not react to within a second.
        dead_rate:
          type: number
          description: dead ÷ clicks.
        links:
          type: integer
          description: Clicks with a destination (links, here or elsewhere).
        outbound:
          type: integer
        affiliate:
          type: integer
        downloads:
          type: integer
          description: Clicks on file links.
        forms:
          type: integer
          description: Forms sent.
        visits:
          type: integer
          description: Visits with a click or form submit.

    ClickRow:
      type: object
      required: [selector, label, target, count, visits, share, dead, dead_rate, outbound, affiliate, download, fields]
      properties:
        selector:
          type: string
          description: tag#id.class of the element or form.
          examples: [a.wp-block-button__link]
        label:
          type: string
          description: Its text, or a form's name; emails and long numbers masked; '' when hidden with data-sps-mask.
        target:
          type: string
          description: "Destination; a path here, origin and path elsewhere, or mailto:/tel: without the address."
        count:
          type: integer
        visits:
          type: integer
        share:
          type: number
          description: count ÷ all clicks (forms ÷ all forms sent).
        dead:
          type: integer
        dead_rate:
          type: number
        outbound:
          type: boolean
        affiliate:
          type: boolean
        download:
          type: boolean
        fields:
          type: integer
          description: A form's fields (never their values); 0 for clicks.
        path:
          type: string
          description: Pages rows only; the page where clicks happened.
        url:
          type: string
          description: Pages rows only; address on this site.
        post_id:
          type: integer
          description: Pages rows only; 0 when no post matches.
        term_id:
          type: integer
          description: Pages rows only; present only when the page is a term archive and no post.
        taxonomy:
          type: string
          description: Pages rows only; with term_id.
        edit_url:
          type: [string, 'null']
          description: 'Pages rows only; null without edit_post (term archives: edit_term) permission. Shared read-only views omit it.'
        links:
          type: integer
          description: Pages rows only; link clicks on the page.
        forms:
          type: integer
          description: Pages rows only; forms sent on the page.

    ClickPageInfo:
      type: [object, 'null']
      description: Exact local page only; null for an empty page or a wildcard. Post identity is resolved inside the report cache, edit permission checked on every request. Shared read-only views must omit edit_url.
      required: [path, url, post_id]
      properties:
        path:
          type: string
        url:
          type: string
        post_id:
          type: integer
          description: 0 when no post matches, including made-up demo paths. Found by url_to_postid(), else by slug among viewable post types when the post's permalink has this path (custom post types without a base).
        term_id:
          type: integer
          description: Present only when the path is a term archive of a viewable taxonomy and no post.
        taxonomy:
          type: string
          description: With term_id.
        edit_url:
          type: [string, 'null']
          description: Editor address only when the current user can edit the post (or the term); otherwise null.

    ClicksAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [range, kind, page, page_info, totals, rows]
          properties:
            range:
              $ref: '#/components/schemas/Range'
            kind:
              type: string
              enum: [elements, dead, links, downloads, forms, pages]
            page:
              type: string
            page_info:
              $ref: '#/components/schemas/ClickPageInfo'
            totals:
              $ref: '#/components/schemas/ClickTotals'
            rows:
              type: array
              items:
                $ref: '#/components/schemas/ClickRow'
            compare:
              type: object
              required: [range, totals, change]
              properties:
                range:
                  $ref: '#/components/schemas/Range'
                totals:
                  $ref: '#/components/schemas/ClickTotals'
                change:
                  type: object
                  description: (now − then) ÷ then per total; null when then is 0.
                  additionalProperties:
                    type: [number, 'null']

    SearchMetrics:
      type: object
      required: [clicks, impressions, ctr, position]
      properties:
        clicks:
          type: integer
        impressions:
          type: integer
        ctr:
          type: number
          minimum: 0
          maximum: 1
          description: clicks ÷ impressions, at most 1.
        position:
          type: number
          description: Average position weighted by impressions; lower is better; 0 without impressions.

    SearchChange:
      type: object
      description: (now − then) ÷ then for clicks, impressions and CTR (null when then is 0); for position, now − then in places (negative is a climb; null when either has no impressions).
      required: [clicks, impressions, ctr, position]
      properties:
        clicks:
          type: [number, 'null']
        impressions:
          type: [number, 'null']
        ctr:
          type: [number, 'null']
        position:
          type: [number, 'null']

    SearchPoint:
      allOf:
        - $ref: '#/components/schemas/SearchMetrics'
        - type: object
          required: [t]
          properties:
            t:
              type: string
              format: date-time
              description: Start of the day or month.

    SearchRow:
      allOf:
        - $ref: '#/components/schemas/SearchMetrics'
        - type: object
          required: [id, value, label, share]
          properties:
            id:
              type: string
              description: Query or page ID, country code (ISO 3166-1 alpha-3, as Search Console gives it), device code, appearance ID, or a days row's first day.
            value:
              type: string
              description: The query, the page path, the country (ISO 3166-1 alpha-2; empty when unknown), the device (desktop, mobile, tablet, unknown), the appearance code, or a days row's first day (YYYY-MM-DD).
            label:
              type: string
            share:
              type: number
              description: clicks ÷ all clicks of the period.
            from:
              type: string
              format: date
              description: Days rows only; the first day covered (YYYY-MM-DD).
            to:
              type: string
              format: date
              description: Days rows only; the last day covered (YYYY-MM-DD, included).
            path:
              type: string
              description: Pages rows only.
            url:
              type: string
              description: Pages rows only.
            post_id:
              type: integer
              description: Pages rows only; 0 when no post matches.
            term_id:
              type: integer
              description: Pages rows only; present only when the page is a term archive and no post.
            taxonomy:
              type: string
              description: Pages rows only; with term_id.
            edit_url:
              type: [string, 'null']
              description: Pages rows only; only when the current user can edit the post (or the term).
            compare:
              description: With a comparison.
              allOf:
                - $ref: '#/components/schemas/SearchMetrics'
                - type: object
                  required: [change]
                  properties:
                    change:
                      $ref: '#/components/schemas/SearchChange'

    SearchAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [engine, engines, combined, range, through, first, connected, kind, sort, order, page, query, page_info, ignored, totals, grain, points, rows, more]
          properties:
            engine:
              $ref: '#/components/schemas/SearchEngine'
            engines:
              $ref: '#/components/schemas/SearchEngines'
            combined:
              $ref: '#/components/schemas/SearchCombined'
            range:
              $ref: '#/components/schemas/Range'
            through:
              type: string
              description: Newest day with search data (YYYY-MM-DD); empty with none.
            first:
              type: string
              description: Oldest day with search data (YYYY-MM-DD); empty with none.
            connected:
              type: boolean
              description: Whether the engine's source is connected (demo data, always).
            kind:
              type: string
              enum: [queries, pages, countries, devices, appearance, days]
            sort:
              type: string
              enum: [impressions, clicks, ctr, position, day]
              description: The rows' order applied (as asked, or the kind's default).
            order:
              type: string
              enum: [desc, asc]
            page:
              type: string
            query:
              type: string
            page_info:
              $ref: '#/components/schemas/ClickPageInfo'
            ignored:
              type: array
              description: Filter dimensions left out (only page filters apply to search data).
              items:
                type: string
            totals:
              $ref: '#/components/schemas/SearchMetrics'
            grain:
              type: string
              enum: [day, week, month]
              description: week for a page or query of Bing (each point is the week's last day).
            points:
              type: array
              items:
                $ref: '#/components/schemas/SearchPoint'
            rows:
              type: array
              items:
                $ref: '#/components/schemas/SearchRow'
            more:
              type: boolean
              description: Whether there are more rows after these.
            compare:
              type: object
              required: [range, totals, change, points]
              properties:
                range:
                  $ref: '#/components/schemas/Range'
                totals:
                  $ref: '#/components/schemas/SearchMetrics'
                change:
                  $ref: '#/components/schemas/SearchChange'
                points:
                  type: array
                  items:
                    $ref: '#/components/schemas/SearchPoint'

    OpportunityPage:
      type: object
      required: [path_id, path, url, post_id, edit_url]
      properties:
        path_id:
          type: integer
        path:
          type: string
        url:
          type: string
        post_id:
          type: integer
          description: 0 when no post matches.
        term_id:
          type: integer
          description: Present only when the page is a term archive and no post.
        taxonomy:
          type: string
          description: With term_id.
        edit_url:
          type: [string, 'null']
          description: Only when the current user can edit the post (or the term).

    OpportunityPair:
      description: A page's query (striking and ctr).
      allOf:
        - $ref: '#/components/schemas/OpportunityPage'
        - $ref: '#/components/schemas/SearchMetrics'
        - type: object
          required: [query, expected_ctr, potential]
          properties:
            query:
              type: string
            expected_ctr:
              type: number
              description: The site's CTR at position 3 (striking) or at the query's position (ctr).
            potential:
              type: integer
              description: Clicks it could gain (striking) or misses (ctr) in the period.

    OpportunityDecay:
      description: A page losing clicks (decay).
      allOf:
        - $ref: '#/components/schemas/OpportunityPage'
        - $ref: '#/components/schemas/SearchMetrics'
        - type: object
          required: [compare, lost, cause, why, queries, changes]
          properties:
            compare:
              description: The earlier period.
              allOf:
                - $ref: '#/components/schemas/SearchMetrics'
                - type: object
                  required: [change]
                  properties:
                    change:
                      $ref: '#/components/schemas/SearchChange'
            lost:
              type: integer
              description: Clicks then − clicks now.
            cause:
              type: string
              enum: [position, demand, ctr, gone]
            why:
              type: string
              description: One sentence saying why, in the site's language.
            queries:
              type: array
              description: The queries that lost most clicks (up to 3).
              items:
                type: object
                required: [query, lost, clicks, then_clicks, position, then_position, rival]
                properties:
                  query:
                    type: string
                  lost:
                    type: integer
                  clicks:
                    type: integer
                  then_clicks:
                    type: integer
                  position:
                    type: [number, 'null']
                    description: Null without impressions.
                  then_position:
                    type: [number, 'null']
                  rival:
                    description: Another page of the site that ranks better for the query now and did not before (the refresh planner's merge), if one does.
                    oneOf:
                      - $ref: '#/components/schemas/DecayRival'
                      - type: 'null'
            changes:
              type: array
              description: The site's recorded changes on the page in both periods, newest first (up to 5).
              items:
                $ref: '#/components/schemas/Marker'

    DecayRival:
      description: Another page of the site that overtook a losing page for a query.
      allOf:
        - $ref: '#/components/schemas/OpportunityPage'
        - type: object
          required: [clicks, impressions, position, then_position, share]
          properties:
            clicks:
              type: integer
            impressions:
              type: integer
            position:
              type: number
            then_position:
              type: [number, 'null']
              description: Null when search did not show it for the query before.
            share:
              type: number
              description: Its share of the query's impressions now.

    RefreshProposal:
      type: string
      enum: [leave, protect, merge, update]
      description: The refresh planner's proposal for a page losing clicks, checked in this order.

    CoverageResult:
      type: object
      required: [match, phrase, missing, question]
      properties:
        match:
          type: string
          enum: [title, heading, text, partial, none]
          description: How far the page's words cover the query, best first.
        phrase:
          type: boolean
          description: The query's words are on the page in order.
        missing:
          type: array
          description: The query's words the page does not have.
          items:
            type: string
        question:
          type: boolean

    OpportunityMissing:
      description: A page's query its words do not cover, or only partly (missing).
      allOf:
        - $ref: '#/components/schemas/OpportunityPage'
        - $ref: '#/components/schemas/SearchMetrics'
        - $ref: '#/components/schemas/CoverageResult'
        - type: object
          required: [query]
          properties:
            query:
              type: string

    OpportunityOverlap:
      description: A query shared by pages, a candidate to review (overlap). The page fields are the leading page's; the figures are the query's over all its pages.
      allOf:
        - $ref: '#/components/schemas/OpportunityPage'
        - $ref: '#/components/schemas/SearchMetrics'
        - type: object
          required: [query, pages, page_count, leaders, switched, potential]
          properties:
            query:
              type: string
            pages:
              type: array
              description: Most impressions first.
              items:
                allOf:
                  - $ref: '#/components/schemas/OpportunityPage'
                  - $ref: '#/components/schemas/SearchMetrics'
                  - type: object
                    required: [share]
                    properties:
                      share:
                        type: number
                        description: Share of the query's impressions on its pages.
            page_count:
              type: integer
              description: Pages with the share or more, including any not listed.
            leaders:
              type: array
              description: Path of the page with most impressions in the first and in the second half; null when none.
              minItems: 2
              maxItems: 2
              items:
                type: [string, 'null']
            switched:
              type: boolean
              description: Whether the leading page changed between the halves.
            potential:
              type: integer
              description: Clicks it would have if all its pages' impressions had the best of their CTRs, less its clicks.

    CoverageAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [page, post_id, page_info, range, days, cut, through, first, connected, text, focus, totals, rows, more]
          properties:
            page:
              type: string
            post_id:
              type: integer
              description: The page's post; 0 when it is not one post.
            page_info:
              type: [object, 'null']
              description: Path, url, post_id and edit_url (only when the current user can edit the post).
            range:
              $ref: '#/components/schemas/Range'
            days:
              type: integer
            cut:
              type: boolean
            through:
              type: string
            first:
              type: string
            connected:
              type: boolean
            text:
              type: [object, 'null']
              description: What the page's words were read from; null when it is not one post.
              properties:
                source:
                  type: string
                  enum: [post, demo]
                words:
                  type: integer
                plugin:
                  type: string
                  description: The SEO plugin read (rank-math, yoast, seopress, aioseo, or another named by the seoproanalytics_focus_keywords filter; demo for demo data); empty for none.
                seo_title:
                  type: string
                  description: The SEO title, without its plugin's variables.
                description:
                  type: string
            focus:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/CoverageResult'
                  - type: object
                    required: [keyword, source, searched, clicks, impressions, position]
                    properties:
                      keyword:
                        type: string
                      source:
                        type: string
                      searched:
                        type: boolean
                        description: Whether it is a query the page showed for.
                      clicks:
                        type: integer
                      impressions:
                        type: integer
                      position:
                        type: [number, 'null']
            totals:
              type: object
              required: [queries, impressions, clicks, covered, missing, questions]
              properties:
                queries:
                  type: integer
                impressions:
                  type: integer
                clicks:
                  type: integer
                covered:
                  type: number
                  description: Share of impressions on queries the page covers (title, heading or text).
                missing:
                  type: integer
                  description: Queries covered partly or not at all.
                questions:
                  type: integer
            rows:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/SearchMetrics'
                  - $ref: '#/components/schemas/CoverageResult'
                  - type: object
                    required: [query]
                    properties:
                      query:
                        type: string
            more:
              type: boolean
              description: Whether the page has more than 200 queries.

    OpportunitiesAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [engine, engines, combined, kind, range, days, cut, through, first, connected, ignored, rules, rows, total, more]
          properties:
            engine:
              $ref: '#/components/schemas/SearchEngine'
            engines:
              $ref: '#/components/schemas/SearchEngines'
            combined:
              $ref: '#/components/schemas/SearchCombined'
            kind:
              type: string
              enum: [striking, ctr, decay, missing, overlap]
            range:
              $ref: '#/components/schemas/Range'
            days:
              type: integer
              description: Days read; 0 without search data.
            cut:
              type: boolean
              description: Whether the period was cut to its newest 366 days.
            through:
              type: string
              description: Newest day with search data (YYYY-MM-DD); empty with none.
            first:
              type: string
              description: Oldest day with search data (YYYY-MM-DD); empty with none.
            connected:
              type: boolean
              description: Whether the engine's source is connected (demo data, always).
            ignored:
              type: array
              description: Filter dimensions left out (only page filters apply to search data).
              items:
                type: string
            rules:
              type: object
              description: |
                The thresholds used. striking: min_impressions,
                position_from, position_to, target. ctr: min_impressions,
                position_from, position_to, under. decay: min_lost,
                min_share. missing: min_impressions, position_from,
                position_to, pages. overlap: min_impressions, min_share,
                pages.
              additionalProperties:
                type: number
            rows:
              type: array
              description: OpportunityPair rows (striking, ctr), OpportunityDecay rows (decay), OpportunityMissing rows (missing) or OpportunityOverlap rows (overlap).
              items:
                oneOf:
                  - $ref: '#/components/schemas/OpportunityPair'
                  - $ref: '#/components/schemas/OpportunityDecay'
                  - $ref: '#/components/schemas/OpportunityMissing'
                  - $ref: '#/components/schemas/OpportunityOverlap'
            halves:
              type: [array, 'null']
              description: overlap; the first and second half of the period (whole weeks for Bing), null when too short to halve.
              items:
                $ref: '#/components/schemas/Range'
            total:
              type: integer
              description: All opportunities of this kind.
            more:
              type: boolean
              description: Whether there are more rows after these.
            curve:
              type: [object, 'null']
              description: striking and ctr; null without search data.
              required: [source, ctr]
              properties:
                source:
                  type: string
                  enum: [site, mixed, default]
                  description: The site's own CTR at every position, at some, or at none (a cautious default).
                ctr:
                  type: object
                  description: CTR by position, "1" to "20".
                  additionalProperties:
                    type: number
            compare:
              type: [object, 'null']
              description: decay; the earlier period, null without search data.
              required: [range, cut]
              properties:
                range:
                  $ref: '#/components/schemas/Range'
                cut:
                  type: boolean
                  description: Whether both periods were shortened so the earlier one holds only days with search data.
            updates:
              type: array
              description: decay; search engine updates in either period.
              items:
                $ref: '#/components/schemas/Marker'

    AuditFinding:
      type: string
      enum: [noindex, canonical, crawl_error, served_noindex, served_canonical, served_title, served_description, unreachable, deep, slow, robots_blocked, not_indexed, google_canonical, bing_crawl, broken_links, thin, title_missing, title_duplicate, title_long, description_missing, description_duplicate, description_long, h1_none, h1_several, rich_errors, redirect_links, images_alt]
      description: A content audit finding; the list is most serious first. robots_blocked, not_indexed, google_canonical and rich_errors come from Google's URL Inspection (InspectionFinding); bing_crawl from Bing's crawl issues (/crawl-issues); crawl_error, served_noindex, served_canonical, broken_links and redirect_links from an imported crawl (CrawlFinding, /crawl).

    AuditFacts:
      type: object
      description: What the content audit read from a page's post and SEO plugin fields.
      required: [title_length, seo_title_length, description_length, h1, words, images, images_no_alt, noindex, canonical_away, modified, checked]
      properties:
        title_length:
          type: integer
          description: Characters of the title shown (the SEO title, else the post title).
        seo_title_length:
          type: integer
          description: Characters of the SEO title as written; 0 when it is made of the plugin's variables.
        description_length:
          type: integer
          description: Characters of the description (the SEO plugin's, else the excerpt).
        h1:
          type: integer
          description: H1s in the text (themes show the title as one more).
        words:
          type: integer
        images:
          type: integer
        images_no_alt:
          type: integer
        noindex:
          type: boolean
        canonical_away:
          type: boolean
          description: Whether the canonical address is another page.
        modified:
          type: [string, 'null']
          format: date-time
        checked:
          type: string
          format: date-time
          description: When the facts were read.

    AuditRow:
      allOf:
        - $ref: '#/components/schemas/OpportunityPage'
        - $ref: '#/components/schemas/SearchMetrics'
        - type: object
          required: [findings, facts, same_title, same_description]
          properties:
            findings:
              type: array
              items:
                $ref: '#/components/schemas/AuditFinding'
            facts:
              $ref: '#/components/schemas/AuditFacts'
            same_title:
              type: array
              description: Other pages with the same title (up to five).
              items:
                type: string
            same_description:
              type: array
              description: Other pages with the same description (up to five).
              items:
                type: string
            google:
              description: Google's URL Inspection of the page; null until inspected.
              oneOf:
                - $ref: '#/components/schemas/InspectionGoogle'
                - type: 'null'
            bing:
              description: Bing's crawl issue of the page; null without one.
              oneOf:
                - type: object
                  required: [http, issues, url]
                  properties:
                    http:
                      type: integer
                      description: HTTP status Bing got; 0 when none.
                    issues:
                      type: array
                      items:
                        $ref: '#/components/schemas/CrawlIssue'
                    url:
                      type: string
                - type: 'null'
            crawl:
              description: The imported crawl's facts of the page (/crawl); null when it was not crawled.
              oneOf:
                - $ref: '#/components/schemas/AuditCrawl'
                - type: 'null'

    AuditCrawl:
      type: object
      required: [status, hops, redirect, flags, h1, broken, redirects, crawled]
      properties:
        response_ms: { type: [integer, 'null'], description: As the crawler measured; milliseconds. }
        prev_response_ms: { type: [integer, 'null'], description: Previous distinct import timing; unknown is null. }
        bytes: { type: [integer, 'null'], description: HTML bytes only. }
        field:
          type: array
          description: Fresh page-level TTFB and LCP samples; no origin fallback.
          items: { type: object }
        field_poor: { type: boolean }
        slow: { type: boolean }
        status:
          type: [integer, 'null']
          description: HTTP status the crawl got; 0 for no answer; null when only the page's links were crawled.
        hops:
          type: integer
          description: Redirects before the answer.
        redirect:
          type: [string, 'null']
        flags:
          type: array
          description: What the page served.
          items:
            type: string
            enum: [noindex, nofollow, canonical, title_missing, title_differs, desc_differs, desc_missing]
        h1:
          type: [integer, 'null']
          minimum: 0
          maximum: 255
          description: Observed served count, replacing the audit's theme assumption. Null for missing export columns or pre-v29 rows. LibreCrawl's pinned first-H1 string detects presence only.
        broken:
          type: integer
          description: Its links that fail.
        redirects:
          type: integer
          description: Its internal links through redirects.
        crawled:
          type: [string, 'null']
          format: date-time

    CrawlFinding:
      type: string
      enum: [crawl_error, served_noindex, served_canonical, served_title, served_description, broken_links, redirect_links, unreachable, deep, slow]
      description: "An imported crawl's finding of a page (also an AuditFinding), whatever its impressions. crawl_error: it answered 4xx, 5xx or nothing; served_noindex and served_canonical: served with noindex or a canonical elsewhere WordPress does not set; served_title: empty, site-name-only or does not contain the stored title (normalised; site-name affixes accepted); served_description: observed description missing or different from WordPress; broken_links: it links to addresses that fail; redirect_links: internal links on it go through redirects. Served text findings become CTR Plan items on pages with impressions."

    CrawlAnswer:
      type: object
      required: [kind, status, finding, import, format, files, read, counts, findings, trend, range, rows, total, more, rules]
      properties:
        complete:
          type: boolean
          description: Whole-site coverage confirmed for the newest import; false for unknown or links-only coverage.
        coverage_note:
          type: string
          description: Explains skipped unreachable findings for incomplete crawls.
        kind:
          type: string
          enum: [pages, links, clicked]
        status:
          type: string
        finding:
          type: string
        import:
          type: [integer, 'null']
          description: The import shown; null for none.
        format:
          type: [string, 'null']
          enum: [librecrawl, aidevops, csv, null]
        files:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              kind: { type: string, enum: [pages, links] }
              format: { type: string }
        read:
          type: [string, 'null']
          format: date-time
          description: When the crawl was imported; null for none.
        counts:
          type: object
          description: Pages per answer (ok, redirect, error, none), redirected (with hops), as served (noindex, canonical, title_missing); links kept, broken_links (fail), blocked_links (external 401/403/429/999, not broken) and redirect_links (internal, through redirects). Existing retained links reclassify without another import; historical trend totals remain as recorded.
          additionalProperties:
            type: integer
        findings:
          type: object
          description: Pages per CrawlFinding.
          additionalProperties:
            type: integer
        trend:
          type: array
          maxItems: 5000
          description: Completed imports with totals, oldest first; newest 5000 at most. Failed, undone and legacy imports without totals are omitted. Reads imports only.
          items:
            type: object
            required: [id, started, totals]
            properties:
              id: { type: integer }
              started: { type: string, format: date-time }
              totals: { $ref: '#/components/schemas/CrawlTotals' }
        range:
          description: Clicked destinations or slow pages; otherwise null.
          oneOf:
            - $ref: '#/components/schemas/Range'
            - type: 'null'
        rows:
          type: array
          description: 'pages: path_id, path, url, status, answer, prev_status (the import before), hops, redirect, flags, findings, broken, redirects, depth, response_ms, bytes, crawled; title and description (nullable strings, null when unobserved or unkept, empty when observed empty); stored_title and stored_description (nullable strings, current WordPress text); h1 (nullable integer, observed served count capped at 255). Text retained only for up to 500 flagged pages per import. links: from, from_url, target, internal, status (unchanged), answer (ok, redirect, error, none or blocked), failed, blocked (external 401/403/429/999; failed is false), hops, placement (navigation, footer, body, image, sidebar, other), anchor. clicked: target, status, answer, clicks, outbound, affiliate, path_id, pages (clicked on), linked_on; blocked destinations excluded even with redirect hops.'
          items:
            type: object
            properties:
              visits: { type: integer, description: Slow list only; all-channel landing visits in the period. }
              conversions: { type: integer, description: Slow list only; visits reaching the chosen goal. }
              response_ms: { type: [integer, 'null'] }
              prev_response_ms: { type: [integer, 'null'] }
              bytes: { type: [integer, 'null'] }
              field:
                type: array
                items: { type: object }
                description: Fresh page-level field TTFB/LCP; poor takes precedence, non-poor suppresses crawl-only findings.
              links_in:
                type: [integer, 'null']
                description: Pages list only; distinct incoming source pages as served, capped at 65535. Null without a links export.
              links_in_body:
                type: [integer, 'null']
                description: Pages list only; distinct incoming source pages from body placement.
              hops:
                type: integer
                description: Includes clicked rows; redirects observed by the crawl.
              redirect:
                type: [string, 'null']
                description: Includes clicked rows; final target when exported, otherwise null.
        total:
          type: integer
        more:
          type: boolean
        rules:
          type: object
          properties:
            max_pages: { type: integer }
            max_links: { type: integer }
            max_rows: { type: integer }
            formats:
              type: array
              items: { type: string }

    CrawlImportJob:
      type: object
      required: [status, id, format, done, total, pages, links, skipped, changes]
      properties:
        partial:
          type: boolean
          description: Covered pages only; never establishes whole-site completeness or enters the trend.
        status:
          type: string
          enum: [idle, running, restoring, done, error]
          description: Restoring is a resumable partial undo; replacement imports are blocked until it finishes.
        id:
          type: integer
          description: The import's ID (for undo).
        format:
          type: string
        files:
          type: array
          items:
            type: object
        done:
          type: integer
        total:
          type: integer
        pages:
          type: integer
        links:
          type: integer
          description: Links kept (those that fail or redirect).
        skipped:
          type: integer
        changes:
          type: integer
          description: Served markers added to the timeline.
        error:
          type: string

    CrawlTotals:
      type: object
      required: [pages, links, statuses, findings, duration]
      description: Latest-state counts saved once on the completed imports row. A links-only import includes the pages still kept from the previous crawl. No page or link history copies.
      properties:
        response_ms:
          type: object
          description: Nearest-rank response milliseconds, excluding unknown zero timings. Absent on legacy imports.
          properties:
            median: { type: [integer, 'null'] }
            p90: { type: [integer, 'null'] }
        complete: { type: boolean, description: Whole-site coverage confirmed; absent on older imports. }
        link_counts: { type: boolean, description: The import supplied incoming link counts. }
        pages: { type: integer, minimum: 0 }
        links: { type: integer, minimum: 0, description: Links kept (failing or redirecting). }
        duration: { type: integer, minimum: 0, description: Elapsed seconds including staging and time between batches. }
        statuses:
          type: object
          required: ['2xx', '3xx', '4xx', '5xx', none, other]
          properties:
            '2xx': { type: integer, minimum: 0 }
            '3xx': { type: integer, minimum: 0 }
            '4xx': { type: integer, minimum: 0 }
            '5xx': { type: integer, minimum: 0 }
            none: { type: integer, minimum: 0 }
            other: { type: integer, minimum: 0 }
        findings:
          type: object
          description: Before audit exclusions; page findings count pages, broken_links and redirect_links count links. served_title and served_description are present from schema v29 imports; absent in older totals, not zero samples.
          required: [crawl_error, served_noindex, served_canonical, broken_links, redirect_links]
          additionalProperties: { type: integer, minimum: 0 }

    CrawlImport:
      type: object
      required: [id, status, format, files, started, finished, pages, links, skipped, changes, totals, error]
      properties:
        partial:
          type: boolean
          description: Partial import counts stay in history, not the whole-site trend.
        id:
          type: integer
        status:
          type: string
          enum: [running, done, failed, undone]
        format:
          type: string
        files:
          type: array
          items:
            type: object
        started:
          type: [string, 'null']
          format: date-time
        finished:
          type: [string, 'null']
          format: date-time
        pages:
          type: integer
        links:
          type: integer
        skipped:
          type: integer
        changes:
          type: integer
        totals:
          description: Null for incomplete or legacy imports. Undone imports retain their historical totals but are excluded from trends.
          oneOf:
            - $ref: '#/components/schemas/CrawlTotals'
            - type: object
              description: Partial-import counts only, never a whole-site trend sample.
              additionalProperties: false
              required: [pages, links, duration, complete]
              properties:
                pages: {type: integer}
                links: {type: integer}
                duration: {type: integer}
                complete: {type: boolean, const: false}
            - type: 'null'
        error:
          type: string

    AuditAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [engine, engines, range, days, cut, through, first, connected, ignored, finding, sort, order, rules, checked, plugin, counts, pages, rows, total, more]
          properties:
            engine:
              $ref: '#/components/schemas/SearchEngine'
            engines:
              $ref: '#/components/schemas/SearchEngines'
            range:
              $ref: '#/components/schemas/Range'
            days:
              type: integer
              description: Days of search figures; 0 without search data.
            cut:
              type: boolean
            through:
              type: string
            first:
              type: string
            connected:
              type: boolean
            ignored:
              type: array
              items:
                type: string
            finding:
              type: string
              description: The finding asked for; empty for all.
            sort:
              type: string
              enum: [impressions, clicks, ctr, position]
              description: The pages' order applied.
            order:
              type: string
              enum: [desc, asc]
            rules:
              type: object
              required: [title_max, description_max, thin_words, thin_impressions, batch, stale_days]
              properties:
                title_max:
                  type: integer
                description_max:
                  type: integer
                thin_words:
                  type: integer
                thin_impressions:
                  type: integer
                  description: Impressions in the period from which a short page with no clicks is thin.
                batch:
                  type: integer
                  description: Posts the daily cron reads at most.
                stale_days:
                  type: integer
                  description: Days after which a page's facts are read again.
            checked:
              type: object
              required: [pages, oldest, newest]
              properties:
                pages:
                  type: integer
                  description: Pages with facts.
                oldest:
                  type: [string, 'null']
                  format: date-time
                newest:
                  type: [string, 'null']
                  format: date-time
            plugin:
              type: string
              enum: [rank-math, yoast, seopress, aioseo, demo, '']
              description: The SEO plugin the fields are read from; empty without one.
            counts:
              type: object
              description: Pages per finding, whatever finding is asked for.
              additionalProperties:
                type: integer
            pages:
              type: integer
              description: Pages with any finding.
            rows:
              type: array
              description: Most impressions first.
              items:
                $ref: '#/components/schemas/AuditRow'
            total:
              type: integer
            more:
              type: boolean

    LinksKind:
      type: string
      enum: [orphans, converting, missing]
      default: orphans

    LinksPageRow:
      description: An orphan page, or a converting page with few links in.
      allOf:
        - $ref: '#/components/schemas/OpportunityPage'
        - $ref: '#/components/schemas/SearchMetrics'
        - type: object
          required: [visits, conversions, links_in, from]
          properties:
            visits:
              type: integer
              description: Visits from search that started on the page.
            conversions:
              type: [integer, 'null']
              description: Those visits that reached the goal; null without goals.
            links_in:
              type: integer
              description: Effective distinct incoming count (served when known, otherwise text).
            links_in_text:
              type: integer
            links_in_served:
              type: [integer, 'null']
            source:
              type: string
              enum: [served, text]
            from:
              type: array
              description: Pages linking to it (up to five).
              items:
                type: string

    LinksMissingRow:
      description: A page (its figures for the searches) that does not link to the page with most clicks for them (`to`, its figures for them).
      allOf:
        - $ref: '#/components/schemas/OpportunityPage'
        - $ref: '#/components/schemas/SearchMetrics'
        - type: object
          required: [to, queries, query_count]
          properties:
            to:
              allOf:
                - $ref: '#/components/schemas/OpportunityPage'
                - $ref: '#/components/schemas/SearchMetrics'
            queries:
              type: array
              description: Up to rules.queries searches, most impressions first.
              items:
                type: object
                required: [query, clicks, impressions, position, to_clicks, to_position]
                properties:
                  query:
                    type: string
                  clicks:
                    type: integer
                  impressions:
                    type: integer
                  position:
                    type: number
                  to_clicks:
                    type: integer
                  to_position:
                    type: number
            query_count:
              type: integer

    LinksAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [engine, engines, range, days, cut, through, first, connected, ignored, kind, rules, read, goal, goals, counts, rows, total, more]
          properties:
            engine:
              $ref: '#/components/schemas/SearchEngine'
            engines:
              $ref: '#/components/schemas/SearchEngines'
            range:
              $ref: '#/components/schemas/Range'
            days:
              type: integer
              description: Days of search figures; 0 without search data.
            cut:
              type: boolean
            through:
              type: string
            first:
              type: string
            connected:
              type: boolean
            ignored:
              type: array
              items:
                type: string
            kind:
              $ref: '#/components/schemas/LinksKind'
            rules:
              type: object
              required: [few_links, min_conversions, min_impressions, queries, max_links]
              properties:
                few_links:
                  type: integer
                  description: Pages linking in at most for a converting page to be listed.
                min_conversions:
                  type: integer
                min_impressions:
                  type: integer
                  description: Impressions a page needs on a search for a missing link.
                queries:
                  type: integer
                max_links:
                  type: integer
                  description: Pages a page's links are kept to, at most.
            read:
              type: object
              required: [pages, read, complete]
              properties:
                pages:
                  type: integer
                  description: Published pages the content audit has read.
                read:
                  type: integer
                  description: Those whose links were read.
                complete:
                  type: boolean
            goal:
              type: [object, 'null']
              description: The goal counted; null without goals.
              properties:
                id:
                  type: string
                name:
                  type: string
            goals:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
            counts:
              type: object
              description: Rows per list, whatever kind is asked for.
              additionalProperties:
                type: integer
            rows:
              type: array
              description: LinksPageRow for orphans and converting, LinksMissingRow for missing.
              items:
                oneOf:
                  - $ref: '#/components/schemas/LinksPageRow'
                  - $ref: '#/components/schemas/LinksMissingRow'
            total:
              type: integer
            more:
              type: boolean

    IndexationKind:
      type: string
      enum: [pages, sitemap]
      default: pages

    IndexationRow:
      description: A published page (pages) or sitemap address (sitemap) search has not shown in the period.
      allOf:
        - $ref: '#/components/schemas/OpportunityPage'
        - type: object
          required: [state, last_impression, age]
          properties:
            state:
              type: string
              enum: [never, lost]
              description: never, no impressions on record; lost, shown before the period and not since.
            last_impression:
              type: [string, 'null']
              format: date
              description: The last day with impressions; null when never shown.
            age:
              type: integer
              description: Days since it was published (pages) or first listed (sitemap).
            published:
              type: string
              format: date-time
              description: pages; when it was published, in the site's time zone.
            words:
              type: integer
              description: pages.
            links_in:
              type: integer
              description: pages; other pages whose text links to it.
            first_seen:
              type: string
              format: date-time
              description: sitemap; when the address was first read in a sitemap.
            source:
              type: string
              enum: [taxonomies, users, other]
              description: sitemap; the sitemap provider (category and tag archives, author archives, or another plugin's).
            google:
              description: Google's URL Inspection of the page (its reason and last crawl); null until inspected, and for Bing.
              oneOf:
                - $ref: '#/components/schemas/InspectionGoogle'
                - type: 'null'

    IndexationAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [engine, engines, range, days, through, first, connected, ignored, kind, rules, read, typical, skipped, counts, rows, total, more]
          properties:
            engine:
              $ref: '#/components/schemas/SearchEngine'
            engines:
              $ref: '#/components/schemas/SearchEngines'
            range:
              $ref: '#/components/schemas/Range'
            days:
              type: integer
            through:
              type: string
              description: The newest day with search data; empty without any.
            first:
              type: string
            connected:
              type: boolean
            ignored:
              type: array
              items:
                type: string
            kind:
              $ref: '#/components/schemas/IndexationKind'
            rules:
              type: object
              required: [days, max_rows, max_urls]
              properties:
                days:
                  type: integer
                max_rows:
                  type: integer
                  description: Pages and addresses checked at most per list, newest first.
                max_urls:
                  type: integer
                  description: Sitemap addresses kept at most.
            read:
              type: object
              required: [pages, published, complete, sitemap]
              properties:
                pages:
                  type: integer
                  description: Published pages the content audit has read.
                published:
                  type: integer
                  description: Those with their published time.
                complete:
                  type: boolean
                sitemap:
                  type: object
                  required: [read, enabled, complete, addresses]
                  properties:
                    read:
                      type: [string, 'null']
                      format: date-time
                    enabled:
                      type: boolean
                      description: Whether WordPress's sitemaps were on when read.
                    complete:
                      type: boolean
                      description: Whether every provider was read within the limits.
                    addresses:
                      type: integer
            typical:
              type: number
              description: A shown page's clicks per 28 days, on average, in the period.
            skipped:
              type: object
              required: [noindex, canonical]
              description: Published pages without impressions left out, as they ask not to be shown.
              properties:
                noindex:
                  type: integer
                canonical:
                  type: integer
            counts:
              type: object
              description: Rows per list, whatever kind is asked for.
              additionalProperties:
                type: integer
            sitemaps:
              description: Search Console's sitemaps (Google); null for Bing.
              oneOf:
                - $ref: '#/components/schemas/SearchSitemaps'
                - type: 'null'
            inspections:
              description: URL Inspection's progress and pages inspected (Google); null for Bing.
              oneOf:
                - allOf:
                    - $ref: '#/components/schemas/InspectionProgress'
                    - type: object
                      required: [inspected]
                      properties:
                        inspected:
                          type: integer
                - type: 'null'
            rows:
              type: array
              description: Never shown first, then the newest.
              items:
                $ref: '#/components/schemas/IndexationRow'
            total:
              type: integer
            more:
              type: boolean

    InspectionVerdict:
      type: string
      enum: [PASS, PARTIAL, FAIL, NEUTRAL]
      description: Google's verdict of the version in its index (PASS indexed; NEUTRAL excluded; FAIL an error; PARTIAL reserved by Google).

    InspectionFinding:
      type: string
      enum: [robots_blocked, not_indexed, google_canonical, rich_errors]
      description: A finding from Google's URL Inspection; also a content audit finding.

    InspectionGoogle:
      type: object
      description: Google's view of a page from URL Inspection, the version in its index. Google's values as it gives them; null when not given.
      required: [checked, verdict, coverage, indexing, robots, page_fetch, crawled_as, last_crawl, google_canonical, user_canonical, rich_verdict, rich, sitemaps, referring, link, error, findings]
      properties:
        checked:
          type: string
          format: date-time
          description: When it was inspected.
        verdict:
          oneOf:
            - $ref: '#/components/schemas/InspectionVerdict'
            - type: 'null'
        coverage:
          type: [string, 'null']
          description: Google's reason, in its words (for example "Crawled - currently not indexed").
        indexing:
          type: [string, 'null']
          description: Google's indexingState, such as INDEXING_ALLOWED or BLOCKED_BY_META_TAG.
        robots:
          type: [string, 'null']
          description: Google's robotsTxtState, ALLOWED or DISALLOWED.
        page_fetch:
          type: [string, 'null']
          description: Google's pageFetchState, such as SUCCESSFUL or NOT_FOUND.
        crawled_as:
          type: [string, 'null']
          enum: [DESKTOP, MOBILE, null]
        last_crawl:
          type: [string, 'null']
          format: date-time
        google_canonical:
          type: [string, 'null']
          description: The canonical Google chose.
        user_canonical:
          type: [string, 'null']
          description: The canonical the page declares.
        rich_verdict:
          oneOf:
            - $ref: '#/components/schemas/InspectionVerdict'
            - type: 'null'
        rich:
          type: array
          description: Rich result types Google detected, with their issues.
          items:
            type: object
            required: [type, items, errors, warnings, issues]
            properties:
              type:
                type: string
              items:
                type: integer
              errors:
                type: integer
              warnings:
                type: integer
              issues:
                type: array
                items:
                  type: object
                  required: [message, severity]
                  properties:
                    message:
                      type: string
                    severity:
                      type: string
                      enum: [error, warning]
        sitemaps:
          type: array
          description: Sitemaps Google knows the page from (up to five).
          items:
            type: string
        referring:
          type: array
          description: Pages Google knows the page from (up to five).
          items:
            type: string
        link:
          type: [string, 'null']
          description: The inspection in Search Console.
        error:
          type: [string, 'null']
          description: Google's message when it would not inspect the address.
        findings:
          type: array
          items:
            $ref: '#/components/schemas/InspectionFinding'

    InspectionProgress:
      type: object
      required: [daily, used, day, last, error, error_at]
      properties:
        daily:
          type: integer
          description: Inspections a day at most (Settings → Data); 0 for none.
        used:
          type: integer
          description: Inspections today.
        day:
          type: string
          format: date
          description: Google's day (Pacific time).
        last:
          type: [string, 'null']
          format: date-time
          description: The last run.
        error:
          type: [string, 'null']
          description: Google's message when it stopped the last run.
        error_at:
          type: [string, 'null']
          format: date-time

    SearchSitemap:
      type: object
      description: A sitemap submitted in Search Console, as Google read it.
      required: [path, type, index, pending, submitted, downloaded, errors, warnings, contents, problems]
      properties:
        path:
          type: string
          description: The sitemap's address.
        type:
          type: string
        index:
          type: boolean
          description: Whether it is a sitemap index.
        pending:
          type: boolean
        submitted:
          type: [string, 'null']
          format: date-time
        downloaded:
          type: [string, 'null']
          format: date-time
          description: When Google last downloaded it.
        errors:
          type: integer
        warnings:
          type: integer
        contents:
          type: array
          description: Addresses submitted, by type (Google's indexed count is deprecated and left out).
          items:
            type: object
            required: [type, submitted]
            properties:
              type:
                type: string
              submitted:
                type: integer
        problems:
          type: array
          items:
            type: string
            enum: [errors, stale, warnings]

    SearchSitemaps:
      type: object
      required: [read, error, own, submitted, stale_days, rows]
      properties:
        read:
          type: [string, 'null']
          format: date-time
          description: When the sitemaps were last read.
        error:
          type: [string, 'null']
          description: Google's message when the last read failed.
        own:
          type: [string, 'null']
          description: The site's own sitemap index (its SEO plugin's, or WordPress's); null without one.
        submitted:
          type: boolean
          description: False when the site's own sitemap index is not submitted.
        stale_days:
          type: integer
          description: Days without a download after which a sitemap is stale.
        rows:
          type: array
          items:
            $ref: '#/components/schemas/SearchSitemap'

    InspectionsAnswer:
      type: object
      required: [connected, ignored, verdict, coverage, finding, progress, rules, sitemaps, inspected, counts, rows, total, more]
      properties:
        connected:
          type: boolean
          description: Whether Search Console is connected.
        ignored:
          type: array
          items:
            type: string
        verdict:
          type: string
        coverage:
          type: string
        finding:
          type: string
        progress:
          $ref: '#/components/schemas/InspectionProgress'
        rules:
          type: object
          required: [daily, max_daily, recheck_days, budget, stale_days]
          properties:
            daily:
              type: integer
            max_daily:
              type: integer
              description: Google's own limit per property a day.
            recheck_days:
              type: integer
              description: Days before a page is inspected again.
            budget:
              type: integer
              description: Seconds a cron run inspects at most.
            stale_days:
              type: integer
        sitemaps:
          $ref: '#/components/schemas/SearchSitemaps'
        inspected:
          type: integer
          description: Pages inspected.
        counts:
          type: object
          description: Pages per verdict, whatever is asked for.
          additionalProperties:
            type: integer
        rows:
          type: array
          description: Newest inspections first.
          items:
            allOf:
              - $ref: '#/components/schemas/OpportunityPage'
              - $ref: '#/components/schemas/InspectionGoogle'
        total:
          type: integer
        more:
          type: boolean

    CrawlIssue:
      type: string
      enum: [redirect_301, redirect_302, client_error, server_error, robots_blocked, malware, important_blocked, dns, timeout]
      description: A crawl issue of Bing's. Every issue but the redirects is an error.

    CrawlIssueRow:
      type: object
      required: [url, path, http, issues, error, inlinks]
      properties:
        url:
          type: string
        path:
          type: string
          description: Its path on the site; empty when not on it.
        http:
          type: integer
          description: HTTP status Bing got; 0 when none (robots.txt, DNS).
        issues:
          type: array
          items:
            $ref: '#/components/schemas/CrawlIssue'
        error:
          type: boolean
          description: True unless its only issues are redirects.
        inlinks:
          type: integer
          description: Links to it Bing knows.

    BingLinksRead:
      type: object
      description: The weekly read of Bing's inbound links into /backlinks (source bing).
      required: [read, started, running, targets, links, error]
      properties:
        read:
          type: [string, 'null']
          format: date-time
          description: When the last whole read ended.
        started:
          type: [string, 'null']
          format: date-time
        running:
          type: boolean
          description: True while a read carries on in the hourly import.
        targets:
          type: integer
          description: The site's pages with links Bing knows, read so far.
        links:
          type: integer
          description: Links stored by this read.
        error:
          type: [string, 'null']

    CrawlIssuesAnswer:
      type: object
      required: [engine, connected, site, issue, read, error, counts, rows, total, more, stats, sitemaps, quota, links, rules]
      properties:
        engine:
          type: string
          enum: [bing]
        connected:
          type: boolean
          description: Whether Bing Webmaster Tools is connected.
        site:
          type: [string, 'null']
        issue:
          type: string
        read:
          type: [string, 'null']
          format: date-time
          description: When the crawl facts were last read.
        error:
          type: [string, 'null']
          description: Why part of the last daily read failed; what was read before stays.
        counts:
          type: object
          description: Addresses per issue, and errors, whatever is asked for.
          additionalProperties:
            type: integer
        rows:
          type: array
          description: Errors first, then most inbound links.
          items:
            $ref: '#/components/schemas/CrawlIssueRow'
        total:
          type: integer
        more:
          type: boolean
        stats:
          type: array
          description: Bing's crawl by day, oldest first, up to 60 days.
          items:
            type: object
            required: [day, crawled, errors, in_index, inlinks]
            properties:
              day: { type: string, format: date }
              crawled: { type: integer }
              errors: { type: integer }
              in_index: { type: integer }
              inlinks: { type: integer }
              code_2xx: { type: integer }
              code_301: { type: integer }
              code_302: { type: integer }
              code_4xx: { type: integer }
              code_5xx: { type: integer }
              robots_blocked: { type: integer }
              dns: { type: integer }
              timeout: { type: integer }
              malware: { type: integer }
              other: { type: integer }
        sitemaps:
          type: array
          items:
            type: object
            required: [url, type, status, submitted, crawled, urls]
            properties:
              url: { type: string }
              type: { type: string }
              status: { type: string, description: "Bing's word, such as Success." }
              submitted: { type: [string, 'null'], format: date-time }
              crawled: { type: [string, 'null'], format: date-time }
              urls: { type: integer }
        quota:
          description: The URL submission quota; null until read.
          oneOf:
            - type: object
              required: [daily, monthly]
              properties:
                daily: { type: integer }
                monthly: { type: integer }
            - type: 'null'
        links:
          $ref: '#/components/schemas/BingLinksRead'
        rules:
          type: object
          required: [requests, budget, max_issues, max_links]
          properties:
            requests: { type: integer, description: Most requests to Bing a run. }
            budget: { type: integer, description: Seconds a run reads at most. }
            max_issues: { type: integer }
            max_links: { type: integer, description: Most links a weekly read stores. }

    BacklinkKind:
      type: string
      enum: [links, domains, pages, lost, reported, needs, impact]
      default: links

    BacklinkDecision:
      type: object
      required: [scope, target, decision, imported, user_id, reviewed]
      properties:
        scope: { type: string, enum: [domain, url] }
        target: { type: string }
        decision: { type: string, enum: [keep, disavow, undecided] }
        imported: { type: boolean }
        user_id: { type: integer, minimum: 0 }
        reviewed: { type: integer, minimum: 0, description: 'Unix seconds, zero if no decision yet.' }
    BacklinkSignal:
      type: object
      required: [signal, weight, reason]
      properties:
        signal: { type: string }
        weight: { type: integer, minimum: 0, maximum: 100 }
        reason: { type: string }
    BacklinkReviewAnswer:
      type: object
      required: [rows, total, more, max_rows, signals_are_proof]
      properties:
        total: { type: integer }
        more: { type: boolean }
        max_rows: { type: integer, description: 'Bound of each live/lost backlink sample.' }
        signals_are_proof: { type: boolean, enum: [false] }
        rows:
          type: array
          items:
            type: object
            required: [host, score, reasons, decision, links, url_decisions]
            properties:
              host: { type: string }
              score: { type: integer, minimum: 0, maximum: 100 }
              reasons:
                type: array
                items: { $ref: '#/components/schemas/BacklinkSignal' }
              decision: { $ref: '#/components/schemas/BacklinkDecision' }
              url_decisions:
                type: array
                items: { $ref: '#/components/schemas/BacklinkDecision' }
              links:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/BacklinkRow'
                    - type: object
                      required: [score, reasons, decision]
                      properties:
                        score: { type: integer, minimum: 0, maximum: 100 }
                        reasons:
                          type: array
                          items: { $ref: '#/components/schemas/BacklinkSignal' }
                        decision: { $ref: '#/components/schemas/BacklinkDecision' }
    BacklinkRow:
      type: object
      description: A link from a page of another site to one of the site's pages (links and lost).
      required: [id, source, host, page, path_id, anchor, rel, found, first_seen, last_seen, new, authority, classes, site_dr, site_ld, page_dr, page_ld, value, value_from]
      properties:
        id:
          type: integer
          description: The link's id, for POST /backlinks/classify.
        path_id:
          type: integer
          description: The dictionary id of the site's page it links to.
        value:
          type: integer
          minimum: 0
          maximum: 100
          description: What the link is likely worth, an estimate to rank links by and not a search engine's figure (strength × rel factor × class factors; see /backlinks).
        value_from:
          type: string
          enum: [rank, authority, unknown]
          description: Where the strength came from - the linking site's and page's rank, the export's authority, or neither.
        classes:
          type: array
          description: The link's classes - its own (POST /backlinks/classify), its referring page's and the class lists'.
          items: { $ref: '#/components/schemas/BacklinkClass' }
        inherited:
          $ref: '#/components/schemas/BacklinkInherited'
        site_dr:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: The linking site's rank (DR), from a backlink data provider (the Connect add-on); null when not read.
        site_ld:
          type: [integer, 'null']
          minimum: 0
          description: Sites linking to the linking site (LD, referring domains), from a backlink data provider (the Connect add-on); null when not read.
        page_dr:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: The linking page's rank (DR), from a backlink data provider (the Connect add-on); null when not read.
        page_ld:
          type: [integer, 'null']
          minimum: 0
          description: Sites linking to the linking page (LD), from a backlink data provider (the Connect add-on); null when not read.
        source:
          type: string
          description: The page linking (https, its host as visits gave it, without www.).
        host:
          type: string
        page:
          type: string
          description: The site's page it links to (a path).
        anchor:
          type: string
          description: The link's text; an image's alt text in brackets, or [image].
        rel:
          type: array
          items:
            type: string
            enum: [nofollow, sponsored, ugc]
        found:
          type: array
          description: How it was found; referrer, a page that sent visits.
          items:
            type: string
        first_seen:
          type: [string, 'null']
          format: date-time
        last_seen:
          type: [string, 'null']
          format: date-time
        new:
          type: boolean
          description: First found in the period.
        authority:
          type: integer
          description: A provider's score; 0 without one.
        providers:
          type: object
          description: Export scores and freshness kept separately by provider; scores are not comparable across tools.
          additionalProperties:
            type: object
            properties:
              authority:
                type: [integer, 'null']
                minimum: 0
                maximum: 100
              last_seen:
                type: [string, 'null']
                format: date-time
              spam_score:
                type: integer
                minimum: 0
                maximum: 100
                description: Optional observed spam score; never derived from authority.
        facts:
          type: object
          description: Facts from an existing local page check; absent facts remain unknown.
          properties:
            outbound: { type: integer, minimum: 0 }
            language: { type: string }
            script: { type: string }
            link_list: { type: boolean }
            redirects: { type: integer, minimum: 0 }
        lost:
          type: [string, 'null']
          format: date-time
          description: lost; when it was lost.

    BacklinkClass:
      type: string
      description: |
        An owner's class of a link: a key of a class in use on the site
        (GET /backlinks/lists classes). The built-in ones are listed here,
        A to Z by English name (blog is Public Blog, brand_citation
        Citation of Brand Name, nap_citation Citation of Name, Address,
        Phone), then ignore and spam. A site can turn built-in classes off
        (they are then unknown to the API, and links keep them) and add up
        to 20 of its own (a–z, 0–9 and _, at most 40 characters) in
        Settings → Backlinks → Classes. The dashboard hides the classes
        marked hidden (ignore and spam to start) until they are asked for.
      pattern: '^[a-z0-9_]{1,40}$'
      examples: [brand_citation, nap_citation, cross_site, documentation, forum, general, guest_post, guide, home_page, integration, link_swap, listicle, logo_linked, monitor, needs_updating, niche_edit, organic_mention, paid_link, partner, press_organic, press_release, private_blog, profile_page, blog, quote, redirect, site_footer, social_media, statistics, topical, url_linked, url_unlinked, video, wiki, ignore, spam]

    BacklinkInherited:
      type: object
      description: |
        The row's classes that come from elsewhere: `page` (its referring
        page's classes) or `list` (a class list in Settings → Backlinks,
        with the matching line). Removing one from the row (POST
        /backlinks/classify, mode remove) keeps it off that row only.
      additionalProperties:
        type: object
        required: [from]
        properties:
          from:
            type: string
            enum: [page, list]
          line:
            type: string

    BacklinkImportJob:
      type: object
      required: [status, source, total, done, accepted, skipped]
      properties:
        status:
          type: string
          enum: [idle, running, done, error]
        source:
          type: string
        total:
          type: integer
        done:
          type: integer
        accepted:
          type: integer
          description: Valid rows processed, including known links and referring-page candidates.
        skipped:
          type: integer
        started:
          type: integer
          description: Unix seconds the job was staged; ties it to its import history entry.
        history:
          type: integer
          description: POST only; the import history entry's id.

    BacklinkDomainRow:
      type: object
      description: A site linking to the site (domains).
      required: [host, classes, links, followed, pages, new, lost, visits, first_seen, last_seen]
      properties:
        host:
          type: string
        classes:
          type: array
          description: The classes the class lists give every link from the site.
          items: { $ref: '#/components/schemas/BacklinkClass' }
        inherited:
          $ref: '#/components/schemas/BacklinkInherited'
        links:
          type: integer
        followed:
          type: integer
          description: Links without nofollow, sponsored or ugc.
        pages:
          type: integer
          description: The site's pages it links to.
        new:
          type: integer
        lost:
          type: integer
          description: Links lost in the period.
        visits:
          type: integer
          description: Its visits in the period (finished days).
        first_seen:
          type: [string, 'null']
          format: date-time
        last_seen:
          type: [string, 'null']
          format: date-time

    BacklinkPageRow:
      type: object
      description: One of the site's pages other sites link to (pages), most useful referring domains first.
      required: [page, links, domains, followed, useful, median_dr, mix, new, first_seen]
      properties:
        page:
          type: string
        links:
          type: integer
        domains:
          type: integer
        followed:
          type: integer
          description: Sites with a followed link.
        useful:
          type: integer
          description: Sites with a useful link, followed and not classed ignore, spam, paid_link, private_blog, profile_page, social_media or url_unlinked.
        median_dr:
          type: [number, 'null']
          description: The linking sites' median DR (each site's best), null when none was read.
        mix:
          type: object
          description: The class mix, sites with a link of each class.
          required: [topical, general, press_release, profile_page, social_media, spam]
          additionalProperties: { type: integer }
        new:
          type: integer
        first_seen:
          type: [string, 'null']
          format: date-time

    BacklinkNeedRow:
      description: A page with searches in striking distance, and the links to it now (needs).
      allOf:
        - $ref: '#/components/schemas/OpportunityPage'
        - type: object
          required: [page, potential, impressions, clicks, position, queries, domains, followed, useful, top_median, gap, links, value, need]
          properties:
            page:
              type: string
              description: The page's path, as path.
            potential:
              type: integer
              description: Clicks its striking-distance searches could gain in the top three, in the period.
            impressions:
              type: integer
            clicks:
              type: integer
            position:
              type: number
              description: Their average position, weighted by impressions.
            queries:
              type: array
              description: Its best striking-distance searches (at most search.rules.queries).
              items:
                type: object
                required: [query_id, query, impressions, position, potential]
                properties:
                  query_id: { type: integer }
                  query: { type: string }
                  impressions: { type: integer }
                  position: { type: number }
                  potential: { type: integer }
            domains:
              type: integer
              description: Sites linking to it now (ignore and spam left out).
            followed:
              type: integer
              description: Of them, sites with a followed link.
            useful:
              type: integer
              description: Useful referring domains, sites with a followed link not classed ignore, spam, paid_link, private_blog, profile_page, social_media or url_unlinked.
            top_median:
              type: number
              description: The median useful referring domains of the site's pages in the top three (search.top.median).
            gap:
              type: number
              description: top_median − useful; more than 0 on every row.
            links:
              type: integer
            value:
              type: integer
              description: The sum of each linking site's best link value.
            need:
              type: integer
              description: potential × gap, rounded; the list's order.

    BacklinkImpactWindow:
      type: object
      description: A page's (or the site's) search per day in a window of days.
      required: [days, clicks, impressions, position]
      properties:
        days: { type: integer }
        clicks: { type: number }
        impressions: { type: number }
        position: { type: number }

    BacklinkImpactRow:
      description: A page that gained useful referring domains in the period, and its search before and after the first new link (impact). Associated with the links, not proof they caused the change; change_id starts an experiment that can test it.
      allOf:
        - $ref: '#/components/schemas/OpportunityPage'
        - type: object
          required: [page, new_domains, hosts, useful, links, value, first_seen, change_id, status, before, after, change, impressions_change, position_change, site_change, relative]
          properties:
            page:
              type: string
              description: The page's path, as path.
            new_domains:
              type: integer
              description: Useful referring domains whose first useful link to the page was found in the period.
            hosts:
              type: array
              description: The first of them (at most 5), first found first.
              items:
                type: object
                required: [host, source, links, value, first_seen]
                properties:
                  host: { type: string }
                  source:
                    type: string
                    description: Its first page found linking.
                  links: { type: integer }
                  value:
                    type: integer
                    description: Its best link value.
                  first_seen:
                    type: string
                    format: date-time
            useful:
              type: integer
              description: Useful referring domains now.
            links:
              type: integer
              description: Links from the new sites.
            value:
              type: integer
              description: The new sites' best link value.
            first_seen:
              type: string
              format: date-time
              description: When the first new link was found; the windows meet on its day.
            change_id:
              type: [integer, 'null']
              description: The first new site's backlink_new change (its first from that day, else its last before), to start an experiment from (POST /experiments with change); null when none was written.
            status:
              type: string
              enum: [measured, measuring, no_data]
              description: measured, a whole window after; measuring, fewer days so far; no_data, too few days before or no impressions either side.
            before: { $ref: '#/components/schemas/BacklinkImpactWindow' }
            after: { $ref: '#/components/schemas/BacklinkImpactWindow' }
            change:
              type: [number, 'null']
              description: Percent change in clicks per day; null without any before.
            impressions_change:
              type: [number, 'null']
            position_change:
              type: [number, 'null']
              description: Change in average position (negative is better); null without impressions either side.
            site_change:
              type: [number, 'null']
              description: The whole site's percent change in clicks per day in the same days.
            relative:
              type: [number, 'null']
              description: change − site_change, in points.

    BacklinksAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [range, kind, totals, read, rules, rows, total, more]
          properties:
            range:
              $ref: '#/components/schemas/Range'
            kind:
              $ref: '#/components/schemas/BacklinkKind'
            totals:
              type: object
              required: [domains, links, pages, new, new_domains, lost, reported, reported_domains, reported_checked]
              description: Live links, the sites and pages they join, the links (and sites) new and lost in the period, and the referring pages link exports named (their sites, and how many were opened).
              properties:
                domains:
                  type: integer
                links:
                  type: integer
                pages:
                  type: integer
                new:
                  type: integer
                new_domains:
                  type: integer
                lost:
                  type: integer
                reported:
                  type: integer
                reported_domains:
                  type: integer
                reported_checked:
                  type: integer
            read:
              type: object
              required: [enabled, pages, checked, last, errors, next]
              properties:
                enabled:
                  type: boolean
                  description: Whether the check is on (Settings → Data); always true for the demo data.
                pages:
                  type: integer
                  description: Referring pages known.
                checked:
                  type: integer
                  description: Those checked at least once.
                last:
                  type: [string, 'null']
                  format: date-time
                errors:
                  type: integer
                  description: Pages that could not be opened in the last run.
                next:
                  type: [string, 'null']
                  format: date-time
                  description: The catch-up's next run, while pages a link export named wait for their first check (live data).
            rules:
              type: object
              required: [recheck_days, misses, budget, max_rows]
              properties:
                recheck_days:
                  type: integer
                misses:
                  type: integer
                  description: Checks in a row without a link before it is lost.
                budget:
                  type: integer
                  description: Seconds a daily run may take.
                max_rows:
                  type: integer
                  description: Links read per list at most.
            rows:
              type: array
              items:
                oneOf:
                  - $ref: '#/components/schemas/BacklinkRow'
                  - $ref: '#/components/schemas/BacklinkDomainRow'
                  - $ref: '#/components/schemas/BacklinkPageRow'
                  - $ref: '#/components/schemas/BacklinkReportedRow'
                  - $ref: '#/components/schemas/BacklinkNeedRow'
                  - $ref: '#/components/schemas/BacklinkImpactRow'
            engine:
              type: string
              enum: [google, bing, all]
              description: needs and impact; the engine whose search data they read.
            engines:
              type: array
              description: needs and impact; engines with data or connected.
              items: { $ref: '#/components/schemas/SearchEngine' }
            combined:
              type: boolean
              description: needs and impact; whether Combined adds two or more engines up.
            connected:
              type: boolean
              description: needs and impact; whether the engine's source is connected (always true for the demo data).
            search:
              type: object
              description: needs and impact; the search period read (needs) or the newest and first search day (impact), and their rules.
              properties:
                range:
                  oneOf:
                    - $ref: '#/components/schemas/Range'
                    - type: 'null'
                days: { type: integer }
                through: { type: string }
                first: { type: string }
                rules:
                  type: object
                  description: needs, striking distance's rules with queries; impact, window, min_before and max_pages.
                  additionalProperties: { type: number }
                top:
                  type: object
                  description: needs; the site's pages in the top three in the period (average position 3 or better, with striking distance's least impressions) and their median useful referring domains, the benchmark of each row's gap.
                  required: [pages, median]
                  properties:
                    pages: { type: integer }
                    median: { type: number }
            facets:
              type: object
              description: links, lost, domains and reported — the whole list before filters, for the dashboard's filters.
              required: [classes, max]
              properties:
                classes:
                  type: object
                  description: Links per class name, and none for those without one.
                  additionalProperties: { type: integer }
                max:
                  type: object
                  description: The highest site_dr, site_ld, page_dr and page_ld.
                  additionalProperties: { type: integer }
            total:
              type: integer
              description: Rows of the list after filters and search.
            more:
              type: boolean

    BacklinkReportedRow:
      type: object
      description: A referring page a link export named (reported), and its check.
      required: [id, source, host, found, state, links, targets, reported, checked, providers, classes]
      properties:
        id:
          type: integer
          description: The page's id, for POST /backlinks/classify (pages).
        classes:
          type: array
          description: The page's classes (every link on it has them) and the class lists'.
          items: { $ref: '#/components/schemas/BacklinkClass' }
        inherited:
          $ref: '#/components/schemas/BacklinkInherited'
        source:
          type: string
          description: The page linking, as the export gave it.
        host:
          type: string
        found:
          type: array
          items:
            type: string
        state:
          type: string
          enum: [unchecked, links, none, error, gone]
          description: Not opened yet; links to the site found; none seen; could not be opened (tried again); gone (404 or 410).
        links:
          type: integer
          description: Live links to the site found on it.
        targets:
          type: array
          description: Those live links, first found first, of the report's bounded read.
          items:
            type: object
            required: [page, anchor, rel, first_seen]
            properties:
              page:
                type: string
                description: The page of this site it links to (path).
              anchor:
                type: string
                description: The link's text, or the image's alt text; empty when it has none.
              rel:
                type: array
                items:
                  type: string
                  enum: [nofollow, sponsored, ugc]
              first_seen:
                type: [string, 'null']
                format: date-time
        reported:
          type: [string, 'null']
          format: date-time
          description: The export's newest date for it.
        checked:
          type: [string, 'null']
          format: date-time
        providers:
          type: object
          additionalProperties:
            type: object
            properties:
              authority:
                type: [integer, 'null']
              last_seen:
                type: [string, 'null']
                format: date-time

    BacklinkImportEntry:
      type: object
      description: One link export import, newest first; at most 20 kept, their files up to 200 MB in all.
      required: [id, started, finished, user, via, name, bytes, sha256, file, source, status, total, done, accepted, skipped]
      properties:
        id:
          type: integer
        started:
          type: string
          format: date-time
        finished:
          type: [string, 'null']
          format: date-time
        user:
          type: string
          description: Display name of who imported it; empty for cron or a removed user.
        via:
          type: string
          enum: [upload, cli, rest]
        name:
          type: string
          description: The file's name as uploaded (rows.json for JSON rows).
        bytes:
          type: integer
        sha256:
          type: string
          description: Of the kept file; empty when none was kept.
        file:
          type: boolean
          description: Whether the file is kept to download again (/backlinks/imports/{id}/file).
        source:
          type: string
        status:
          type: string
          enum: [running, done, error]
        total:
          type: integer
        done:
          type: integer
        accepted:
          type: integer
        skipped:
          type: integer

    SearchEngine:
      type: string
      enum: [google, bing, all]
      description: The search engine answered for; all (Combined) only in the search, opportunities and content answers.

    SearchEngines:
      type: array
      description: The engines with search data or a connected source, Google first (at least Google).
      items:
        type: string
        enum: [google, bing]

    SearchCombined:
      type: boolean
      description: Whether engine=all (Combined) adds anything up, two or more engines having data; without, all answers as the one engine with data.

    ContentMetrics:
      description: Search figures (the chosen engine's) with the visits from organic search that started on the page.
      allOf:
        - $ref: '#/components/schemas/SearchMetrics'
        - type: object
          required: [visits, bounce_rate, views_per_visit, visit_duration, conversions, conversion_rate]
          properties:
            visits:
              type: integer
              description: Visits from organic search (any engine) that started on the page.
            bounce_rate:
              type: number
            views_per_visit:
              type: number
            visit_duration:
              type: integer
              description: Seconds.
            conversions:
              type: [integer, 'null']
              description: Of those visits, the ones that reached the goal; null without goals.
            conversion_rate:
              type: [number, 'null']
              description: conversions ÷ visits; null without goals.

    ContentChange:
      description: As SearchChange, with relative changes of the visit metrics and conversions.
      type: object
      additionalProperties:
        type: [number, 'null']

    ContentRow:
      allOf:
        - $ref: '#/components/schemas/OpportunityPage'
        - $ref: '#/components/schemas/ContentMetrics'
        - type: object
          required: [id, value, label]
          properties:
            id:
              type: string
            value:
              type: string
            label:
              type: string
            owner:
              $ref: '#/components/schemas/OwnerOrHidden'
            compare:
              description: The comparison period.
              allOf:
                - $ref: '#/components/schemas/ContentMetrics'
                - type: object
                  required: [change]
                  properties:
                    change:
                      $ref: '#/components/schemas/ContentChange'

    ContentAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [engine, engines, combined, range, through, first, connected, ignored, sort, order, goal, goals, landings_from, partial, totals, rows, total, more]
          properties:
            engine:
              $ref: '#/components/schemas/SearchEngine'
            engines:
              $ref: '#/components/schemas/SearchEngines'
            combined:
              $ref: '#/components/schemas/SearchCombined'
            range:
              $ref: '#/components/schemas/Range'
            through:
              type: string
              description: Newest day with search data (YYYY-MM-DD); empty with none.
            first:
              type: string
              description: Oldest day with search data (YYYY-MM-DD); empty with none.
            connected:
              type: boolean
              description: Whether the engine's source is connected (demo data, always).
            ignored:
              type: array
              description: Filter dimensions left out (only page filters apply to search data).
              items:
                type: string
            sort:
              type: string
              enum: [impressions, clicks, ctr, position, visits, bounce_rate, visit_duration, conversions, conversion_rate]
              description: The order applied (the default when a goal's column was asked without goals).
            order:
              type: string
              enum: [desc, asc]
            goal:
              type: [object, 'null']
              description: The goal counted; null without goals.
              required: [id, name, kind, match]
              properties:
                id:
                  type: string
                name:
                  type: string
                kind:
                  type: string
                match:
                  type: string
            goals:
              type: array
              description: Every goal, to choose another.
              items:
                type: object
                required: [id, name]
                properties:
                  id:
                    type: string
                  name:
                    type: string
            landings_from:
              type: string
              description: Oldest day whose visits from search are counted (YYYY-MM-DD); empty before the first summary.
            partial:
              type: boolean
              description: Whether some days of the period or comparison are still to be filled in.
            totals:
              $ref: '#/components/schemas/ContentMetrics'
            rows:
              type: array
              items:
                $ref: '#/components/schemas/ContentRow'
            total:
              type: integer
              description: All pages with search clicks or visits from search.
            more:
              type: boolean
              description: Whether there are more rows after these.
            compare:
              type: object
              required: [range, totals, change]
              properties:
                range:
                  $ref: '#/components/schemas/Range'
                totals:
                  $ref: '#/components/schemas/ContentMetrics'
                change:
                  $ref: '#/components/schemas/ContentChange'

    DemoStatus:
      type: object
      required: [status, days, progress, from, made, viewing]
      properties:
        status:
          type: string
          enum: [none, making, ready]
        days:
          type: integer
          description: Days of visits asked for.
        progress:
          type: number
          description: 0 to 1.
        from:
          type: [string, 'null']
          format: date-time
          description: Start of the first demo day.
        made:
          type: [string, 'null']
          format: date-time
          description: When it was ready.
        viewing:
          type: string
          enum: [live, demo]
          description: The data set the signed-in person chose to see.

    Connection:
      type: object
      description: |
        An outside data source's status, without credentials. Fields after
        `connected` are there only while it is connected. Days are the
        source's own (Bing: UTC). A connection the add-on registers with
        its own read gives its own fields instead of `imported` and the
        fields after it.
      required: [source, name, connected]
      properties:
        source:
          type: string
        name:
          type: string
        connected:
          type: boolean
        method:
          type: string
          enum: [google, key]
          description: How it is connected, Sign in with Google or a key.
        account:
          type: string
          description: The key's account, where the source names one.
        property:
          type: string
        connected_at:
          type: integer
          description: Unix time.
        imported:
          type: object
          required: [from, to, days, of, complete]
          properties:
            from:
              type: string
              description: First day with data ('' when none).
            to:
              type: string
              description: Last day with data.
            days:
              type: integer
              description: Days the job has been through, of `of`.
            of:
              type: integer
              description: Days in the history the source keeps, back to the property's first search.
            complete:
              type: boolean
        final_through:
          type: string
          description: The newest day the source says is final ('' before the first check).
        checked:
          type: integer
          description: When it was last asked for new final days (Unix time; 0 never).
        last_run:
          type: integer
        next_run:
          type: integer
          description: When the job runs next (Unix time; 0 none).
        error:
          type: string
          description: The last run's error ('' none).
        error_at:
          type: integer
        imports:
          type: array
          description: The last five imports, newest first.
          items:
            $ref: '#/components/schemas/Import'

    Import:
      type: object
      required: [id, source, status, started, finished, from, to, days, rows, error]
      properties:
        id:
          type: integer
        source:
          type: string
        status:
          type: string
          enum: [running, done, failed, undone]
        started:
          type: integer
        finished:
          type: integer
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        days:
          type: integer
        rows:
          type: integer
        error:
          type: string

    MigratePlugin:
      type: object
      description: The plugin's file and state on this site.
      required: [file, state]
      properties:
        file:
          type: string
          description: Empty when it is not installed.
        state:
          type: string
          enum: [active, network, inactive, missing]

    MigrateLeftovers:
      type: object
      description: Exactly what the plugin leaves on this site now.
      properties:
        tables:
          type: array
          items:
            type: string
        options:
          type: array
          items:
            type: string
        transients:
          type: array
          items:
            type: string
        cron:
          type: array
          items:
            type: string
        user_meta:
          type: array
          items:
            type: string
        post_meta:
          type: array
          description: Post meta keys, removed from every post.
          items:
            type: string
        roles:
          type: array
          description: User roles the plugin added (users keep their other roles).
          items:
            type: string
        files:
          type: array
          description: Relative to wp-content; folders end in /.
          items:
            type: string
        network:
          type: object
          description: Multisite, shared by the whole network; listed, never deleted.
          additionalProperties:
            type: array
            items:
              type: string

    MigrateSkipped:
      type: object
      properties:
        own:
          type: integer
          description: Days SEO Pro Analytics has its own statistics for.
        imported:
          type: object
          description: Days another import filled, by its plugin.
          additionalProperties:
            type: integer
        empty:
          type: integer
        failed:
          type: integer

    MigrateCounts:
      type: object
      properties:
        pageviews:
          type: integer
        visits:
          type: integer
        visitors:
          type: integer

    MigrateJob:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [none, running, done]
        queue:
          type: array
          description: The plugins it imports, the preferred one first.
          items:
            type: object
            properties:
              source:
                type: string
              name:
                type: string
              id:
                type: integer
                description: Its imports row (0 before it starts).
              total:
                type: integer
              done:
                type: integer
              rows:
                type: integer
              error:
                type: string
              notice:
                type: string
                description: Why it waits for a remote source (Jetpack Stats on WordPress.com busy or not answering); '' when it does not.
              wait:
                type: integer
                description: Unix time until which it waits for that source (0 when it does not).
        started:
          type: integer
        finished:
          type: integer

    MigrateImport:
      type: object
      properties:
        id:
          type: integer
        source:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [running, done, failed, undone]
        started:
          type: integer
        finished:
          type: integer
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        days:
          type: integer
        rows:
          type: integer
        version:
          type: string
          description: The plugin's version as it recorded it.
        skipped:
          $ref: '#/components/schemas/MigrateSkipped'
        check:
          type: object
          description: The plugin's own counts for the imported days beside the imported ones (visitors are counted once across the range by the plugin, per day once imported).
          properties:
            source:
              $ref: '#/components/schemas/MigrateCounts'
            imported:
              $ref: '#/components/schemas/MigrateCounts'
        settings:
          type: object
          description: Settings it filled in, by key, each [before, after] in words.
          additionalProperties:
            type: array
            items:
              type: string
        error:
          type: string

    MigrateStatus:
      type: object
      required: [sources, job, own_from, imports, can]
      properties:
        sources:
          type: object
          description: Plugins found, by key.
          additionalProperties:
            type: object
            properties:
              key:
                type: string
              name:
                type: string
              version:
                type: string
              from:
                type: string
                description: First day with statistics ('' when only leftovers are left).
              to:
                type: string
              days:
                type: integer
              plugin:
                $ref: '#/components/schemas/MigratePlugin'
              leftovers:
                type: boolean
                description: Whether it left data behind (only looked at while it is not active).
              uninstall_setting:
                type: object
                nullable: true
                description: Its own "delete data when uninstalled" setting, if it has one.
                properties:
                  key:
                    type: string
                  label:
                    type: string
                  where:
                    type: string
                  'on':
                    type: boolean
              unavailable:
                type: string
                description: Why its history cannot be imported now, though the plugin is in use (Jetpack Stats not connected to WordPress.com, too old, or its history still being looked up); '' when nothing stops it. The dry run and import answer with it as their error (409).
        job:
          $ref: '#/components/schemas/MigrateJob'
        own_from:
          type: string
          format: date
          description: SEO Pro Analytics's own first day; only days before it are imported.
        imports:
          type: array
          items:
            $ref: '#/components/schemas/MigrateImport'
        can:
          type: object
          properties:
            import:
              type: boolean
            cleanup:
              type: boolean

    MigratePlan:
      type: object
      description: The dry run.
      properties:
        source:
          type: string
        name:
          type: string
        version:
          type: string
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        own_from:
          type: string
          format: date
        days:
          type: integer
          description: Days with statistics in the range.
        import:
          type: object
          description: The days it would add.
          properties:
            days:
              type: integer
            from:
              type: string
            to:
              type: string
        skipped:
          $ref: '#/components/schemas/MigrateSkipped'
        overlap:
          type: array
          description: Plugins not imported yet with statistics on the same days.
          items:
            type: object
            properties:
              source:
                type: string
              name:
                type: string
              from:
                type: string
              to:
                type: string
              days:
                type: integer
              pageviews:
                type: object
                description: Each plugin's pageviews over the shared days, by key.
                additionalProperties:
                  type: integer
              suggested:
                type: string
                description: The one with more pageviews.
        prefer:
          type: string
        rows:
          type: object
          description: Rows it would add by report (site, page, entry, exit, source, channel, country, device, browser, os, utm_*, landing), estimated from three of its days.
          additionalProperties:
            type: integer
        totals:
          $ref: '#/components/schemas/MigrateCounts'
        estimated:
          type: boolean
          description: True when the plugin's tables are large (over 250,000 rows by table statistics) and its totals were estimated from three of its days; the check after import uses exact counts.
        settings:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              label:
                type: string
              theirs:
                type: string
                description: Its own name for the setting.
              from:
                type: string
                description: Its value, in words.
              now:
                type: string
              to:
                type: string
              change:
                type: boolean
                description: Whether the import fills it in (only settings still at their default); the import's `settings` can leave it out.
              reason:
                type: string
                enum: ['', set, same]
                description: Why it would not change, when it would not; `same` (already its value) before `set` (changed from the default).
        plugin:
          $ref: '#/components/schemas/MigratePlugin'

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            status:
              type: integer
